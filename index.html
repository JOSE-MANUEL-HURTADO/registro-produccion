function sheetPrecios(){
  if(!isGerente()) return;
  const base = S.sel.size ? selItems() : S.items;
  const ops = [...grp(base, i => i.op || '').entries()].filter(([op]) => op).sort((a, b) => nat(a[0], b[0]));
  if(!ops.length) return toast('No hay OP para ponerles precio', true);
  const pr = is => { const v = [...new Set(is.map(i => com(i).precio).filter(x => x != null).map(Number))]; return v.length === 1 && is.every(i => com(i).precio != null) ? v[0] : null; };
  const sinP = is => is.filter(i => com(i).precio == null).length;
  const hay = ops.some(([, is]) => sinP(is));
  window._pr = {ops, solo: hay};
  const fila = ([op, is], k) => { const i0 = is[0], p = pr(is), sp = sinP(is), varios = p == null && sp < is.length;
    return `<div class="prF" data-sin="${sp ? 1 : 0}" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px">
      <span style="flex:1"><b>${esc(op)}</b> · ${esc(i0.item || '')} · ${esc(i0.diseno || '')}<br><small>${i0.ancho ? fmtN(i0.ancho) + ' × ' + fmtN(i0.alto) + ' · ' : ''}${fmtN(is.length)} und.${sp ? ` · <b style="color:var(--danger)">${fmtN(sp)} sin precio</b>` : ''}${varios ? ' · precios distintos' : ''}</small></span>
      <input class="prQ" data-k="${k}" inputmode="numeric" placeholder="${varios ? 'varios' : 'Precio unit.'}" value="${p != null ? fmtN(p) : ''}" style="width:130px;min-height:38px;padding:6px 8px;text-align:right"></div>`; };
  const body = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button class="btn sm" onclick="document.getElementById('prXls').click()">${ICON.up} Cargar desde la cotización (Excel)</button>
      <input type="file" id="prXls" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="if(this.files[0]) preciosCotizacion(this.files[0])">
      <button class="btn sm primary" onclick="document.getElementById('prLiq').click()">${ICON.up} Precios reales de la liquidación (ejecutado)</button>
      <input type="file" id="prLiq" accept=".xlsx,.xls,.xlsm" style="display:none" onchange="if(this.files[0]) preciosLiquidacion(this.files[0])">
      <button class="btn sm ghost" onclick="preciosLotes()">Ver / reversar cambios</button></div>
    <div class="sc-note" style="margin-bottom:6px">Escribe el <b>precio unitario</b> de cada OP: se aplica a todas sus unidades.${S.sel.size ? ` Solo las OP de los <b>${fmtN(S.sel.size)}</b> ítems seleccionados.` : ''}</div>
    ${hay ? `<label class="switch" style="margin:4px 0 8px"><span>Mostrar solo las OP sin precio</span><button class="tgl on" id="prSolo" onclick="_pr.solo=!_pr.solo; this.classList.toggle('on', _pr.solo); document.querySelectorAll('.prF').forEach(f => f.style.display = _pr.solo && f.dataset.sin !== '1' ? 'none' : 'flex')"></button></label>` : ''}
    <div style="max-height:52vh;overflow:auto">${ops.map(fila).join('')}</div>`;
  openSheet('Precios por OP', esc(S.obra), body, 'Guardar precios', async () => {
    const rows = [];
    ops.forEach(([op, is], k) => { const el = document.querySelector(`.prQ[data-k="${k}"]`); const t = el.value.trim(); if(!t) return;
      const v = cNum(t).v; if(v == null || v < 0) return;
      if(pr(is) === v) return;   // sin cambio
      for(const it of is) rows.push({item_id: it.id, precio: v}); });
    const malos = [...document.querySelectorAll('.prQ')].filter(el => el.value.trim() && (cNum(el.value.trim()).v == null)).length;
    if(malos){ toast(`${malos} precio${malos===1?'':'s'} no es un número`, true); return false; }
    if(!rows.length){ toast('No cambiaste ningún precio', true); return false; }
    try{ for(const r of await API.upsertComercial(rows)) S.com.set(r.item_id, {...com({id: r.item_id}), ...r}); }
    catch(e){ toast(errMsg(e), true); return false; }
    toast(`✓ Precio guardado en ${fmtN(rows.length)} ítem${rows.length===1?'':'s'}`); renderObra();
  });
  if(hay) document.querySelectorAll('.prF').forEach(f => f.style.display = f.dataset.sin !== '1' ? 'none' : 'flex');
}

// Lee el Excel de la cotización / liquidación: tabla con "No." (ítem: VF-1, EG-1…) y "VR. UNIT."
// y pone ese precio a todas las unidades de la obra con ese ítem
const itemKey = v => String(v ?? '').toUpperCase().replace(/\s+/g, '');
async function preciosCotizacion(file){
  try{ if(!window.XLSX) await loadScript(XLSX_URL); }catch(e){ return toast(errMsg(e), true); }
  let precios = new Map(), hoja = '';
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    for(const nombre of wb.SheetNames){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header:1, raw:true, defval:''});
      const h = rows.findIndex(r => r.some(c => /^NO\.?$/i.test(String(c).trim())) && r.some(c => /^VR\.?\s*UNIT/i.test(String(c).trim())));
      if(h < 0) continue;
      const iNo = rows[h].findIndex(c => /^NO\.?$/i.test(String(c).trim())), iU = rows[h].findIndex(c => /^VR\.?\s*UNIT/i.test(String(c).trim()));
      for(let r = h + 1; r < rows.length; r++){
        const row = rows[r], cod = itemKey(row[iNo]);
        if(!cod){ if(row.some(c => /SUBTOTAL/i.test(String(c)))) break; continue; }
        const v = typeof row[iU] === 'number' ? row[iU] : cNum(row[iU]).v;
        if(v != null && v > 0 && !precios.has(cod)) precios.set(cod, Math.round(v));
      }
      if(precios.size){ hoja = nombre; break; }
    }
  }catch(e){ return toast('No pude leer ese Excel: ' + errMsg(e), true); }
  if(!precios.size) return toast('No encontré la tabla con las columnas "No." y "VR. UNIT." en ese Excel', true);
  const base = S.sel.size ? selItems() : S.items;
  const porItem = grp(base.filter(i => itemKey(i.item)), i => itemKey(i.item));
  const sinCot = [...porItem.keys()].filter(k => !precios.has(k)).sort(nat);
  const noObra = [...precios.keys()].filter(k => !porItem.has(k)).sort(nat);
  const filas = [...precios.entries()].filter(([k]) => porItem.has(k)).sort((a, b) => nat(a[0], b[0]));
  window._pc = {precios, porItem, todas: false};
  const cuenta = () => { let n = 0; for(const [k, v] of filas) for(const it of porItem.get(k)) if(_pc.todas || com(it).precio == null) if(com(it).precio !== v) n++; return n; };
  const body = `<div class="summary">Archivo <b>${esc(file.name)}</b> · hoja ${esc(hoja)} · <b>${fmtN(precios.size)}</b> ítems con precio.</div>
    <label class="switch" style="margin:8px 0"><span>Reemplazar también los que ya tienen precio</span><button class="tgl" onclick="_pc.todas=!_pc.todas; this.classList.toggle('on', _pc.todas); document.getElementById('shOk').textContent = 'Aplicar a ' + _pc.cuenta() + ' ítems'"></button></label>
    <div style="max-height:40vh;overflow:auto">${filas.map(([k, v]) => { const is = porItem.get(k), ya = is.filter(i => com(i).precio != null), dif = ya.filter(i => com(i).precio !== v);
      return `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="flex:1"><b>${esc(k)}</b> · ${fmtN(is.length)} und. en ${fmtN(new Set(is.map(i => i.op)).size)} OP${dif.length ? ` · <span style="color:var(--danger)">${fmtN(dif.length)} con otro precio</span>` : ''}</span><b>$${fmtN(v)}</b></div>`; }).join('')}</div>
    ${sinCot.length ? `<div class="warn">Ítems de la obra que no están en la cotización: ${esc(sinCot.slice(0, 15).join(', '))}${sinCot.length > 15 ? '…' : ''}. Ponles el precio a mano.</div>` : ''}
    ${noObra.length ? `<div class="sc-note">De la cotización sin OP en la obra (aún no cargadas): ${esc(noObra.slice(0, 15).join(', '))}${noObra.length > 15 ? '…' : ''}</div>` : ''}`;
  _pc.cuenta = cuenta;
  openSheet('Precios desde la cotización', esc(S.obra), body, 'Aplicar a ' + cuenta() + ' ítems', async () => {
    const rows = [];
    for(const [k, v] of filas) for(const it of porItem.get(k)) if((_pc.todas || com(it).precio == null) && com(it).precio !== v) rows.push({item_id: it.id, precio: v});
    if(!rows.length){ toast('No hay precios por cambiar', true); return false; }
    try{ for(const r of await API.upsertComercial(rows)) S.com.set(r.item_id, {...com({id: r.item_id}), ...r}); }
    catch(e){ toast(errMsg(e), true); return false; }
    toast(`✓ Precio puesto en ${fmtN(rows.length)} ítems`); renderObra();
  });
}

// ════════════════════════════════════════════════════════════════
//  PRECIOS DESDE LA LIQUIDACIÓN (lado "OBRA EJECUTADA"), con AIU e IVA sobre la utilidad
//  Cada fila trae ITEM · CANT · … · OP · M2 · VR. UNIT. · VR. TOTAL. Se presupuesta por ítem, nunca por m²:
//  cada OP toma el valor de SU fila. Si una ventana se hizo en varias OP, el valor queda completo en la OP
//  de la fila que lo trae y las demás OP de esa ventana quedan en $0 (así los totales cuadran con la liquidación).
//  El precio de cada unidad = (su parte del subtotal) × (TOTAL / SUBTOTAL de la liquidación).
// ════════════════════════════════════════════════════════════════
function liqLeer(wb){
  const T = v => String(v ?? '').trim().toUpperCase().replace(/\s+/g, ' ');
  const N = v => typeof v === 'number' ? v : cNum(v).v;
  const nombres = [...wb.SheetNames].sort((a, b) => (/LIQUID/i.test(b) ? 1 : 0) - (/LIQUID/i.test(a) ? 1 : 0));
  for(const nombre of nombres){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header:1, raw:true, defval:''});
    // Encabezados del lado ejecutado: fila con ITEM, OP y VR. TOTAL (puede haber varias tablas: adicionales)
    const heads = [];
    rows.forEach((r, i) => { const iItem = r.findIndex(c => T(c) === 'ITEM'); if(iItem < 0) return;
      const after = (re) => r.findIndex((c, j) => j > iItem && re.test(T(c)));
      const iOP = after(/^OP$/), iVT = after(/^VR\.? ?TOTAL/), iVU = after(/^VR\.? ?UNIT/), iC = after(/^CANT/), iM2 = r.findIndex((c, j) => j > iOP && /^M2$/.test(T(c)));
      if(iOP > 0 && iVT > 0) heads.push({i, iItem, iOP, iVT, iVU, iC, iM2}); });
    if(!heads.length) continue;
    const out = {hoja: nombre, filas: [], sinOP: [], avisos: [], subtotal: null, total: null, factor: null};
    const bundles = [];
    heads.forEach((h, k) => {
      const fin = k + 1 < heads.length ? heads[k + 1].i : rows.length;
      let item = '', b = null;
      for(let r = h.i + 1; r < fin; r++){
        const row = rows[r], op = T(row[h.iOP]).replace(/\s/g, ''), vt = N(row[h.iVT]);
        if([row[h.iOP], row[h.iVU], row[h.iItem]].some(c => /^(SUB)?TOTAL/.test(T(c)))) break;
        if(T(row[h.iItem])){ item = T(row[h.iItem]); b = null; }
        const cant = N(row[h.iC]) > 0 ? N(row[h.iC]) : 1;
        if(!/^\d{3,6}-\d+$/.test(op)){ if(vt > 0 && T(row[h.iItem])) out.sinOP.push({item, total: vt}); continue; }
        if(vt > 0){ b = {item, total: vt, filas: [], op}; bundles.push(b); }
        if(!b){ out.avisos.push(`OP ${op} (${item || 'sin ítem'}) no tiene valor en la liquidación`); continue; }
        b.filas.push({op, item, cant, valor: vt > 0 ? vt : 0});
      }
    });
    // Cada OP con el valor de su propia fila; las OP que completan una ventana de otra fila quedan en $0
    const porOP = new Map();
    for(const b of bundles) for(const f of b.filas){
      const x = porOP.get(f.op) || {op: f.op, item: f.item, cant: 0, sub: 0, veces: 0, parteDe: null};
      x.cant += f.cant; x.sub += f.valor; x.veces++; if(!f.valor) x.parteDe = b.op; porOP.set(f.op, x); }
    for(const x of porOP.values()) if(x.veces > 1) out.avisos.push(`La OP ${x.op} aparece ${x.veces} veces en la liquidación: se sumaron (revisa si es un error de digitación)`);
    // SUBTOTAL y TOTAL del lado ejecutado → factor AIU + IVA sobre utilidad
    const h0 = heads[0];
    rows.forEach(r => { for(let j = Math.max(0, h0.iOP - 2); j <= h0.iVU; j++){ const t = T(r[j]);

// ════════════════════════════════════════════════════════════════
//  LIQUIDACIÓN AUTOMÁTICA (solo gerente): contratado = cotización subida a la app (SQL 47);
//  ejecutado = lo instalado en la app. Se recalcula cada vez que se abre, con las OP que haya cargadas.
//  Precio por ÍTEM (nunca por m²): precio unidad = ROUND(VR. UNIT. contratado × TOTAL/SUBTOTAL, 0).
//  Unidades por encima de lo contratado (ventana hecha en varias OP) quedan en $0 salvo que se elija cobrarlas.
// ════════════════════════════════════════════════════════════════
const LIQ_P0 = {admin: 10, imprevistos: 4, utilidad: 6, iva: 19, retegarantia: 10};

    window._lq = {c: data, cobrarExceso: window._lq && window._lq.obra === S.obra ? window._lq.cobrarExceso : false, obra: S.obra}; }
  catch(e){ return toast(/liq_contrato/.test(errMsg(e)) ? 'Falta correr el SQL 47 en Supabase' : errMsg(e), true); }

function liqCalc(){

  const inst = S.items.filter(i => i.instalado).sort((a, b) => nat(a.op, b.op) || a.id - b.id);
  const adic = new Map(), sinItem = [];
  for(const it of inst){ const k = itemKey(it.item); if(!k){ sinItem.push(it); continue; }
    if(K.has(k)) K.get(k).filas.push(it); else { if(!adic.has(k)) adic.set(k, {item: it.item, filas: []}); adic.get(k).filas.push(it); } }

  let subE = 0;
  const lineas = [...K.entries()].sort((a, b) => nat(a[0], b[0])).map(([k, x]) => {
    const n = x.filas.length, cobra = _lq.cobrarExceso ? n : Math.min(n, x.cant);

async function liqSubirCotizacion(file){
  try{ if(!window.XLSX) await loadScript(XLSX_URL); }catch(e){ return toast(errMsg(e), true); }
  const T = v => String(v ?? '').trim().toUpperCase().replace(/\s+/g, ' '), items = [], avisos = []; let hoja = '';
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    for(const nombre of wb.SheetNames){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header:1, raw:true, defval:''});
      const h = rows.findIndex(r => r.some(c => /^NO\.?$/.test(T(c))) && r.some(c => /^VR\.? ?UNIT/.test(T(c))));
      if(h < 0) continue;
      const H = rows[h], f = re => H.findIndex(c => re.test(T(c)));
      const iNo = f(/^NO\.?$/), iU = f(/^VR\.? ?UNIT/), iC = f(/^CANT/), iUb = f(/UBIC/), iD = f(/^DISE|^DESCR/);
      if(iC < 0) avisos.push('No encontré la columna CANT.: se tomó 1 unidad por ítem');
      for(let r = h + 1; r < rows.length; r++){
        const row = rows[r], cod = itemKey(row[iNo]);
        if(!cod){ if(row.some(c => /SUBTOTAL/.test(T(c)))) break; continue; }
        const v = typeof row[iU] === 'number' ? row[iU] : cNum(row[iU]).v, cant = iC >= 0 ? (typeof row[iC] === 'number' ? row[iC] : cNum(row[iC]).v) : 1;
        const ex = items.find(x => itemKey(x.item) === cod);
        if(ex){ ex.cant += cant > 0 ? cant : 0; avisos.push(`Ítem ${cod} repetido en la cotización: se sumó la cantidad`); continue; }
        items.push({item: String(row[iNo]).trim(), ubicacion: iUb >= 0 ? String(row[iUb] || '').trim() : (iD >= 0 ? String(row[iD] || '').trim() : ''), cant: cant > 0 ? cant : (iC >= 0 ? 0 : 1), vr: v > 0 ? Math.round(v) : 0});
      }
      if(items.length){ hoja = nombre; break; }
    }
  }catch(e){ return toast('No pude leer ese Excel: ' + errMsg(e), true); }
  if(!items.length) return toast('No encontré la tabla con las columnas "No." y "VR. UNIT." en ese Excel', true);
  const fila = {obra: S.obra, archivo: file.name, hoja, items, actualizado: new Date().toISOString()};
  const aviso = [...new Set(avisos)].concat(items.filter(x => !x.vr).length ? [`${items.filter(x => !x.vr).length} ítems sin VR. UNIT.`] : []);
  if(aviso.length && !confirm('Avisos al leer la cotización:\n\n' + aviso.join('\n') + '\n\n¿Guardarla de todos modos?')) return;
  try{ const {data, error} = await API.sb.from('liq_contrato').upsert(fila, {onConflict: 'obra'}).select('*').single(); if(error) throw error; _lq.c = data; }
  catch(e){ return toast(errMsg(e), true); }
  toast(`✓ Cotización guardada: ${fmtN(items.length)} ítems`); liqPintar();
}

// ── Obra ejecutada para la liquidación (solo gerente): lo instalado agrupado por ítem y OP, con su precio ──
async function liquidacionExcel(){
  if(!isGerente()) return;
  try{ if(!window.XLSX) await loadScript(XLSX_URL); }catch(e){ return toast(errMsg(e), true); }
  const m3 = v => v == null || v === '' ? '' : Math.round(Number(v)) / 1000;   // mm → metros (como en la cotización)
  const hoja = lista => {
    const g = [...grp(lista, i => itemKey(i.item) + '|' + (i.op || '')).values()]
      .sort((a, b) => nat(itemKey(a[0].item), itemKey(b[0].item)) || nat(a[0].op || '', b[0].op || ''));
    const rows = [['ITEM', 'CANT', 'ANCHO', 'ALTO', 'AREA', 'OP', 'M2', 'VR. UNIT.', 'VR. TOTAL', 'OBSERVACIONES']];
    let tc = 0, tm = 0, tv = 0;
    for(const is of g){ const i0 = is[0], cant = is.length, area = i0.m2 != null ? Number(i0.m2) : (i0.ancho && i0.alto ? Math.round(i0.ancho * i0.alto / 1e4) / 100 : null);
      const precios = [...new Set(is.map(i => com(i).precio).filter(x => x != null).map(Number))];
      const vu = precios.length === 1 ? precios[0] : null, tot = is.reduce((a, i) => a + (Number(com(i).precio) || 0), 0);
      const obs = [precios.length > 1 ? 'Precios distintos entre unidades' : '', is.some(i => com(i).precio == null) ? `${is.filter(i => com(i).precio == null).length} sin precio` : ''].filter(Boolean).join(' · ');
      rows.push([i0.item || '', cant, m3(i0.ancho), m3(i0.alto), area ?? '', i0.op || '', area != null ? Math.round(area * cant * 100) / 100 : '', vu ?? '', tot, obs]);
      tc += cant; tm += area != null ? area * cant : 0; tv += tot; }
    rows.push(['', tc, '', '', '', '', Math.round(tm * 100) / 100, 'SUBTOTAL', tv, '']);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [10, 7, 9, 9, 8, 12, 9, 14, 16, 30].map(w => ({wch: w}));
    for(let r = 1; r < rows.length; r++) for(const c of [7, 8]){ const cell = ws[XLSX.utils.encode_cell({r, c})]; if(cell && cell.t === 'n') cell.z = '#,##0'; }
    return ws;
  };
  const inst = S.items.filter(i => i.instalado), pend = S.items.filter(i => !i.instalado);
  if(!inst.length && !confirm('Esta obra todavía no tiene nada instalado. ¿Descargar igual (solo la hoja de pendientes)?')) return;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, hoja(inst), 'Obra ejecutada');
  XLSX.utils.book_append_sheet(wb, hoja(pend), 'Pendiente por instalar');
  XLSX.writeFile(wb, `LIQUIDACION_${String(S.obra).replace(/[^\w]+/g, '_')}_${today()}.xlsx`);
  toast(`✓ Obra ejecutada: ${fmtN(inst.length)} ítems instalados · pendientes: ${fmtN(pend.length)}`);
}

  if(it.ensamblador || it.dia_inicio) return true;              // ya estaba en ensamble
  if(!(d.ensamblador || d.dia_inicio)) return true;             // no está iniciando
  const f = faltaProc({...it, ...d});
  if(!f.length) return true;
  if(!isGerente()){ toast('No se puede iniciar el ensamble: falta completar ' + f.join(', '), true); return false; }
  if(d._procOk) return true;                                    // el gerente ya confirmó
  return d._procOk = confirm(`Faltan procesos por completar: ${f.join(', ')}.\n\n¿Iniciar el ensamble de todas formas?`);
}
async function dSave(){
  const it = byId(S.detailId), d = S.draft;
  if(d.instalado && !d.fecha_instalacion) return toast('Falta la fecha de instalación', true);
  if(d.instalado && !String(d.instalador || '').trim()) return toast('Falta el instalador', true);
  if(d.instalado && !it.instalado && !d.despachado) return toast('No se puede instalar: el ítem no está despachado', true);
  if(puedeRegistrar()){
  if(d.despachado && !d.fecha_despacho) return toast('Falta la fecha de despacho', true);
  if(d.despachado && !d.remision) return toast('Falta el número de remisión', true);
  if(d.instalado && !d.fecha_instalacion) return toast('Falta la fecha de instalación', true);
  if((d.dia_inicio||d.dia_final) && !d.ensamblador) return toast('Falta el ensamblador', true);
  if(d.dia_final && !d.dia_inicio) return toast('Falta el día de inicio', true);
  if(!ensambleOk(it, d)) return;
  const qp = quitaProc(it, d);
  if(qp.length){ if(!isGerente()) return toast('Este ítem ya está en ensamble: no se puede quitar ' + qp.join(', '), true);
    if(!confirm(`El ítem ya está en ensamble y le vas a quitar ${qp.join(', ')}. ¿Continuar?`)) return; }
  if(d.despachado && !it.despachado && !estaEnsamblado({...it, ...d, despachado:false})) return toast('No se puede despachar: el ítem no está ensamblado', true);
  if(it.despachado && d.despachado && it.dia_final && !d.dia_final) return toast('El ítem está despachado: no se puede quitar el día final del ensamble', true);
  if(d.dia_final && d.dia_inicio && d.dia_final < d.dia_inicio) return toast('El día final es anterior al de inicio', true);
  }
  // Solo se envían los campos que esta persona cambió (comparado con lo que había al abrir el ítem),
  // para no deshacer lo que otro usuario haya guardado mientras tanto.
  const patch = {};
  for(const k of EDITABLE){
    if((d[k] ?? null) !== (d._base[k] ?? null)) patch[k] = nz(d[k]);
  }
  const ns = deriveStatus({...it, ...patch});
  if(ns !== it.status) patch.status = ns;
  let cpatch = null;
  if(d.c){
    for(const k of ['despacho','instalacion']) if(d.c['cobrado_'+k] && !d.c['fecha_corte_'+k]) return toast('Falta la fecha de corte del cobro de '+(k==='despacho'?'despacho':'instalación'), true);
    const c0 = d._base.c || {};
    for(const k of COM_KEYS) if((d.c[k] ?? null) !== (c0[k] ?? null)){ cpatch = cpatch || {}; cpatch[k] = d.c[k]; }
  }
  if(!Object.keys(patch).length && !cpatch){ d._dirty=false; return renderDetail(); }
  try{
    if(Object.keys(patch).length){
      const rows = await API.update([it.id], patch);
      mergeRows(rows.length ? rows : [{...it, ...patch}]);
    }
    if(cpatch && isGerente()){
      const rc = await API.upsertComercial([{item_id: it.id, ...cpatch}]);
      rc.forEach(r => S.com.set(r.item_id, r));
    } else if(cpatch){
      for(const k of ['despacho','instalacion']){
        if(!Object.keys(cpatch).some(x => x.endsWith('_'+k))) continue;
        if(!(k==='despacho' ? it.despachado : it.instalado)){ toast('Este ítem no está '+(k==='despacho'?'despachado':'instalado')+'; no se puede registrar ese cobro', true); continue; }
        await API.marcarCobros([it.id], k, !!d.c['cobrado_'+k], d.c['fecha_corte_'+k], d.c['num_corte_'+k]);
      }
      for(const r of await API.cobros([it.id])) S.com.set(r.item_id, r);
    }
    S.draft = draftOf(byId(it.id));
    toast('✓ Ítem guardado');
    refreshAfterChange();
  }catch(e){ toast(errMsg(e), true); }
}

// Aplica cambios a varios ítems agrupando los que quedan con el mismo cambio
async function applyGroup(items, patchFn){
  const groups = new Map();
  for(const it of items){
    const p = patchFn(it); if(!p) continue;
    const ns = deriveStatus({...it, ...p});
    if(ns !== it.status) p.status = ns;
    const key = JSON.stringify(p);
    if(!groups.has(key)) groups.set(key, {p, ids:[]});
    groups.get(key).ids.push(it.id);
  }
  let n = 0;
  for(const {p, ids} of groups.values()){
    const rows = await API.update(ids, p);
    mergeRows(rows.length ? rows : ids.map(id => ({...byId(id), ...p})));
    n += ids.length;
  }
  S.sel.clear();
  refreshAfterChange();
  toast(`✓ ${fmtN(n)} ítem${n===1?'':'s'} actualizado${n===1?'':'s'}`);
}

// Una OP a la vez: false = no se puede (o el director no confirmó)
async function ensChkUnaOp(ens, op, ids){
  let v; try{ v = await API.ensOpsAbiertas(ens, op, ids); }catch(e){ return true; }   // sin SQL 72: la base no revisa
  if(!v) return true;
  const msg = `${ens} tiene sin terminar la OP ${v}. Debe terminarla, o reportarla con novedad (en espera), antes de iniciar la OP ${op}.`;
  if(isGerente()) return confirm(msg + '\n\nComo director puedes iniciarla de todas formas. ¿Continuar?');
  toast(msg, true); return false;
}

//  (6235-3.1, 6235-3.2…): al escanear se elige cuántas / cuáles quedan registradas.

const SC_EST = [
  ...PROCS.filter(([k]) => k !== 'programado').map(([k,t]) => ({k, t, proc:true})),   // la programación se hace desde la app, no se escanea
  {k:'ini',  t:'Inicio ensamble'},
  {k:'fin',  t:'Ensamble terminado'},
  {k:'nov',  t:'⏸ Novedad ensamble'},
  {k:'desp', t:'Despacho'},
  {k:'inst', t:'Instalación'},
  {k:'entr', t:'Entrega a obra'}
];
const SC = {est:null, parcial:false, ens:'', rem:'', inst:'', instPiso:'', instPend:null, od:null, fecha:null, log:[], stream:null, timer:null, last:'', lastT:0, det:null, busy:false};
const SC_CAMPO = {
  conductor: [{k:'rem', t:'Recibido de remisión'}],
  entrega:   [{k:'entr', t:'Entrega a obra'}, {k:'inst', t:'Instalación'}],   // entrega a obra también instala (SQL 64)
  recibe:    [{k:'rec', t:'Recibir en obra'}]
};
const SC_PLANTA = () => SC_EST.filter(e => (e.proc && e.k !== 'programado') || ['ini','fin','nov','desp'].includes(e.k));   // sin programar, instalar ni entregar
const scEstaciones = () => puedeRegistrar() ? SC_EST : esPlanta() ? SC_PLANTA() : esInstalador() ? SC_EST.filter(e => e.k === 'inst') : esCampo() ? SC_CAMPO[S.perfil.rol] : [];   // gerente, asistente y usuarios de campo
const scEst = () => scEstaciones().find(e => e.k === SC.est) || scEstaciones()[0];
const qrTexto = op => 'ELP-OP:' + op;
function scParse(txt){
  const a = String(txt || '').toUpperCase().match(/ELP-ACTA:(\d+)/);
  if(a) return {acta: Number(a[1])};
  const od = String(txt || '').toUpperCase().match(/ELP-OD:(\d+)/);
  if(od) return {od: Number(od[1])};
  const r = String(txt || '').trim().match(/^ELP-REM:(.+)$/i);
  if(r) return {rem: r[1].trim()};
  const m = String(txt || '').toUpperCase().match(/(\d{3,6}-\d+)(?:\.(\d+))?/);
  if(!m) return null;
  const op = m[1].replace(/^0+(?=\d)/, '');
  return {op, sub:m[2] ? op + '.' + m[2] : null};
}
// ¿Se puede registrar esta estación en el ítem? null = sí; texto = por qué no
function scMotivo(it, e){
  if(e.proc){ if(it[e.k] === 'X') return 'ya completo'; if(SC.parcial && it[e.k] === '+') return 'ya parcial'; return null; }
  if(e.k === 'ini'){ if(it.despachado) return 'ya despachado';
    if(enEspera(it)) return SC.ens && normEns(SC.ens) !== normEns(it.ensamblador) ? 'en espera · ' + it.ensamblador : null;   // reanudar
    if(it.ensamblador) return 'en ensamble · ' + it.ensamblador;
    const f = faltaProc(it); if(f.length && !isGerente()) return 'falta ' + f.join(', ');
    if(!SC.ens && !it.ens_asignado) return 'sin ensamblador (elígelo arriba)';
    if(SC.ens && it.ens_asignado && it.ens_asignado !== SC.ens) return 'línea de ' + it.ens_asignado; return null; }
  if(e.k === 'fin'){ if(!it.ensamblador || !it.dia_inicio) return 'ensamble sin iniciar'; if(it.dia_final) return 'ya terminado'; return null; }
  if(e.k === 'nov'){ if(!it.ensamblador || !it.dia_inicio) return 'ensamble sin iniciar'; if(it.dia_final || it.despachado) return 'ya terminado'; if(enEspera(it)) return 'ya en espera'; return null; }
  if(e.k === 'desp'){ if(it.despachado) return 'ya despachado'; if(!estaEnsamblado(it)) return 'sin ensamblar'; if(!SC.od) return 'sin orden de despacho'; if(!SC.od.items.includes(it.id) && !((SC.od._pend || {})[it.op] || []).length) return 'su OP no está pendiente en la orden de despacho'; return null; }
  if(e.k === 'entr'){ if(!it.instalado) return 'sin instalar'; if(it.acta_id) return it.recepcion_id ? 'ya recibido' : 'ya entregado'; return null; }
  if(e.k === 'inst'){ if(it.instalado) return 'ya instalado'; if(!it.despachado) return 'sin despachar';
    if(SC.instPiso && (it.piso || '(sin piso)') !== SC.instPiso) return 'no es de ' + SC.instPiso; return null; }
  return 'no aplica';
}
function scPatch(e, it){
  if(e.proc) return {[e.k]: SC.parcial ? '+' : 'X'};
  if(e.k === 'ini') return {ensamblador: SC.ens || (it && it.ens_asignado) || null, dia_inicio: today(), hora_inicio: nowTime()};
  if(e.k === 'fin') return {dia_final: today(), hora_final: nowTime()};
  if(e.k === 'desp') return {despachado: true, fecha_despacho: SC.fecha, remision: SC.rem};
  if(e.k === 'inst') return {instalado: true, fecha_instalacion: SC.fecha, instalador: SC.inst || null};
}

function goScan(){
  if(!puedeEscanear()) return;
  if(S.view !== 'scan') history.pushState({v:'scan'}, '');
  S.view = 'scan'; S.sel.clear(); S.detailId = null; S.draft = null; document.body.style.overflow = '';
  if(!SC.est || !scEstaciones().some(e => e.k === SC.est)) SC.est = scEstaciones()[0].k;
  if(!SC.fecha) SC.fecha = today();
  SC.instPiso = ''; SC.instPend = null;   // el piso de instalación se confirma cada vez que se entra al escáner
  if(esInstalador() || rolEs('entrega')) SC.inst = '';         // y el instalador elige su nombre cada vez (no hay uno por defecto)
  renderScan();
}
function renderScan(){
  $('#app').innerHTML = shell(`
    ${soloScan() ? '' : `<button class="back" onclick="history.back()">${ICON.back} Volver</button>`}
    <div class="obra-title"><div><div class="h1" id="scTit">${esCampo() || esInstalador() ? esc(scEst().t) : 'Escanear OP'}</div><div class="h1-sub">${esInstalador() ? 'Elige el piso y escanea la OP o la etiqueta de lo que instalaste' : esCampo() ? 'Escanea el código QR' : 'Elige la estación y escanea el código de la orden · ' + liveHTML()}</div></div></div>
    <div class="sc-est" ${(esCampo() || esInstalador()) && scEstaciones().length < 2 ? 'style="display:none"' : ''}>${scEstaciones().map(e => `<button class="chip ${SC.est===e.k?'on':''}" onclick="scSetEst('${e.k}')">${e.t}</button>`).join('')}</div>
    <div id="scParams" class="sc-params"></div>
    <div class="sc-wrap">
      <div class="sc-cam" id="scCam">
        <video id="scVideo" playsinline muted></video><div class="sc-frame"></div>
        <button class="btn primary" id="scStart" onclick="scStart()">${ICON.scan} Activar cámara</button>
        <div class="sc-hint" id="scHint"></div>
      </div>
      <div class="sc-side">
        <div class="field"><span class="lbl" id="scManLbl">${esCampo() && !['entr','inst'].includes(SC.est) ? 'O escribe el número (remisión o acta)' : 'O escribe la OP (también sirve un lector de códigos)'}</span>
          <div class="sc-man"><input id="scMan" placeholder="${esCampo() && !['entr','inst'].includes(SC.est) ? 'Ej. 00-273' : 'Ej. 6235-3'}" autocomplete="off" autocapitalize="characters" inputmode="text"><button class="btn" onclick="scManual()">Buscar</button></div></div>
        <div class="section-t">Registrado en esta sesión</div>
        <div id="scLog" class="sc-log"></div>
      </div>
    </div>`);
  renderScanParams(); renderScanLog();
  const m = $('#scMan'); m.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); scManual(); } };
  if(SC.stream) scAttach();
}
function scGuardarParams(){
  if($('#scEns')) SC.ens = pfVal('scEns');
  if($('#scInst')) SC.inst = pfVal('scInst');
  if($('#scRem')) SC.rem = $('#scRem').value.trim();
  if($('#scFecha')) SC.fecha = $('#scFecha').value || today();
  if($('#scIPiso')) SC.instPiso = $('#scIPiso').value;
}
// Instalación: obra y piso donde se está instalando (obligatorio antes de escanear)
async function instCargarPend(){
  try{ SC.instPend = await API.pendInstalar(); }catch(e){ SC.instPend = []; toast(errMsg(e), true); }
  if(scEst().k === 'inst') renderScanParams();
}
function instPiso(v){ SC.instPiso = v; renderScanParams(); }
function scSetEst(k){ scGuardarParams(); SC.est = k; document.querySelectorAll('.sc-est .chip').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes(`'${k}'`)));
  if(esCampo()){ const t = $('#scTit'); if(t) t.textContent = scEst().t; if(k === 'inst' && !S.personas) cargarPersonas(); }
  renderScanParams(); }
function renderScanParams(){
  const e = scEst(), box = $('#scParams'); if(!box) return;
  let h = '';
  if(e.proc) h = `<label class="switch"><span>Registrar como <b>parcial (+)</b> en lugar de completo (X)</span><button class="tgl ${SC.parcial?'on':''}" onclick="SC.parcial=!SC.parcial; this.classList.toggle('on')"></button></label>`;
  if(e.k === 'ini') h = `<div class="field"><span class="lbl">Ensamblador</span>${personaField('scEns', SC.ens, '', 'El asignado en la programación')}</div><div class="sc-note">Fecha y hora de inicio: el momento del escaneo. Si no eliges ensamblador, se usa el que tiene asignado el ítem en la programación.</div>`;
  if(e.k === 'fin') h = `<div class="sc-note">Fecha y hora final: el momento del escaneo.</div>`;
  if(e.k === 'nov') h = `<div class="field"><span class="lbl">Motivo</span><div class="seg" id="scNovMot">${NOV_ENS.map(m => `<button class="${SC.novMot === m ? 'on' : ''}" onclick="SC.novMot='${m}'; renderScanParams()">${m}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Detalle${SC.novMot === 'Otro' ? ' (obligatorio)' : ''}</span><input id="scNovDet" value="${esc(SC.novDet || '')}" placeholder="Ej. se partió el vidrio de la hoja izquierda" oninput="SC.novDet=this.value"></div>
    <div class="sc-note">Lo que escanees queda <b>en espera</b>: sigue abierto en ensamble y el ensamblador puede iniciar otra OP. Para seguir, escanea otra vez <b>Inicio ensamble</b> (reanuda).</div>`;
  if(e.k === 'desp') h = `${SC.od ? `<div class="summary" style="margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><span style="flex:1"><b>Orden de despacho N.º ${SC.od.id}</b> · ${esc(SC.od.obra || '')}</span>
        <button class="btn sm" onclick="odSoltar()">Cambiar</button></div><div id="odProg" style="font-size:13px;margin-top:6px">Cargando lo que falta…</div></div>`
      : `<div class="field"><span class="lbl">Orden de despacho</span><div style="display:flex;gap:6px"><select id="scOd" style="flex:1"><option value="">Escanea el QR de la orden o elígela…</option></select></div></div>
        <div class="warn" style="margin-bottom:6px">Solo se despacha lo que está en una <b>orden de despacho</b>. Escanea su QR o elígela para empezar a cargar.</div>`}
    <div class="fgrid"><div class="field"><span class="lbl">Fecha despacho</span><input type="date" id="scFecha" value="${SC.fecha}"></div>
      ${SC.od && SC.od.remision ? `<div class="field"><span class="lbl">Remisión de la orden</span><input id="scRem" value="${esc(SC.od.remision)}" readonly>
        <div style="display:flex;gap:6px;margin-top:6px"><button type="button" class="btn sm ghost" onclick="odOtroCamion()">No cupo: otro camión (remisión nueva)</button></div></div>` : SC.od ? remCampo('scRem', SC.rem) : ''}</div>
    <div class="sc-note">El despacho y la remisión quedan registrados <b>al escanear cada ítem</b> que sube al camión.</div>
    ${SC.rem && SC.log.some(l => l.rem === SC.rem && !l.deshecho) ? `<button class="btn primary" style="width:100%;margin-top:8px" onclick="odTerminar()">Terminar cargue · remisión ${esc(SC.rem)}</button>` : ''}`;
  if(e.k === 'rem') h = `<div class="sc-note">Escanea el <b>QR de la remisión</b> al llegar a la obra. Quien recibe revisa las cantidades por OP, anota novedades y firma en la pantalla.</div>`;
  if(e.k === 'rec') h = `<div class="sc-note">Escanea el <b>QR del acta de entrega</b> o de la <b>remisión</b>. Verás lo que se te ha entregado y podrás firmar el recibido.</div>`;
  if(e.k === 'entr') h = `<div class="sc-note">Escanea la etiqueta de cada ítem instalado que entregas: entra al <b>acta en curso</b> de su obra. Al terminar, cierra el acta para que quien recibe revise y firme.</div>
    ${SC.acta ? `<div class="summary" style="margin-top:8px;display:flex;align-items:center;gap:8px"><span style="flex:1"><b>Acta N.º ${SC.acta.num}</b> · ${esc(SC.acta.obra)}</span><button class="btn sm primary" onclick="actaEstado(${SC.acta.id})">Ver / cerrar y firmar</button></div>` : ''}`;
  if(e.k === 'inst'){
    const pend = SC.instPend;
    // Pisos 1 a 40 de una vez (no hay que esperar); se suman los nombres especiales que traiga la base (PH, SÓTANO…)
    const base = Array.from({length: 40}, (_, k) => 'PISO ' + (k + 1));
    const pisos = [...new Set(base.concat(pend ? pend.flatMap(i => indef(i) ? ubicPartes(i.ubicacion).map(p => 'PISO ' + Math.floor(p.cod / 100)) : [i.piso || '(sin piso)']) : []))].sort(nat).map(p => [p]);
    h = `<div class="summary" style="margin-bottom:8px;${SC.instPiso ? '' : 'border-color:var(--danger)'}">${SC.instPiso ? `Instalando en <b style="font-size:16px">${esc(SC.instPiso)}</b><br><small>Todo lo que escanees queda en este piso (la obra la toma del QR). Cambia el piso cuando subas o bajes.</small>` : '<b>Primero elige el piso donde estás instalando.</b> Sin piso no se puede escanear.'}</div>
    <div class="fgrid">
      <div class="field full"><span class="lbl">Piso</span><select id="scIPiso" onchange="instPiso(this.value)"><option value="">Elegir piso…</option>${pisos.map(([pi, l]) => `<option value="${esc(pi)}" ${pi === SC.instPiso ? 'selected' : ''}>${esc(pi)}</option>`).join('')}</select></div>
    </div>`;
    if(!pend) setTimeout(instCargarPend, 0);
    h += `<div class="fgrid"><div class="field"><span class="lbl">Fecha instalación</span><input type="date" id="scFecha" value="${SC.fecha}"></div>
      <div class="field"><span class="lbl">Instalador (obligatorio)</span>${personaField('scInst', SC.inst, '', 'Elegir')}</div></div>
    <label class="switch" style="margin-top:8px;${SC.nov ? 'border:1px solid var(--danger);padding:8px' : ''}"><span>⚠ <b>No se pudo instalar</b>: lo que escanees queda como <b>novedad</b> (con fecha, hora, motivo y fotos), no como instalado</span><button class="tgl ${SC.nov ? 'on' : ''}" onclick="SC.nov=!SC.nov; renderScanParams()"></button></label>`;
  }
  box.innerHTML = h;
  box.querySelectorAll('input,select').forEach(x => x.addEventListener('change', scGuardarParams));
  if(e.k === 'desp' && !SC.rem) remNueva('scRem');
  if(e.k === 'desp'){ if(SC.od) odProgreso(); else odLlenarSelect(); }
}
function renderScanLog(){
  const b = $('#scLog'); if(!b) return;
  const rems = [...new Set(SC.log.filter(l => l.rem && !l.deshecho).map(l => l.rem))];
  b.innerHTML = (rems.length ? `<div class="quick" style="margin-bottom:8px">${rems.map(r => `<button class="btn sm" onclick="exportarRemision(decodeURIComponent('${encQ(r)}'))">${ICON.down} Exportar remisión ${esc(r)}</button>`).join('')}</div>` : '') + (SC.log.length ? SC.log.map((l, i) => `<div class="sc-li ${l.deshecho?'des':''}"><span class="t">${l.hora}</span><div><b>${esc(l.op)}</b> · ${esc(l.est)} · ${fmtN(l.n)} de ${fmtN(l.tot)}<small>${esc(l.obra)}${l.deshecho ? ' · DESHECHO' : ''}</small></div>${l.prev && !l.deshecho ? `<span style="display:flex;gap:4px">${l.entr && l.acta && obsItemPuede() ? `<button class="btn sm ${l.obsN ? 'primary' : ''}" title="Anotar una observación de este ítem para el acta" onclick="scObsItems(${i})">📝${l.obsN ? ' ' + l.obsN : ' Obs.'}</button>` : ''}<button class="btn sm ghost" onclick="scDeshacer(${i})">Deshacer</button></span>` : '<span></span>'}</div>`).join('')
    : '<div class="empty" style="padding:14px 0">Aún no has registrado nada.</div>');
}

// ── Cámara ──
async function scStart(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Este equipo no permite usar la cámara desde la app. Escribe la OP o usa un lector.', true);
  try{
    if(!('BarcodeDetector' in window) && !window.jsQR) await loadScript('lib/jsqr.js');
    SC.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    scAttach();
  }catch(e){ toast(/Permission|NotAllowed/i.test(e.name + e.message) ? 'Permite el uso de la cámara para la app (Ajustes del iPhone/iPad → Safari → Cámara).' : 'No se pudo abrir la cámara: ' + errMsg(e), true); }
}
function scAttach(){
  const v = $('#scVideo'); if(!v || !SC.stream) return;
  v.srcObject = SC.stream; v.play().catch(()=>{});
  $('#scCam').classList.add('on'); $('#scHint').textContent = 'Apunta al código QR de la orden';
  let det = null; try{ if('BarcodeDetector' in window) det = new BarcodeDetector({formats:['qr_code']}); }catch(e){}
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
  clearInterval(SC.timer);
  SC.timer = setInterval(async () => {
    if(SC.busy || $('#ov') || v.readyState < 2 || S.view !== 'scan') return;
    try{
      let txt = null;
      if(det){ const r = await det.detect(v); if(r && r[0]) txt = r[0].rawValue; }
      else if(window.jsQR){
        const w = 480, h = Math.round(v.videoHeight * w / v.videoWidth) || 360;
        cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
        const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'dontInvert'});
        if(r) txt = r.data;
      }
      if(txt) scCodigo(txt);
    }catch(e){}
  }, 180);
}
function scStop(){
  clearInterval(SC.timer); SC.timer = null;
  if(SC.stream){ SC.stream.getTracks().forEach(t => t.stop()); SC.stream = null; }
}
function scBeep(ok){
  try{ if(navigator.vibrate) navigator.vibrate(ok ? 60 : [80,60,80]); }catch(e){}
  try{ const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = ok ? 1200 : 300; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .12); setTimeout(() => a.close(), 300); }catch(e){}
}
function scManual(){ const m = $('#scMan'); let v = m.value.trim(); if(!v) return; m.value = '';
  if(esCampo() && !['entr','inst'].includes(SC.est) && !/^ELP-/i.test(v)) v = 'ELP-REM:' + v;   // conductor / recibe escriben el número de remisión
  scCodigo(v, true); }

// ── Al leer un código ──
async function scCodigo(txt, manual){
  const now = Date.now();
  if(!manual && txt === SC.last && now - SC.lastT < 4000) return;
  SC.last = txt; SC.lastT = now;
  if(/^\s*(P\d+-)?ART[:\-]?\d+(-\d+)?\s*$/i.test(txt)){
    if(!artEscaneaTodo()){ scBeep(false); return toast('Esa es una etiqueta de vidrio de Ártica: se escanea en la pantalla de la estación', true); }
    scBeep(true); scStop(); return goArticaOperario(false, txt.trim());
  }
  const p = scParse(txt);
  if(!p){ scBeep(false); return toast('Ese código no es de una OP de Elíptica', true); }
  if((p.acta || p.rem || p.od) && esInstalador()){ scBeep(false); return toast('Escanea el QR de la OP o la etiqueta del ítem que instalaste', true); }
  if((p.acta || p.rem) && esPlanta()){ scBeep(false); return toast('Este usuario solo escanea OP, etiquetas y órdenes de despacho', true); }
  if(p.acta){ if(esCampo() && !rolEs('entrega','recibe')){ scBeep(false); return toast('Este usuario solo recibe remisiones', true); } scBeep(true); return actaEstado(p.acta); }
  if(p.od){ if(!puedeRegistrar() && !esPlanta()){ scBeep(false); return toast('Este usuario no carga despachos', true); } scBeep(true); return odUsar(p.od); }
  if(p.rem){ if(esCampo() && !rolEs('conductor','recibe')){ scBeep(false); return toast('Este usuario solo entrega ítems de actas', true); } scBeep(true); return remEstado(p.rem); }
  if(esCampo() && !rolEs('entrega')){ scBeep(false); return toast(rolEs('conductor') ? 'Escanea el QR de la remisión' : 'Escanea el QR del acta o de la remisión', true); }
  scGuardarParams();
  const e = scEst();
  if(e.k === 'ini' && !SC.ens){ scBeep(false); return toast('Primero elige el ensamblador: la etiqueta se acomoda a su línea de ensamble', true); }
  if(e.k === 'inst' && !SC.inst){ scBeep(false); return toast('Primero elige el instalador', true); }
  if(e.k === 'nov' && !SC.novMot){ scBeep(false); return toast('Primero elige el motivo de la novedad', true); }
  if(e.k === 'nov' && SC.novMot === 'Otro' && !String(SC.novDet || '').trim()){ scBeep(false); const d = $('#scNovDet'); if(d) d.focus(); return toast('Escribe el detalle de la novedad', true); }
  if(e.k === 'inst' && !SC.instPiso){ scBeep(false); const o = $('#scIPiso'); if(o) o.focus(); return toast('Primero elige el piso donde estás instalando', true); }
  if(e.k === 'desp' && !SC.od){ scBeep(false); toast('Primero escanea el QR de la orden de despacho o elígela de la lista', true); const o = $('#scOd'); if(o) o.focus(); return; }
  if(e.k === 'desp' && !SC.rem){ scBeep(false); toast('Primero escribe la remisión', true); const r = $('#scRem'); if(r) r.focus(); return; }
  SC.busy = true;
  try{
    let data, error;
    if(esCampo() && e.k !== 'inst') data = await API.campoItemsOp(p.op);
    else ({data, error} = await API.sb.from('items').select('*').eq('op', p.op).order('id'));
    if(error) throw error;
    if(!data || !data.length){ scBeep(false); toast('No encontré la OP ' + p.op, true); return; }
    const items = data.sort((a,b) => nat(a.op_instalacion, b.op_instalacion));
    if(e.k === 'inst' && SC.nov){
      const obra = p.sub ? (items.find(x => x.op_instalacion === p.sub) || items[0]).obra : items[0].obra;
      scBeep(true); novNueva(items.filter(x => x.obra === obra), p.sub); return;
    }
    if(p.sub){
      // Etiqueta de un ítem (sub-OP): se registra de una vez, sin preguntar
      const it = items.find(x => x.op_instalacion === p.sub);
      if(!it){ scBeep(false); toast('No encontré la sub-OP ' + p.sub, true); return; }
      if(e.k === 'inst'){
        // En obra se instala cualquier unidad de la OP: queda en el piso elegido arriba (se intercambia el destino si hace falta)
        if(it.instalado){ scBeep(false); toast(`${p.sub}: ya instalado`, true); return; }
        if(!it.despachado){ scBeep(false); toast(`${p.sub}: sin despachar`, true); return; }
        const libre = x => x.obra === it.obra && x.despachado && !x.instalado && !x.acta_id;
        const cand = items.filter(x => libre(x) && !indef(x) && (x.piso || '(sin piso)') === SC.instPiso);
        // Unidades sin apartamento definido (lista completa): toman el piso donde se instalan
        const nPiso = parseInt(String(SC.instPiso).replace(/\D/g, '')), sinDef = items.filter(x => libre(x) && indef(x) && ubicPartes(x.ubicacion).some(p => Math.floor(p.cod / 100) === nPiso));
        if(!cand.length && sinDef.length){
          try{
            let u = it;
            if(!indef(it)){ const o = sinDef[0]; await API.intercambiar(it.id, o.id); [it.ubicacion, o.ubicacion] = [o.ubicacion, it.ubicacion]; [it.piso, o.piso] = [o.piso, it.piso]; }
            const r = await API.pisoInstalacion(u.id, SC.instPiso); if(r){ it.ubicacion = r.ubicacion; it.piso = r.piso; mergeRows([r]); }
            if(await scAplicar([it], items.length, e) === false) return;
            scBeep(true); toast(`✓ ${p.sub} · ${e.t} → ${[it.ubicacion, it.piso].filter(Boolean).join(' · ')}`);
          }catch(err){ scBeep(false); toast(/asignar_piso|function/.test(errMsg(err)) ? errMsg(err) + ' (¿ya corriste el SQL 32?)' : errMsg(err), true); }
          return;
        }
        if(!cand.length){
          // Se despachó para otro piso pero la están instalando aquí: toma el destino de una unidad de este piso aún sin despachar
          const otros = items.filter(x => x.obra === it.obra && !x.instalado && !x.acta_id && !x.despachado && !indef(x) && (x.piso || '(sin piso)') === SC.instPiso);
          if(otros.length){ scBeep(true); scReubicarInst(it, otros, items.length, e); return; }
          scBeep(false); toast(`La OP ${it.op} (${it.obra}) no tiene unidades por instalar en ${SC.instPiso}. Revisa el piso elegido o la etiqueta.`, true); return; }
        if(cand.length > 1 || cand[0].id !== it.id){ scBeep(true); scDondeInst(it, cand, items.length, e); return; }
      }
      // Procesos e inicio de ensamble: cualquier etiqueta de la OP sirve. Si la unidad escaneada no está en la
      // programación (o no es la asignada al ensamblador), toma el lugar de una unidad programada pendiente.
      const t = reclasDestino(it, items, e);
      if(t){
        try{ const rows = await API.reclasificar(it.id, t.id); mergeRows(rows); for(const r of rows){ const x = items.find(y => y.id === r.id); if(x) Object.assign(x, r); } }
        catch(err){ scBeep(false); toast(/reclasificar_unidad|function/.test(errMsg(err)) ? errMsg(err) + ' (¿ya corriste el SQL 48?)' : errMsg(err), true); return; }
        toast(`${p.sub} toma el lugar de ${t.op_instalacion} en la programación${it.ens_asignado ? ' · línea de ' + it.ens_asignado : ''}`);
      }
      const m = scMotivo(it, e);
      if(m){ scBeep(false); toast(`${p.sub}: ${m}`, true); return; }
      const reanuda = e.k === 'ini' && enEspera(it);
      if(await scAplicar([it], items.length, e) === false) return;
      if(reanuda){ scBeep(true); toast(`▶ ${p.sub} · ensamble reanudado`); return; }
      if(e.k === 'ini' && it.op) artVidriosItem(it.op).then(r => { if(r) setTimeout(() => toast(`Vidrios Ártica ${it.op}: ${fmtN(r.listos)} de ${fmtN(r.total)} listos`), 1800); });
      scBeep(true); toast(`✓ ${p.sub} · ${e.t}${e.k === 'entr' && SC.acta ? ' → acta N.º ' + SC.acta.num + (it.piso ? ' · ' + pisoLbl(it.piso) : '') + (it.ubicacion ? ' · ' + lugarCorto(it.ubicacion) : '') : ''}${e.k === 'desp' && (it.ubicacion || it.piso) ? ' → ' + [it.ubicacion, it.piso].filter(Boolean).join(' · ') : ''}`);
      return;
    }
    if(e.k === 'inst' && !items.some(x => !scMotivo(x, e))){
      // Escaneó la OP: nada despachado para este piso, pero hay unidades despachadas para otro piso → instalar aquí
      const desp = items.filter(x => x.despachado && !x.instalado && !x.acta_id && !indef(x)), otros = items.filter(x => !x.instalado && !x.acta_id && !x.despachado && !indef(x) && (x.piso || '(sin piso)') === SC.instPiso);
      if(desp.length && otros.length){ scBeep(true); scReubicarInst(desp[0], otros, items.length, e); return; }
    }
    scBeep(true);
    scHoja(p, items, e);
  }catch(err){ scBeep(false); toast(errMsg(err), true); }
  finally{ SC.busy = false; }
}
// Instalar en otro piso: la unidad despachada (iba para otro piso) toma el destino de una de este piso que sigue en planta

    }catch(err){ scBeep(false); toast(/reubicar_instalacion|function|PGRST202/.test(errMsg(err)) ? 'Falta activar "instalar en otro piso" en la base (SQL 84)' : errMsg(err), true); return false; }

function scDondeInst(it, cand, tot, e){

function scHoja(p, items, e){
  // Procesos: las sub-OP programadas van primero y son las que quedan marcadas (las unidades de una OP son iguales)
  const prog = it => it.programado === 'X';
  let ok = items.filter(it => !scMotivo(it, e)).sort((a, b) => e.proc ? (prog(b) - prog(a)) || nat(a.op_instalacion, b.op_instalacion) : 0);
  // Despacho: no más unidades de las que la orden tiene pendientes de esta OP (primero las que están en la orden)
  let cupo = null;
  if(e.k === 'desp' && SC.od){ const enOd = it => SC.od.items.includes(it.id);
    cupo = SC.od._pend ? ((SC.od._pend[p.op] || []).length) : ok.filter(enOd).length;
    const esc_ = it => p.sub && it.op_instalacion === p.sub;   // la unidad escaneada va primero
    ok = [...ok.filter(esc_), ...ok.filter(it => !esc_(it) && enOd(it)), ...ok.filter(it => !esc_(it) && !enOd(it))].slice(0, cupo); }
  const okProg = e.proc ? ok.filter(prog) : [];
  const sel = new Set(p.sub ? ok.filter(it => it.op_instalacion === p.sub).map(it => it.id) : (okProg.length ? okProg : ok).map(it => it.id));
  const obras = [...new Set(items.map(it => it.obra))];
  const det = SC.det = {cupo, p, items: e.proc ? [...items].sort((a, b) => (prog(b) && !scMotivo(b, e)) - (prog(a) && !scMotivo(a, e)) || nat(a.op_instalacion, b.op_instalacion)) : items, e, ok, sel};
  const accion = e.proc ? `${e.t} ${SC.parcial ? '(parcial +)' : '(X)'}` : e.t + (e.k === 'ini' ? ' · ' + SC.ens : e.k === 'desp' ? ' · rem. ' + SC.rem : e.k === 'inst' && SC.inst ? ' · ' + SC.inst : '');
  const body = `<div class="summary"><b>${esc(accion)}</b><br>${fmtN(ok.length)} de ${fmtN(items.length)} sub-OP se pueden registrar${p.sub ? ` · escaneaste la <b>${esc(p.sub)}</b>` : ''}.${e.proc && okProg.length ? `<br><b>${fmtN(okProg.length)} programada${okProg.length === 1 ? '' : 's'} pendiente${okProg.length === 1 ? '' : 's'}</b>: quedan marcadas primero. Ajusta la cantidad a lo que realmente se procesó.` : ''}</div>
    <div id="scNoProg"></div>
    ${ok.length ? `<div class="sc-cant"><span>¿Cuántas?</span><button class="btn" onclick="scCant(-1)">−</button><b id="scN"></b><button class="btn" onclick="scCant(1)">+</button><button class="btn sm ghost" onclick="scCant(999)">Todas</button></div>` : ''}
    <div class="sc-items" id="scItems"></div>`;
  openSheet(`OP ${esc(p.op)}`, esc(obras.join(' · ')), body, 'Registrar', async () => {
    const l = items.filter(it => det.sel.has(it.id));
    if(!l.length){ toast('No hay sub-OP seleccionadas', true); return false; }
    if(await scAplicar(l, items.length, e) === false) return false;
  });
  scPintar();
}
// ¿Con qué unidad programada se intercambia la etiqueta escaneada? null = se registra tal cual
function reclasDestino(it, items, e){
  if(!(e.proc || e.k === 'ini')) return null;
  const libre = x => !x.ensamblador && !x.dia_inicio && !x.despachado && !x.instalado;
  if(!libre(it)) return null;
  const otras = items.filter(x => x.id !== it.id && x.op === it.op && x.obra === it.obra && libre(x) && x.programacion_id);
  if(!otras.length) return null;
  if(e.proc){   // la escaneada no está programada y hay una programada a la que le falta este proceso
    if(it.programacion_id) return null;
    return otras.find(x => !scMotivo(x, e)) || null;
  }
  // Inicio de ensamble: la etiqueta toma el lugar de una unidad de la línea del ensamblador elegido
  const ok = x => !scMotivo(x, e), delEns = x => x.ens_asignado === SC.ens;
  if(ok(it) && (delEns(it) || !otras.some(x => ok(x) && delEns(x)))) return null;
  return otras.find(x => ok(x) && delEns(x)) || (ok(it) ? null : otras.find(ok)) || null;
}
// Registra y guarda lo que había antes, para poder deshacer desde la lista de la sesión
async function scAplicar(l, tot, e){
  if(e.k === 'desp' && SC.od){
    // Cualquier unidad de la OP sirve: si la escaneada no estaba en la orden, toma el destino de una planeada pendiente
    const pend = SC.od._pend || {};
    for(const it of l){
      if(SC.od.items.includes(it.id)) { pend[it.op] = (pend[it.op] || []).filter(x => x.id !== it.id); continue; }
      const lst = (pend[it.op] || []).filter(x => !l.some(y => y.id === x.id));
      const obj = lst[0]; if(!obj) continue;
      await API.intercambiar(it.id, obj.id);
      const ub = it.ubicacion, pi = it.piso;
      it.ubicacion = obj.ubicacion; it.piso = obj.piso;
      for(const x of (S.items || [])){ if(x.id === it.id){ x.ubicacion = obj.ubicacion; x.piso = obj.piso; } if(x.id === obj.id){ x.ubicacion = ub; x.piso = pi; } }
      SC.od.items = SC.od.items.map(x => x === obj.id ? it.id : x);
      pend[it.op] = (pend[it.op] || []).filter(x => x.id !== obj.id);
      await API.odActualizar(SC.od.id, {items: SC.od.items});
      toast(`${it.op_instalacion} va para ${[obj.ubicacion, obj.piso].filter(Boolean).join(' · ') || 'el destino de ' + obj.op_instalacion}`);
    }
  }
  if(e.k === 'entr'){
    const ids = l.map(it => it.id), res = await API.entregar(ids);
    const r = Array.isArray(res) ? res.filter(x => x.n) : [];
    if(!r.length) throw new Error('No se entregó ninguno (revisa que estén instalados y no estén ya en un acta)');

    for(const it of l){ it.entregado_en = new Date().toISOString(); it.acta_id = ac.acta_id; const x = S.items && S.items.find(y => y.id === it.id); if(x){ x.entregado_en = it.entregado_en; x.acta_id = ac.acta_id; } }

    SC.log.unshift({hora: nowTime(), op: l.length === 1 ? l[0].op_instalacion : (l[0].op || ''), est: e.t + ' → acta ' + ac.num, n: l.length, tot: l.length === 1 ? 1 : tot, obra: l[0].obra, prev: [], entr: ids, acta: ac.acta_id});
    renderScanLog(); renderScanParams(); return;
  }
  if(e.k === 'nov'){
    const r = await API.ensNovedadCrear(l.map(it => it.id), SC.novMot, SC.novDet);
    for(const it of l){ it.ens_novedad_id = r.id; const x = S.items && S.items.find(y => y.id === it.id); if(x) x.ens_novedad_id = r.id; }
    SC.log.unshift({hora: nowTime(), op: l.length === 1 ? l[0].op_instalacion : (l[0].op || ''), est: '⏸ En espera · ' + SC.novMot, n: l.length, tot, obra: l[0].obra});
    SC.novDet = ''; renderScanLog(); renderScanParams(); return;
  }
  if(e.k === 'ini'){
    // Reanudar lo que estaba en espera por novedad
    const esp = l.filter(enEspera); l = l.filter(it => !enEspera(it));
    if(esp.length){
      if(await ensChkUnaOp(esp[0].ensamblador, esp[0].op, esp.map(i => i.id)) === false) return false;
      const rows = await API.ensReanudar(esp.map(i => i.id), null); mergeRows(rows);
      for(const it of esp){ it.ens_novedad_id = null; }
      SC.log.unshift({hora: nowTime(), op: esp.length === 1 ? esp[0].op_instalacion : (esp[0].op || ''), est: '▶ Reanudado', n: esp.length, tot, obra: esp[0].obra});
      renderScanLog();
      if(!l.length) return;
    }
    // Una OP a la vez por ensamblador
    const ens = SC.ens || l[0].ens_asignado;
    if(ens && await ensChkUnaOp(ens, l[0].op, l.map(i => i.id)) === false) return false;
  }
  if(e.k === 'ini' && isGerente()){
    const f = l.filter(it => faltaProc(it).length);
    if(f.length && !confirm(`${f.length === 1 ? 'La sub-OP ' + f[0].op_instalacion : f.length + ' sub-OP'} no tiene${f.length === 1 ? '' : 'n'} completos los procesos (${[...new Set(f.flatMap(faltaProc))].join(', ')}).\n\n¿Iniciar el ensamble de todas formas?`)) return false;
  }
  const prev = l.map(it => { const pt = scPatch(e); const ns = deriveStatus({...it, ...pt}); if(ns !== it.status) pt.status = ns;
    const pv = {}; for(const k of Object.keys(pt)) pv[k] = it[k] ?? null; return {id:it.id, pv}; });

  if(e.k === 'desp' && SC.od && !SC.od.remision && SC.rem){ SC.od.remision = SC.rem; try{ await API.odActualizar(SC.od.id, {remision: SC.rem}); }catch(err){ console.warn(err); } }
  const op = l[0].op || '', sub = l.length === 1 ? l[0].op_instalacion : null;
  SC.log.unshift({hora: nowTime(), op: sub || op, est: e.proc ? e.t + (SC.parcial ? ' +' : '') : e.t, n: l.length, tot: sub ? 1 : tot, obra: l[0].obra, prev, rem: e.k === 'desp' ? SC.rem : null});
  renderScanLog();
  if(e.k === 'desp') renderScanParams();
  if(e.k === 'inst' && SC.instPend){ for(const it of l){ const k = SC.instPend.findIndex(x => x.obra === it.obra && x.piso === it.piso); if(k >= 0) SC.instPend.splice(k, 1); } renderScanParams(); }
}
async function scDeshacer(i){

}

// Una etiqueta por página, del tamaño exacto del rollo. Se acomoda sola a cualquier tamaño (horizontal o vertical).
async function etqRolloPDF(tipo, lista, W, H, logo, minimo){
  const doc = new jspdf.jsPDF({unit:'mm', format:[W, H], orientation: W >= H ? 'landscape' : 'portrait'});
  const corta = (t, max) => { t = String(t || ''); while(t && doc.getTextWidth(t) > max) t = t.slice(0, -1); return t; };
  const qr = (txt, x, y, size) => { const q = qrcode(0, 'M'); q.addData(txt); q.make();
    const n = q.getModuleCount(), cs = size / n; doc.setFillColor(0, 0, 0);
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) doc.rect(x + c*cs, y + r*cs, cs + 0.02, cs + 0.02, 'F'); };
  const vertical = H > W * 1.15, pad = Math.max(1.5, Math.min(W, H) * 0.06);
  lista.forEach((e, n) => {
    if(n) doc.addPage([W, H], W >= H ? 'landscape' : 'portrait');
    const esOp = tipo === 'op', code = esOp ? e.op : e.op_instalacion, base = esOp ? e.l[0] : e;
    if(minimo){
      // Solo logo + QR (y el número pequeño, de respaldo por si el QR se daña)
      const cod = (esOp ? 'OP ' : '') + code;
      if(W >= H * 1.25){            // horizontal: QR a la izquierda, logo y número a la derecha
        const Q = H - 2*pad; qr(qrTexto(code), pad, pad, Q);
        const tx = pad*2 + Q, tw = W - tx - pad;
        const lw = logo ? Math.min(tw, (H - 2*pad) * 2.2) : 0, lh = lw && logo ? lw / logo.r : 0;
        const fs = Math.max(5, Math.min(11, tw * 0.55, H * 0.32));
        const tot = lh + (lh ? 2 : 0) + fs * 0.36;
        let y = (H - tot) / 2;
        if(lh){ doc.addImage(logo.url, 'PNG', tx, y, lw, lh, 'logoEtq'); y += lh + 2; }
        doc.setFont('helvetica', 'bold'); doc.setTextColor(0); doc.setFontSize(fs); doc.text(corta(cod, tw), tx, y + fs * 0.36);
      } else {                      // cuadrada o vertical: logo arriba, QR al centro, número abajo
        const fs = Math.max(4.5, Math.min(9, W * 0.16));
        const lw = logo ? Math.min(W - 2*pad, W * 0.8) : 0, lh = lw && logo ? lw / logo.r : 0;
        const Q = Math.max(8, Math.min(W - 2*pad, H - 2*pad - lh - (lh ? 1.5 : 0) - fs * 0.45 - 1.5));
        let y = pad;
        if(lh){ doc.addImage(logo.url, 'PNG', (W - lw) / 2, y, lw, lh, 'logoEtq'); y += lh + 1.5; }
        qr(qrTexto(code), (W - Q) / 2, y, Q); y += Q + 1.2 + fs * 0.36;
        doc.setFont('helvetica', 'bold'); doc.setTextColor(0); doc.setFontSize(fs); doc.text(corta(cod, W - 2*pad), W / 2, y, {align:'center'});
      }
      return;
    }
    const lineas = esOp
      ? (() => { const pisos = [...new Set(e.l.map(i => i.piso).filter(Boolean))].sort(nat), dis = [...new Set(e.l.map(i => i.diseno).filter(Boolean))];
          return [e.l.length + ' ítem' + (e.l.length===1?'':'s') + (pisos.length ? ' · Piso ' + pisos.join(', ') : ''), dis.join(' / ')]; })()
      : [[e.item, e.ubicacion].filter(Boolean).join(' · '), [e.piso ? 'Piso ' + e.piso : '', e.ancho ? fmtN(e.ancho) + ' × ' + fmtN(e.alto) : ''].filter(Boolean).join(' · '), e.diseno || '', e.vidrio ? 'Vidrio: ' + e.vidrio : ''].filter(Boolean);
    let Q, qx, qy, tx, ty, tw, th;
    if(vertical){ Q = Math.min(W - 2*pad, H * 0.5); qx = (W - Q) / 2; qy = pad; tx = pad; ty = qy + Q + pad; tw = W - 2*pad; th = H - ty - pad; }
    else { Q = Math.min(H - 2*pad, W * 0.40); qx = pad; qy = (H - Q) / 2; tx = qx + Q + pad; ty = pad; tw = W - tx - pad; th = H - 2*pad; }
    qr(qrTexto(code), qx, qy, Q);
    // Texto: el tamaño de letra se ajusta al espacio y el bloque queda centrado en la altura (1 pt ≈ 0,353 mm)
    const k = Math.max(0.55, Math.min(1.8, Math.min(th / 26, tw / 34)));
    const filas = [
      {t: String(base.obra).toUpperCase(), f: 6.5*k, b: true, c: 0},
      {t: (esOp ? 'OP ' : '') + code, f: 13*k, b: true, c: 0},
      ...lineas.map((t, i) => ({t, f: i === 0 && !esOp ? 7.5*k : 6*k, b: i === 0 && !esOp, c: i === 0 && !esOp ? 0 : 50}))
    ];
    const lw = logo && th > 14 ? Math.min(tw, 30*k) : 0, lh = lw ? lw / logo.r : 0;
    const alto = f => f * 0.42 + 0.35;
    let total = (lh ? lh + 1.4*k : 0), usadas = [];
    for(const r of filas){ if(total + alto(r.f) > th) break; total += alto(r.f); usadas.push(r); }
    let y = ty + Math.max(0, (th - total) / 2);
    if(lh){ doc.addImage(logo.url, 'PNG', tx, y, lw, lh, 'logoEtq'); y += lh + 1.4*k; }
    for(const r of usadas){
      doc.setFont('helvetica', r.b ? 'bold' : 'normal'); doc.setTextColor(r.c); doc.setFontSize(r.f);
      y += alto(r.f); doc.text(corta(r.t, tw), tx, y - 0.35);
    }
  });
  etqEntregar(doc, tipo, lista.length, `una por página de <b>${fmtN(W)} × ${fmtN(H)} mm</b>`,
    `En la impresora elige el tamaño de papel <b>${fmtN(W)} × ${fmtN(H)} mm</b> (o la etiqueta del rollo) y escala <b>100 % / tamaño real</b>.`);
}

// Agrupa los ítems despachados con una remisión por OP (no por sub-OP) y arma un PDF carta
async function exportarRemision(rem){
  rem = String(rem || '').trim(); if(!rem) return toast('Falta el número de remisión', true);
  toast('Preparando la remisión ' + rem + '…');
  let items, tot;
  try{
    const {data, error} = await API.sb.from('items').select('id,obra,item,piso,diseno,ancho,alto,m2,cant,op,op_instalacion,fecha_despacho').eq('remision', rem).eq('despachado', true).order('id');
    if(error) throw error;
    items = (data || []).filter(it => it.op);
    if(!items.length) return toast('No hay ítems despachados con la remisión ' + rem, true);
    const ops = [...new Set(items.map(it => it.op))];
    tot = new Map();
    for(let i = 0; i < ops.length; i += 150){
      const r = await API.sb.from('items').select('op,cant,despachado').in('op', ops.slice(i, i + 150));
      if(r.error) throw r.error;
      for(const x of r.data || []){ const t = tot.get(x.op) || {n:0, d:0}; const c = Number(x.cant) || 1; t.n += c; if(x.despachado) t.d += c; tot.set(x.op, t); }
    }
    if(!window.jspdf) await loadScript('lib/jspdf.js');
    if(!window.qrcode) await loadScript('lib/qrcode.js');
  }catch(e){ return toast(errMsg(e), true); }
  let rec = null; try{ rec = await API.recRemision(rem); }catch(e){}
  const recOp = new Map(((rec && rec.detalle) || []).map(d => [d.op, d]));
  const uniq = l => [...new Set(l.filter(v => v !== null && v !== undefined && v !== ''))];
  const filas = [...grp(items, it => it.obra + '\u0001' + it.op).values()].map(l => {
    const med = uniq(l.map(i => i.ancho ? fmtN(i.ancho) + ' × ' + fmtN(i.alto) : ''));
    const t = tot.get(l[0].op) || {n:l.length, d:l.length};

      med: med.length > 1 ? 'Varias' : (med[0] || ''), pisos: uniq(l.map(i => i.piso)).sort(nat).join(', '),
      n: l.reduce((a, i) => a + (Number(i.cant) || 1), 0), m2: l.reduce((a, i) => a + (Number(i.m2) || 0), 0), tot: t.n, pend: Math.max(0, t.n - t.d)};
  }).sort((a, b) => nat(a.obra, b.obra) || nat(a.op, b.op));
  const fecha = maxF(items, 'fecha_despacho');
  const logo = await etqLogo();
  const doc = new jspdf.jsPDF({unit:'mm', format:'letter'});
  const PW = 215.9, PH = 279.4, M = 14;
  const cols = [['OP', 22, 'l'], ['Ítem', 20, 'l'], ['Diseño', 52, 'l'], ['Medida', 24, 'l'], ['Cant.', 13, 'r'], ['m2', 15, 'r'], ['Pend. OP', 18, 'r'], ['Recibido', 21.9, 'r']];
  const qr = (txt, x, y, size) => { const q = qrcode(0, 'M'); q.addData(txt); q.make();
    const n = q.getModuleCount(), cs = size / n; doc.setFillColor(0, 0, 0);
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) doc.rect(x + c*cs, y + r*cs, cs + 0.02, cs + 0.02, 'F'); };
  const X = []; { let x = M; for(const c of cols){ X.push(x); x += c[1]; } }
  const W = cols.reduce((a, c) => a + c[1], 0);
  const corta = (t, max) => { t = String(t || ''); if(doc.getTextWidth(t) <= max) return t; while(t && doc.getTextWidth(t + '…') > max) t = t.slice(0, -1); return t + '…'; };

// ── Actas de entrega: se construyen al escanear en "Entrega a obra" y se cierran con la firma de quien recibe ──
// Cada obra tiene a lo sumo un acta ABIERTA; al firmarla queda FIRMADA y lo siguiente abre el acta siguiente
const actaNum = id => { const a = (S.actas || []).find(x => x.id === id); return a ? a.num : '—'; };
const actaAbierta = () => (S.actas || []).find(a => a.estado === 'abierta');

    .replace(/\b(?:APTOS?|APARTAMENTOS?|APT)\.?\s*\d+(?:\s*(?:[-,\/]|Y)\s*\d+)*/g, ' ')
    .replace(/(^|[^\d])\d{3,4}(?:\s*(?:[-,\/]|Y)\s*\d{3,4})*(?!\d)/g, '$1 ')

async function actaAnular(id){

}

// Estado de un acta (al escanear su QR, desde el escáner o desde la lista)
async function actaDatos(id){
  try{ const d = await API.campoActa(id); return d ? {a: d.acta, items: d.items || [], recs: d.recs || []} : {a: null, items: [], recs: []}; }
  catch(e){ if(esCampo() || e.code !== 'PGRST202') throw e; }
  const items = await API.itemsActa(id); await obsEnItems(id, items);
  return {a: await API.acta(id), items, recs: await API.recepciones(id, false)};
}
function qrSVG(txt, px){
  if(!window.qrcode) return '';
  const q = qrcode(0, 'M'); q.addData(txt); q.make();
  return q.createSvgTag({cellSize: Math.max(2, Math.floor(px / (q.getModuleCount() + 8))), margin: 4, scalable: true}).replace('<svg ', `<svg style="width:${px}px;height:${px}px;background:#fff" `);
}

    ? (rolEs('gerente','asistente','cobros','entrega') ? `<div class="field" style="margin-top:10px"><span class="lbl">Observaciones generales de la entrega (salen al final del acta)</span>

    ${abierta ? `<div class="summary"><b>En curso</b> · ${fmtN(items.length)} ítem${items.length===1?'':'s'} entregado${items.length===1?'':'s'} · falta la firma de quien recibe</div>`

// Observaciones por ítem (se anotan mientras se entrega; salen debajo de cada ítem en el acta)
async function obsEnItems(acta, items){
  try{ const m = new Map((await API.actaObsItems(acta)).map(o => [o.item_id, o.texto])); for(const it of items) it.obs = m.get(it.id) || null; }
  catch(e){ /* SQL 51 sin correr: sin observaciones por ítem */ }
  return items;
}
const obsItemPuede = () => rolEs('gerente','asistente','cobros','entrega');
function obsItemsSheet(acta, lista, despues){
  openSheet('Observaciones por ítem', 'Salen debajo de cada ítem en el acta', `<div class="sc-note" style="margin-bottom:8px">Ej.: falta silicona, vidrio rayado, pendiente manija. Déjalo en blanco si no hay novedad.</div>` +
    lista.map(x => `<div class="field"><span class="lbl">${esc(x.label)}</span><input data-obs="${x.id}" value="${esc(x.obs || '')}" placeholder="Sin novedad"></div>`).join(''),
    'Guardar', async () => {
      let n = 0;
      for(const x of lista){
        const t = document.querySelector(`[data-obs="${x.id}"]`).value.trim();
        if(t === (x.obs || '').trim()) continue;
        try{ await API.actaItemObs(acta, x.id, t); x.obs = t; n++; }
        catch(e){ toast(/acta_item_obs|function/.test(errMsg(e)) ? 'Falta correr el SQL 51 en Supabase' : errMsg(e), true); return false; }
      }
      if(n) toast('✓ Observación guardada');
      if(despues) setTimeout(despues, 60);
    });
  setTimeout(() => { const i = document.querySelector('[data-obs]'); if(i) i.focus(); }, 80);
}
async function scObsItems(i){

  let d; try{ d = await actaDatos(l.acta); }catch(e){ return toast(errMsg(e), true); }

function firmaIniciar(){
  const c = $('#fPad'); if(!c) return;
  const dpr = Math.max(2, window.devicePixelRatio || 1), r = c.getBoundingClientRect();
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111';
  const F = window._firma = {c, g, trazos: 0, on: false};
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { e.preventDefault(); c.setPointerCapture(e.pointerId); F.on = true; const [x, y] = pt(e); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 0.1, y + 0.1); g.stroke(); };
  c.onpointermove = e => { if(!F.on) return; e.preventDefault(); const [x, y] = pt(e); g.lineTo(x, y); g.stroke(); };
  c.onpointerup = c.onpointercancel = () => { if(F.on){ F.on = false; F.trazos++; } };
}
function firmaLimpiar(){ const F = window._firma; if(!F) return; F.g.save(); F.g.setTransform(1, 0, 0, 1, 0, 0); F.g.clearRect(0, 0, F.c.width, F.c.height); F.g.restore(); F.trazos = 0; }
// PNG más liviano: se reduce a 600 px de ancho con fondo blanco
function firmaPNG(){
  const F = window._firma, o = document.createElement('canvas'), w = 600, h = Math.round(F.c.height * w / F.c.width);
  o.width = w; o.height = h; const g = o.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(F.c, 0, 0, w, h);
  return o.toDataURL('image/png');
}

// Barras por día (una serie): altura = ítems; tocar o pasar el cursor muestra el detalle
function prBarras(dias, porDia){
  const cw = (($('#obrasBox') || {}).clientWidth || 360) - 22;
  const W = Math.max(cw, dias.length * 22), H = 150, PB = 22, PT = 14;
  const max = Math.max(1, ...dias.map(d => (porDia.get(d) || {}).n || 0));
  const bw = W / dias.length, w = Math.max(4, Math.min(28, bw - 4));
  const bars = dias.map((d, i) => { const v = porDia.get(d) || {n: 0, m2: 0}, hh = v.n ? Math.max(3, (H - PB - PT) * v.n / max) : 0, x = i * bw + (bw - w) / 2, y = H - PB - hh;
    const dom = [0, 6].includes(new Date(d + 'T12:00:00').getDay());   // fin de semana
    const lbl = dias.length <= 14 || i % Math.ceil(dias.length / 10) === 0 ? `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" class="pr-ax">${d.slice(8)}/${d.slice(5, 7)}</text>` : '';
    return `<g><title>${fmtD(d)}: ${fmtN(v.n)} ítems · ${fmtN(v.m2, 1)} m²</title><rect x="${i * bw}" y="0" width="${bw}" height="${H - PB}" fill="transparent"/>
      ${hh ? `<path d="M${x},${H - PB} V${y + 3} q0,-3 3,-3 h${w - 6} q3,0 3,3 V${H - PB} Z" class="pr-bar"/>` : ''}
      ${v.n && dias.length <= 21 ? `<text x="${x + w / 2}" y="${y - 3}" text-anchor="middle" class="pr-val">${v.n}</text>` : ''}${lbl}${dom ? `<rect x="${x}" y="${H - PB + 1}" width="${w}" height="2" class="pr-dom"/>` : ''}</g>`; }).join('');
  return `<div class="pr-chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block" role="img" aria-label="Ítems por día">
    <line x1="0" y1="${H - PB}" x2="${W}" y2="${H - PB}" class="pr-base"/>${bars}</svg></div>`;
}

// Sistema del ítem: solo el nombre (ABSOLUTE, SIENA, ELI, E.GLASS…), sin la descripción que trae el diseño
// Serie (columnas verticales del edificio): la casilla SERIE, o "SERIE n" escrito en la ubicación
const serieDe = it => { const v = String(it.serie || '').trim().toUpperCase(); if(v) return /^\d+[A-Z]?$/.test(v) ? 'SERIE ' + v : v;
  const m = String(it.ubicacion || '').toUpperCase().match(/\bSERIE\s*([A-Z0-9]+)/); return m ? 'SERIE ' + m[1] : ''; };
const sistemaDe = it => { const s0 = String(it.sistema || '').trim();
  let t = (s0 || String(it.diseno || '')).toUpperCase().replace(/\.\s+/g, '.').trim();
  t = t.split(/\s*-\s*/)[0];                        // antes del primer guion (configuración, variante)
  t = t.replace(/([A-ZÁÉÍÓÚÑ]{2,})\.\S*/, '$1');      // ABSOLUTE.T → ABSOLUTE · ELI.053/… → ELI (E.GLASS se conserva)
  const w = []; for(const x of t.split(/\s+/)){ if(/[\d\/]/.test(x)) break; w.push(x); }   // SIENA F1.T → SIENA
  const abr = {LATI:'LATITUD', LAT:'LATITUD', LATITUDE:'LATITUD', FER:'FERRARA', GAL:'GALICIA', GALC:'GALICIA', ELI:'ELIPSE', ABSO:'ABSOLUTE', MAX:'MAXIMA', MAXI:'MAXIMA', IBI:'IBIZA', PER:'PERSIANA', ACUA:'DB'};
  const r = w.join(' ').trim(); return abr[r] || r || 'SIN SISTEMA'; };
// Diseño sin la configuración de naves (-XO, -OX…): SIENA F1.T -XO y -OX quedan juntos
const disBase = it => String(it.diseno || '').toUpperCase().replace(/\.\s+/g, '.').replace(/\s*-\s*[XO\/\s]+$/, '').replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
// Cuerpos = cantidad de X y O de la configuración del diseño (-XO = 2, -OXXO = 4, -XO//O = 3). Sin configuración: al final
const cuerpos = it => { const m = String(it.diseno || '').toUpperCase().match(/-\s*([XO\/\s]+)$/); const n = m ? (m[1].match(/[XO]/g) || []).length : 0; return n || 99; };

function progPDF(pg, items){

    for(const [sis, ls] of [...grp(lo, sistemaDe).entries()].sort((a, b) => b[1].length - a[1].length || nat(a[0], b[0]))){

    for(const l of [...grp(ls, i => i.op).values()].sort((a, b) => cuerpos(a[0]) - cuerpos(b[0]) || b.length - a.length || ordenPlanta(a[0], b[0]))){

    cols: [['OP', 18, 'l'], ['Ítem', 16, 'l'], ['Diseño', 50, 'l'], ['Medida', 22, 'l'], ['Vidrio', 56, 'l'], ['Cant.', 11, 'r'], ['Pisos', 28, 'l'], ['m2', 13, 'r'], ...PROCS.filter(([k]) => k !== 'programado').map(([,, ab]) => [ab, 10.7, 'c'])],

// Remisiones de la obra abierta: lista con número, fecha, OP y unidades (más recientes primero) + buscador
function remisionesObra(){
  const g = grp((S.items || []).filter(it => it.despachado && it.remision), it => it.remision);
  return [...g.entries()].map(([rem, l]) => ({rem, fecha: maxF(l, 'fecha_despacho'), ops: new Set(l.map(i => i.op)).size,
    n: l.reduce((a, i) => a + (Number(i.cant) || 1), 0), m2: l.reduce((a, i) => a + (Number(i.m2) || 0), 0),
    inst: l.filter(i => i.instalado).length, tot: l.length}))
    .sort((a, b) => nat(b.fecha || '', a.fecha || '') || nat(b.rem, a.rem));
}
function remisionPedir(){
  const lista = window._remLista = remisionesObra();
  const body = `<div class="field"><span class="lbl">Buscar (número, fecha u OP)</span><input id="remNum" placeholder="Ej. 00-158, 16/10 o 6235" autocomplete="off"></div>
    <div id="remList" style="max-height:52vh;overflow:auto;margin-top:6px"></div>`;
  openSheet('Remisiones', esc(S.obra || '') + ' · ' + fmtN(lista.length) + ' despacho' + (lista.length===1?'':'s'), body, 'Buscar otra', async () => {
    const r = $('#remNum').value.trim(); if(!r){ toast('Escribe el número de la remisión', true); return false; }
    setTimeout(() => exportarRemision(r), 30);
  });
  const pintar = () => {
    const q = ($('#remNum').value || '').trim().toUpperCase();
    const opsDe = rem => (S.items || []).filter(i => i.remision === rem).map(i => (i.op || '') + ' ' + (i.op_instalacion || '')).join(' ');
    const l = !q ? lista : lista.filter(r => r.rem.toUpperCase().includes(q) || fmtD(r.fecha).includes(q) || opsDe(r.rem).toUpperCase().includes(q));
    $('#remList').innerHTML = l.length ? l.map(r => { const rec = S.remRec && S.remRec.get(r.rem);
      return `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)">
        <div style="flex:1;font-size:13px"><b>Rem. ${esc(r.rem)}</b> · ${fmtD(r.fecha)}${rec ? ' · <span style="color:var(--inst,#4caf50)">recibida ✓</span>' : ''}
          <br><small>${fmtN(r.ops)} OP · ${fmtN(r.n)} und · ${fmtN(r.m2, 1)} m²${r.inst ? ` · instaladas ${fmtN(r.inst)} de ${fmtN(r.tot)}` : ''}</small></div>
        <button class="btn sm" onclick="remEstado(decodeURIComponent('${encQ(r.rem)}'))">Ver</button>
        <button class="btn sm ghost" onclick="exportarRemision(decodeURIComponent('${encQ(r.rem)}'))">PDF</button></div>`; }).join('')
      : `<div class="empty" style="padding:14px 0">${lista.length ? 'Ninguna remisión de esta obra coincide. Toca <b>Buscar otra</b> para buscar el número en todas las obras.' : 'Esta obra aún no tiene despachos.'}</div>`;
  };
  $('#remNum').oninput = pintar; pintar();
}
