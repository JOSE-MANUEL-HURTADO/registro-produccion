      <button class="btn sm" onclick="sheetInstalacion()">Instalación</button>` : registraInst() ? `<button class="btn sm" onclick="sheetInstalacion()">Instalación</button>` : ''}
      ${registraCobros() ? `<button class="btn sm btn-cob" onclick="sheetCobro('d')">$ Cobro despacho</button>
      <button class="btn sm btn-cob" onclick="sheetCobro('i')">$ Cobro instalación</button>` : ''}
    </div>
    <button class="icon-btn" onclick="clearSel()" title="Quitar selección">${ICON.close}</button>
  </div>`;
}

async function recargarObra(){
  if(S.draft && S.draft._dirty && !confirm('Tienes cambios sin guardar en el ítem abierto. ¿Descartarlos?')) return;
  const keepSel = new Set(S.sel), keepDet = S.detailId;
  try{ S.items = await API.obra(S.obra); await loadComercial(); S.items.sort((a,b)=>nat(a.op_instalacion,b.op_instalacion)||nat(a.item,b.item)||a.id-b.id); }
  catch(e){ return toast('Error: '+e.message, true); }
  S.sel = new Set([...keepSel].filter(id => S.items.some(i=>i.id===id)));
  S.detailId = S.items.some(i=>i.id===keepDet) ? keepDet : null;
  S.draft = S.detailId ? draftOf(byId(S.detailId)) : null;
  renderObra(); toast('Datos actualizados');
}

// ════════════════════════════════════════════════════════════════
//  DETALLE DE ÍTEM
// ════════════════════════════════════════════════════════════════
const byId = id => S.items.find(i => i.id === id);
const COM_KEYS = ['precio','cobrado_despacho','fecha_corte_despacho','num_corte_despacho','cobrado_instalacion','fecha_corte_instalacion','num_corte_instalacion'];
function draftOf(it){ const d = {_dirty:false}; if(veCobros()){ const c = com(it); d.c = {}; for(const k of COM_KEYS) d.c[k] = c[k] ?? null; } for(const k of EDITABLE) d[k] = it[k] ?? null; if(d.hora_inicio) d.hora_inicio = fmtT(d.hora_inicio); if(d.hora_final) d.hora_final = fmtT(d.hora_final); d._base = JSON.parse(JSON.stringify({...d, _dirty:undefined})); return d; }

function openDetail(id){
  if(S.detailId === id) return;
  if(S.draft && S.draft._dirty && !confirm('Tienes cambios sin guardar. ¿Descartarlos?')) return;
  const wasOpen = !!S.detailId;
  S.detailId = id; S.draft = draftOf(byId(id));
  if(!wasOpen && window.innerWidth < 1100) history.pushState({v:'obra', obra:S.obra, d:id}, '');
  document.querySelectorAll('.row.open').forEach(r => r.classList.remove('open'));
  const r = document.querySelector(`.row[data-id="${id}"]`); if(r) r.classList.add('open');
  renderDetail();
}
function closeDetail(fromPop){
  if(!fromPop && S.draft && S.draft._dirty && !confirm('Tienes cambios sin guardar. ¿Descartarlos?')) return;
  const hadHist = history.state && history.state.d;
  S.detailId = null; S.draft = null;
  document.querySelectorAll('.row.open').forEach(r => r.classList.remove('open'));
  renderDetail();
  if(!fromPop && hadHist) history.back();
}

      <div class="d-sec"><div class="lbl">Procesos <span style="letter-spacing:.1em">X completo · + parcial</span></div>

      </div>

        <div class="fgrid">
          <div class="field full"><span class="lbl">Ensamblador</span>${personaField('pfEns', d.ensamblador, 'ensamblador', 'Sin asignar')}</div>
          <div class="field"><span class="lbl">Día inicio</span><input type="date" value="${esc(d.dia_inicio||'')}" onchange="dSet('dia_inicio',this.value||null)"></div>

          <div class="switch"><span>Cobrado ${t.toLowerCase()}${!hecho ? ' <span style="color:var(--dim)">(aún no '+(k==='despacho'?'despachado':'instalado')+')</span>' : ''}</span><button class="tgl ${d.c['cobrado_'+k]?'on':''}" onclick="cToggle('${k}')"></button></div>
          ${d.c['cobrado_'+k] ? `<div class="fgrid" style="margin-bottom:10px">
            <div class="field"><span class="lbl">Fecha corte</span><input type="date" value="${esc(d.c['fecha_corte_'+k]||'')}" onchange="cSet('fecha_corte_${k}',this.value||null)"></div>
            <div class="field"><span class="lbl"># Corte</span><input value="${esc(d.c['num_corte_'+k]||'')}" onchange="cSetQ('num_corte_${k}',this.value.trim()||null)"></div>

      <button class="btn" onclick="dDiscard()" ${d._dirty?'':'disabled style="opacity:.4"'}>Descartar</button>
      <button class="btn primary" onclick="dSave()" ${d._dirty?'':'disabled'}>Guardar</button>

  </div>`;
  const b = box.querySelector('.d-body'); if(b) b.scrollTop = scroll;
}

function dSet(k, v){ S.draft[k] = v; S.draft._dirty = true; renderDetail(); }
// Para campos de texto: guarda sin redibujar (evita perder el toque en "Guardar" al salir del campo)
function dirtyFoot(){ S.draft._dirty = true; document.querySelectorAll('.d-foot .btn').forEach(b => { b.disabled = false; b.style.opacity = ''; }); }
function dSetQ(k, v){ S.draft[k] = v; dirtyFoot(); }
function cSetQ(k, v){ S.draft.c[k] = v; dirtyFoot(); }
function cSet(k, v){ S.draft.c[k] = v; S.draft._dirty = true; renderDetail(); }
function cToggle(k){
  const c = S.draft.c;
  if(c['cobrado_'+k]){ c['cobrado_'+k] = false; c['fecha_corte_'+k] = null; c['num_corte_'+k] = null; }
  else { c['cobrado_'+k] = true; c['fecha_corte_'+k] = c['fecha_corte_'+k] || today(); }
  S.draft._dirty = true; renderDetail();
}
function dNow(which){
  if(which==='inicio'){ if(!S.draft.ensamblador) return toast('Primero elige el ensamblador', true); S.draft.dia_inicio = today(); S.draft.hora_inicio = nowTime(); }
  else { S.draft.dia_final = today(); S.draft.hora_final = nowTime(); }
  S.draft._dirty = true; renderDetail();
}
function dToggle(k){
  const d = S.draft;
  if(k==='despachado'){
    if(d.despachado){ if(d.instalado) return toast('Este ítem está instalado: primero quita la instalación', true); if(!confirm('¿Quitar el despacho de este ítem? Se borrarán la fecha y la remisión.')) return; d.despachado=false; d.fecha_despacho=null; d.remision=null; }
    else { if(!estaEnsamblado({...byId(S.detailId), ...d, despachado:false})) return toast('No se puede despachar: este ítem no está ensamblado. Primero registra el día final del ensamble.', true);
      d.despachado=true; d.fecha_despacho = d.fecha_despacho || today(); }
  } else {
    if(d.instalado){ if(!confirm('¿Quitar la instalación de este ítem? Se borrarán la fecha y el instalador.')) return; d.instalado=false; d.fecha_instalacion=null; d.instalador=null; }
    else { if(!d.despachado) return toast('No se puede instalar: este ítem no está despachado. Primero registra el despacho.', true);
      d.instalado=true; d.fecha_instalacion = d.fecha_instalacion || today(); }
  }
  d._dirty = true; renderDetail();
}
function dDiscard(){ S.draft = draftOf(byId(S.detailId)); renderDetail(); }

async function dSave(){
  const it = byId(S.detailId), d = S.draft;
  if(d.instalado && !d.fecha_instalacion) return toast('Falta la fecha de instalación', true);
  if(d.instalado && !it.instalado && !d.despachado) return toast('No se puede instalar: el ítem no está despachado', true);
  if(puedeRegistrar()){
  if(d.despachado && !d.fecha_despacho) return toast('Falta la fecha de despacho', true);
  if(d.despachado && !d.remision) return toast('Falta el número de remisión', true);
  if(d.instalado && !d.fecha_instalacion) return toast('Falta la fecha de instalación', true);
  if((d.dia_inicio||d.dia_final) && !d.ensamblador) return toast('Falta el ensamblador', true);
  if(d.dia_final && !d.dia_inicio) return toast('Falta el día de inicio', true);
  if(d.despachado && !it.despachado && !estaEnsamblado({...it, ...d, despachado:false})) return toast('No se puede despachar: el ítem no está ensamblado', true);
  if(it.despachado && d.despachado && it.dia_final && !d.dia_final) return toast('El ítem está despachado: no se puede quitar el día final del ensamble', true);
  if(d.dia_final && d.dia_inicio && d.dia_final < d.dia_inicio) return toast('El día final es anterior al de inicio', true);
  }
  // Solo se envían los campos que esta persona cambió (comparado con lo que había al abrir el ítem),
  // para no deshacer lo que otro usuario haya guardado mientras tanto.
  const patch = {};
  for(const k of EDITABLE){
    if((d[k] ?? null) !== (d._base[k] ?? null)) patch[k] = nz(d[k]);
  }
  const ns = deriveStatus({...it, ...patch});
  if(ns !== it.status) patch.status = ns;
  let cpatch = null;
  if(d.c){
    for(const k of ['despacho','instalacion']) if(d.c['cobrado_'+k] && !d.c['fecha_corte_'+k]) return toast('Falta la fecha de corte del cobro de '+(k==='despacho'?'despacho':'instalación'), true);
    const c0 = d._base.c || {};
    for(const k of COM_KEYS) if((d.c[k] ?? null) !== (c0[k] ?? null)){ cpatch = cpatch || {}; cpatch[k] = d.c[k]; }
  }
  if(!Object.keys(patch).length && !cpatch){ d._dirty=false; return renderDetail(); }
  try{
    if(Object.keys(patch).length){
      const rows = await API.update([it.id], patch);
      mergeRows(rows.length ? rows : [{...it, ...patch}]);
    }
    if(cpatch && isGerente()){
      const rc = await API.upsertComercial([{item_id: it.id, ...cpatch}]);
      rc.forEach(r => S.com.set(r.item_id, r));
    } else if(cpatch){
      for(const k of ['despacho','instalacion']){
        if(!Object.keys(cpatch).some(x => x.endsWith('_'+k))) continue;
        if(!(k==='despacho' ? it.despachado : it.instalado)){ toast('Este ítem no está '+(k==='despacho'?'despachado':'instalado')+'; no se puede registrar ese cobro', true); continue; }
        await API.marcarCobros([it.id], k, !!d.c['cobrado_'+k], d.c['fecha_corte_'+k], d.c['num_corte_'+k]);
      }
      for(const r of await API.cobros([it.id])) S.com.set(r.item_id, r);
    }
    S.draft = draftOf(byId(it.id));
    toast('✓ Ítem guardado');
    refreshAfterChange();
  }catch(e){ toast(errMsg(e), true); }
}

const selItems = () => S.items.filter(i => S.sel.has(i.id));
function openSheet(title, sub, body, okText, onOk){

  </div></div>`;
  $('#ov').addEventListener('click', e => { if(e.target.id==='ov') closeSheet(); });
  $('#shOk').onclick = async () => {
    const b = $('#shOk'); b.disabled = true; const t = b.textContent; b.textContent = 'Guardando…';
    try{ const ok = await onOk(); if(ok!==false) closeSheet(); else { b.disabled=false; b.textContent=t; } }
    catch(e){ toast(errMsg(e), true); b.disabled=false; b.textContent=t; }

}
function closeSheet(){ $('#layer').innerHTML = ''; }
const subSel = n => `${fmtN(n)} ítem${n===1?'':'s'} seleccionado${n===1?'':'s'} en ${esc(S.obra)}`;
const warn = (n, txt) => n ? `<div class="warn"><b>${fmtN(n)}</b> ${txt}</div>` : '';

// Aplica cambios a varios ítems agrupando los que quedan con el mismo cambio
async function applyGroup(items, patchFn){
  const groups = new Map();
  for(const it of items){
    const p = patchFn(it); if(!p) continue;
    const ns = deriveStatus({...it, ...p});
    if(ns !== it.status) p.status = ns;
    const key = JSON.stringify(p);
    if(!groups.has(key)) groups.set(key, {p, ids:[]});
    groups.get(key).ids.push(it.id);
  }
  let n = 0;
  for(const {p, ids} of groups.values()){
    const rows = await API.update(ids, p);
    mergeRows(rows.length ? rows : ids.map(id => ({...byId(id), ...p})));
    n += ids.length;
  }
  S.sel.clear();
  refreshAfterChange();
  toast(`✓ ${fmtN(n)} ítem${n===1?'':'s'} actualizado${n===1?'':'s'}`);
}

const HK = {cortado:'Cortado',troquelado:'Troquelado',mecanizado:'Mecanizado',programado:'Programado',vidrio_proc:'Vidrio',prealistado:'Prealistado',
  ensamblador:'Ensamblador',dia_inicio:'Día inicio',hora_inicio:'Hora inicio',dia_final:'Día final',hora_final:'Hora final',status:'Estado',
  despachado:'Despachado',fecha_despacho:'Fecha despacho',remision:'Remisión',instalado:'Instalado',fecha_instalacion:'Fecha instalación',instalador:'Instalador',
  precio:'Precio',cobrado_despacho:'Cobrado despacho',fecha_corte_despacho:'Fecha corte desp.',num_corte_despacho:'# corte desp.',
  cobrado_instalacion:'Cobrado instalación',fecha_corte_instalacion:'Fecha corte inst.',num_corte_instalacion:'# corte inst.',
  obra:'Obra',item:'Ítem',ubicacion:'Ubicación',piso:'Piso',diseno:'Diseño',ancho:'Ancho',alto:'Alto',m2:'M²',op:'OP',op_instalacion:'OP instalación',fecha_op:'Fecha OP'};
const H = {rows:[], fin:false, cargando:false, usuario:'', q:'', perf:null, items:new Map(), err:null};
const hVal = (k, v) => v === null || v === undefined || v === '' ? '—' : v === true ? 'Sí' : v === false ? 'No'
  : /^(dia_|fecha_)/.test(k) && /^\d{4}-\d{2}-\d{2}/.test(v) ? fmtD(v) : /^hora_/.test(k) ? fmtT(v) : k === 'precio' ? '$' + fmtN(v) : String(v);
function hDiff(r){
  const a = r.antes || {}, d = r.despues || {}, out = [];
  for(const k of Object.keys(HK)) if(k in d && JSON.stringify(a[k] ?? null) !== JSON.stringify(d[k] ?? null)) out.push([k, a[k], d[k]]);
  return out;
}
async function hCargar(reset){
  if(H.cargando) return; H.cargando = true;
  try{
    if(!H.perf){ H.perf = new Map((await API.perfilesTodos()).map(p => [p.id, p])); }
    if(reset){ H.rows = []; H.fin = false; }
    const nuevos = await API.historial(H.rows.length, H.usuario);
    const falta = [...new Set(nuevos.filter(r => r.despues && r.despues._tabla === 'cobros').map(r => r.item_id))].filter(id => !H.items.has(id));
    if(falta.length) (await API.itemsBasicos(falta)).forEach(it => H.items.set(it.id, it));
    H.rows = H.rows.concat(nuevos); H.fin = nuevos.length < 150; H.err = null;
  }catch(e){ H.err = errMsg(e); }
  H.cargando = false;
  if(S.view === 'carga' && C.tab === 'historial') renderCarga();
}
function historialHTML(){
  if(!H.perf && !H.err){ hCargar(true); return '<div class="loading"><div class="spin"></div>Cargando historial</div>'; }
  const q = H.q.trim().toUpperCase();
  const filas = H.rows.map(r => {
    const d = r.despues || {}, info = d._tabla === 'cobros' ? (H.items.get(r.item_id) || {}) : d;
    return {r, info, ch: hDiff(r), cob: d._tabla === 'cobros'};
  }).filter(x => x.ch.length && (!q || [x.info.obra, x.info.item, x.info.op_instalacion].some(v => v && String(v).toUpperCase().includes(q))));
  let dia = '', h = `<div class="filters" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:720px">
      <select onchange="H.usuario=this.value;hCargar(true)"><option value="">Todos los usuarios</option>${[...H.perf.values()].sort((a,b)=>nat(a.nombre||'',b.nombre||'')).map(p => `<option value="${p.id}" ${p.id===H.usuario?'selected':''}>${esc(p.nombre||'Sin nombre')} · ${esc(p.rol)}</option>`).join('')}</select>
      <div class="search">${ICON.search}<input id="hQ" placeholder="Obra, ítem u OP…" value="${esc(H.q)}" autocomplete="off" autocapitalize="characters"></div>
    </div>${H.err ? `<div class="warn">${esc(H.err)}</div>` : ''}<div class="h-list">`;
  for(const {r, info, ch, cob} of filas){
    const f = new Date(r.cuando), dd = f.toLocaleDateString('es-CO', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    if(dd !== dia){ dia = dd; h += `<div class="section-t">${esc(dd)}</div>`; }
    const p = H.perf.get(r.usuario);
    h += `<div class="h-row"><div class="h-t">${f.toLocaleTimeString('es-CO', {hour:'numeric', minute:'2-digit'})}</div>
      <div class="h-b"><div class="h-w"><b>${esc(p ? (p.nombre || p.rol) : 'Sistema')}</b>${p ? ` <span>${esc(p.rol)}</span>` : ''}</div>
        <div class="h-i">${esc(info.obra || '—')} · ${esc(info.item || '—')} · <span class="mono">${esc(info.op_instalacion || '')}</span></div>
        <div class="h-c">${ch.map(([k,a,b]) => `<span>${HK[k]}: <s>${esc(hVal(k,a))}</s> → <b>${esc(hVal(k,b))}</b></span>`).join('')}</div></div></div>`;
  }
  if(!filas.length) h += `<div class="empty">${H.rows.length ? 'Ningún cambio coincide con el filtro.' : 'Todavía no hay cambios registrados.'}</div>`;
  h += `</div>${!H.fin ? `<div class="more"><button class="btn sm" onclick="hCargar(false)">${H.cargando ? 'Cargando…' : 'Ver cambios anteriores'}</button></div>` : ''}`;
  setTimeout(() => { const i = $('#hQ'); if(i && !i.oninput) i.oninput = () => { H.q = i.value; const pos = i.selectionStart; renderCarga(); const j = $('#hQ'); if(j){ j.focus(); j.setSelectionRange(pos,pos); } }; }, 0);
  return h;
}

// ── Conversión de valores ──
function cTxt(v){ if(v==null) return null; const s = String(v).replace(/\s+/g,' ').trim(); return s === '' ? null : s; }
function cNum(v){
  if(v==null || v==='') return {v:null};
  if(typeof v === 'number') return {v};
  let s = String(v).replace(/\s|\$/g,'');
  if(s === '') return {v:null};
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,'');
  else s = s.replace(',','.');
  const n = Number(s);
  return isNaN(n) ? {v:null, bad:true} : {v:n};
}
function cFecha(v){
  if(v==null || v==='') return {v:null};
  if(typeof v === 'number' && v > 20000 && v < 80000){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*864e5);
    return {v: d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; const d=+m[1], mo=+m[2]; if(mo>=1&&mo<=12&&d>=1&&d<=31) return {v: y+'-'+pad(mo)+'-'+pad(d)}; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return {v: m[1]+'-'+pad(+m[2])+'-'+pad(+m[3])};
  return {v:null, bad:true};
}

async function leerArchivo(file){
  C.estado = 'leyendo'; C.archivo = file.name; C.msg = 'Leyendo el archivo'; renderCarga();
  try{
    if(!window.XLSX) await loadScript(XLSX_URL);
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    // Hoja: la que se llame OPs, o la primera que tenga encabezados OBRA e ITEM
    let aoa = null, hdrRow = -1;
    const names = [...wb.SheetNames].sort((a,b) => (normH(b)==='OPS') - (normH(a)==='OPS'));
    for(const n of names){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null, blankrows:false});
      const i = rows.slice(0,15).findIndex(r => r && r.some(c=>normH(c)==='OBRA') && r.some(c=>normH(c)==='ITEM'));
      if(i >= 0){ aoa = rows; hdrRow = i; break; }
    }
    if(!aoa) throw new Error('No encontré una hoja con los encabezados OBRA e ITEM.');
    const hdr = aoa[hdrRow].map(normH);
    const idx = {};
    hdr.forEach((h,i) => { const k = COLMAP[h]; if(k && idx[k] === undefined) idx[k] = i; });   // si hay dos "VIDRIO", vale la primera
    const faltan = ['obra','item','op_instalacion','ancho','alto'].filter(k => idx[k] === undefined);
    if(faltan.length) throw new Error('Faltan columnas en el archivo: '+faltan.map(k => PLANTILLA.find(h => COLMAP[normH(h)]===k)).join(', '));
    const hoy = today();
    const filas = [];
    for(let r = hdrRow+1; r < aoa.length; r++){
      const row = aoa[r]; if(!row || row.every(c => c==null || String(c).trim()==='')) continue;
      const g = k => idx[k] === undefined ? null : row[idx[k]];
      const f = {n: r+1, errors:[], warns:[], d:{}};
      const d = f.d;
      for(const k of ['item','ubicacion','sistema','serie','piso','diseno','vidrio','op']) d[k] = cTxt(g(k));
      d.obra = cTxt(g('obra')); if(d.obra) d.obra = d.obra.toUpperCase();
      d.op_instalacion = cTxt(g('op_instalacion'));
      for(const k of ['ancho','alto','m2','cant','tiempo_op','puntos','precio']){
        const x = cNum(g(k)); d[k] = x.v;
        if(x.bad) f.errors.push(`${k==='precio'?'PRECIO':k.toUpperCase().replace('_',' ')} no es un número`);
      }
      const fe = cFecha(g('fecha_op'));
      if(fe.bad) f.errors.push('FECHA OP no es una fecha válida');
      d.fecha_op = fe.v || (fe.bad ? null : hoy);
      if(!fe.v && !fe.bad) f.warns.push('Sin FECHA OP: se usará hoy');
      if(!d.obra) f.errors.push('Falta OBRA');
      if(!d.item) f.errors.push('Falta ITEM');
      if(!d.op_instalacion) f.errors.push('Falta OP INSTALACION');
      if(d.ancho==null || d.alto==null) f.warns.push('Medidas incompletas');
      if(d.m2==null && d.ancho!=null && d.alto!=null){ d.m2 = Math.round(d.ancho*d.alto/1e4)/100; f.warns.push('M² calculado'); }
      if(d.precio==null) f.warns.push('Sin precio');
      filas.push(f);
    }
    if(!filas.length) throw new Error('El archivo no tiene filas con datos debajo de los encabezados.');
    // Repetidas dentro del archivo
    const cnt = new Map(); filas.forEach(f => f.d.op_instalacion && cnt.set(f.d.op_instalacion, (cnt.get(f.d.op_instalacion)||0)+1));
    filas.forEach(f => { if(cnt.get(f.d.op_instalacion) > 1) f.errors.push('OP INSTALACION repetida en el archivo'); });
    // Ya existentes en la base
    C.msg = 'Comparando con la base de datos'; renderCarga();
    const ops = [...cnt.keys()];
    const ya = await API.existentes(ops);
    filas.forEach(f => { if(ya.has(f.d.op_instalacion)) f.errors.push('Esa OP INSTALACION ya existe en la base'); });
    // Obras nuevas o con nombre parecido
    if(!S.obrasAll) S.obrasAll = S.anual ? S.anual.map(r=>r.obra) : await API.todasObras();
    const exist = new Set(S.obrasAll), porClave = new Map();
    for(const o of exist) porClave.set(obraKey(o), o);
    const obrasInfo = new Map();
    for(const f of filas){
      const o = f.d.obra; if(!o) continue;
      if(!obrasInfo.has(o)){
        const parecida = !exist.has(o) ? (porClave.get(obraKey(o)) || null) : null;
        obrasInfo.set(o, {nueva: !exist.has(o), parecida});
      }
      const inf = obrasInfo.get(o);
      if(inf.parecida) f.warns.push(`¿Es la obra ${inf.parecida}? El nombre no coincide exactamente`);
    }
    C.filas = filas; C.obrasInfo = obrasInfo; C.soloProblemas = filas.some(f => f.errors.length);
    C.estado = 'revision';
  }catch(e){
    C.estado = 'inicio';
    toast(errMsg(e), true);
  }
  renderCarga();
}

    <div class="list-head">
      <span class="lbl">${C.soloProblemas ? 'Filas con problemas' : 'Todas las filas'} <b>${fmtN(lista.length)}</b></span>

      <tbody>${lista.slice(0,500).map(f => `<tr class="${f.errors.length?'err':''}">

        <td>${f.errors.map(e=>`<span class="obs e">${esc(e)}</span>`).join('')}${f.warns.map(w=>`<span class="obs w">${esc(w)}</span>`).join('')}${!f.errors.length&&!f.warns.length?'<span class="obs ok">OK</span>':''}</td>

async function confirmarCarga(){
  const ok = C.filas.filter(f => !f.errors.length);
  if(!ok.length) return;
  const obras = [...new Set(ok.map(f=>f.d.obra))];
  if(!confirm(`¿Cargar ${ok.length} ítems en ${obras.length === 1 ? 'la obra '+obras[0] : obras.length+' obras'}?\n\nEntrarán en estado EN COLA y tu asistente los verá de inmediato.`)) return;
  C.estado = 'cargando'; C.progreso = 0; renderCarga();
  const rows = ok.map(f => { const {precio, ...d} = f.d; return d; });
  let ins = [];
  try{
    ins = await API.insertItems(rows, n => { C.progreso = n; const el = document.querySelector('.loading'); if(el) el.lastChild.textContent = `Cargando ítems… ${fmtN(n)} de ${fmtN(rows.length)}`; });
    const idPorOp = new Map(ins.map(r => [r.op_instalacion, r.id]));
    const com = ok.map(f => ({item_id: idPorOp.get(f.d.op_instalacion), precio: f.d.precio})).filter(r => r.item_id);
    try{ await API.insertComercial(com); C.errComercial = null; }
    catch(e){ C.errComercial = errMsg(e); }
    C.cargados = {ids: ins.map(r=>r.id), obras, n: ins.length, total: rows.length};
  }catch(e){
    const parcial = (e && e.parcial) || [];
    C.cargados = {ids: parcial.map(r=>r.id), obras, n: parcial.length, total: rows.length, error: errMsg(e)};
  }
  C.estado = 'listo';
  S.obrasAll = null; S.anual = null; S.anualIdx = null; S.anualPos = null;
  try{ await loadActivos(); }catch(e){}
  renderCarga();
}

const M = {estado:'inicio', archivo:'', items:[], com:[], resumen:null, actual:null, backup:false, confirmTxt:'', log:[], error:null};
const STATUS_OK = new Set(['EN COLA','PRODUCCIÓN','ENSAMBLADO','DESPACHADO']);

function bTxt(v){ if(v==null) return null; const s = String(v).trim(); return (s===''||s==='#N/A'||s==='None') ? null : s; }
function bNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return v; const n = Number(String(v).trim().replace(',','.')); return isNaN(n) ? null : n; }
function bFecha(v, campo, notas){
  if(v==null||v==='') return null;
  if(typeof v === 'number'){ if(v > 30000 && v < 60000){ const d = new Date(Date.UTC(1899,11,30) + Math.floor(v)*864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); } }
  const s = String(v).trim(); if(!s || s==='#N/A') return null;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; if(y>=2010 && y<=2035 && +m[2]>=1 && +m[2]<=12 && +m[1]>=1 && +m[1]<=31) return y+'-'+pad(+m[2])+'-'+pad(+m[1]); }
  notas && notas.push(campo+': '+s); return null;
}
function bHora(v, campo, notas){
  if(v==null||v==='') return null;
  if(typeof v === 'number'){
    if(v >= 1 && Number.isInteger(v)){ notas && notas.push(campo+': '+v); return null; }   // un número entero no es una hora
    const fr = v - Math.floor(v); const m = Math.round(fr*1440); return pad(Math.floor(m/60)%24)+':'+pad(m%60);
  }
  const s = String(v).trim().toUpperCase().replace(/[\s.]/g,'');
  const m = s.match(/^(\d{1,2}):(\d{2})(AM|PM)?$/);
  if(m){ let hh=+m[1], mm=+m[2]; if(m[3]==='PM'&&hh<12) hh+=12; if(m[3]==='AM'&&hh===12) hh=0; if(hh<24&&mm<60) return pad(hh)+':'+pad(mm); }
  notas && notas.push(campo+': '+v); return null;
}
function bProc(v){ const s = (bTxt(v)||'').toUpperCase(); return s.startsWith('X') ? 'X' : (s==='+' ? '+' : null); }
function bSiNo(v){ const s = normH(bTxt(v)||''); return (s==='SI'||s==='X') ? true : (s==='NO' ? false : null); }   // acepta SI, Sí, si, X
function bCorte(v){ if(typeof v === 'number' && v > 30000 && v < 60000 && !Number.isInteger(v)) return String(Math.floor(v)); return v==null ? null : (bTxt(v)); }

      ${M.estado==='listo' ? `<div class="quick" style="margin-top:16px">

async function leerBase(file){
  M.estado = 'leyendo'; M.archivo = file.name; M.msg = 'Leyendo el archivo (puede tardar unos segundos)'; M.backup = false; M.confirmTxt = ''; M.error = null; renderCarga();
  try{
    if(!window.XLSX) await loadScript(XLSX_URL);
    const buf = await file.arrayBuffer();
    await new Promise(r => setTimeout(r, 30));
    const wb = XLSX.read(buf, {type:'array'});
    let aoa = null;
    const names = [...wb.SheetNames].sort((a,b) => (normH(b)==='HOJA1') - (normH(a)==='HOJA1'));
    for(const n of names){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null, blankrows:false});
      if(rows.length && rows[0] && rows[0].some(c=>normH(c)==='OBRA') && rows[0].some(c=>normH(c)==='STATUS PLANTA')){ aoa = rows; break; }
    }
    if(!aoa) throw new Error('No encontré la hoja de la BASE_ (encabezados OBRA y STATUS PLANTA en la primera fila).');
    const h = aoa[0].map(normH);
    const I = {}; h.forEach((x,i) => { if(I[x] === undefined) I[x] = i; });
    const vids = h.map((x,i) => x==='VIDRIO' ? i : -1).filter(i => i >= 0);
    const need = ['OBRA','ITEM','OP INSTALACION','STATUS PLANTA','DESPACHO','INSTALACION','PRECIO'];
    const faltan = need.filter(k => I[k] === undefined);
    if(faltan.length) throw new Error('Faltan columnas: '+faltan.join(', '));
    const items = [], com = [], st = {}, obras = new Set();
    let notasN = 0, inst = 0, descartadas = 0;
    for(let r = 1; r < aoa.length; r++){
      const row = aoa[r]; if(!row) continue;
      const g = k => I[k] === undefined ? null : row[I[k]];
      const obra = bTxt(g('OBRA'));
      if(!obra){ if(row.some(c => c!=null && String(c).trim()!=='')) descartadas++; continue; }
      const notas = [];
      let status = (bTxt(g('STATUS PLANTA'))||'EN COLA').toUpperCase();
      if(status === 'PRODUCCION') status = 'PRODUCCIÓN';
      const desp = (bTxt(g('DESPACHO'))||'').toUpperCase()==='SI' || status==='DESPACHADO';
      const ins = (bTxt(g('INSTALACION'))||'').toUpperCase()==='SI';
      const it = {
        obra, item:bTxt(g('ITEM')), ubicacion:bTxt(g('UBICACION')), sistema:bTxt(g('SISTEMA')), serie:bTxt(g('SERIE')),
        piso:bTxt(g('PISO')), diseno:bTxt(g('DISENO')), vidrio:bTxt(vids.length ? row[vids[0]] : null),
        ancho:bNum(g('ANCHO')), alto:bNum(g('ALTO')), m2:bNum(g('M2')), cant:bNum(g('CANT')),
        op:bTxt(g('OP')), op_instalacion:bTxt(g('OP INSTALACION')), fecha_op:bFecha(g('FECHA OP'),'fecha_op',notas),
        tiempo_op:bNum(g('TIEMPO OP')), puntos:bNum(g('PUNTOS')),
        cortado:bProc(g('CORTADO')), troquelado:bProc(g('TROQUELADO')), mecanizado:bProc(g('MECANIZADO')), programado:bProc(g('PROGRAMADO')),
        vidrio_proc:bProc(vids.length > 1 ? row[vids[1]] : null), prealistado:bProc(g('PREALISTADO')),
        ensamblador:bTxt(g('ENSAMBLADOR')),
        dia_inicio:bFecha(g('DIA INICIO'),'dia_inicio',notas), hora_inicio:bHora(g('HORA DE INICIO'),'hora_inicio',notas),
        dia_final:bFecha(g('DIA FINAL'),'dia_final',notas), hora_final:bHora(g('HORA FINAL'),'hora_final',notas),
        status, despachado:desp, fecha_despacho:bFecha(g('FECHA DESPACHO'),'fecha_despacho',notas), remision:bTxt(g('REMISION')),
        instalado:ins, fecha_instalacion:bFecha(g('FECHA INSTALACION'),'fecha_instalacion',notas), instalador:bTxt(g('INSTALADOR')),
        notas_importacion:null
      };
      if(!STATUS_OK.has(it.status)){ notas.push('status: '+it.status); it.status = deriveStatus(it); }
      if(notas.length){ it.notas_importacion = notas.join(' | '); notasN++; }
      items.push(it);
      com.push({precio:bNum(g('PRECIO')), cobrado_despacho:bSiNo(g('COBRADO PUESTO EN OBRA')), fecha_corte_despacho:bFecha(g('FECHA CORTE PUESTO EN OBRA')),
        num_corte_despacho:bCorte(g('# CORTE PUESTO EN OBRA')), cobrado_instalacion:bSiNo(g('COBRADO INSTALADO')),
        fecha_corte_instalacion:bFecha(g('FECHA CORTE INSTALADO')), num_corte_instalacion:bCorte(g('# CORTE INSTALADO'))});
      st[it.status] = (st[it.status]||0)+1; obras.add(obra); if(ins) inst++;
    }
    if(!items.length) throw new Error('El archivo no tiene filas con OBRA.');
    M.items = items; M.com = com;
    M.resumen = {n:items.length, st, inst, obras:obras.size, notas:notasN, descartadas};
    M.msg = 'Comparando con la base actual'; renderCarga();
    try{
      const act = S.anual || await API.anual();
      const ast = {}; let ainst = 0; const aob = new Set();
      for(const x of act){ ast[x.status] = (ast[x.status]||0)+1; if(x.instalado) ainst++; aob.add(x.obra); }
      M.actual = {n:act.length, st:ast, inst:ainst, obras:aob.size};
    }catch(e){ M.actual = null; }
    M.estado = 'revision';
  }catch(e){ M.estado = 'inicio'; toast(errMsg(e), true); }
  renderCarga();
}

async function migBackup(){
  if(M.actual && M.actual.n === 0){ M.backup = true; return renderCarga(); }
  const ok = await exportar('COPIA_SEGURIDAD');
  if(ok){ M.backup = true; renderCarga(); }
}

const mLog = t => { M.log.push(t); const el = document.querySelector('.mlog'); if(el) el.insertAdjacentHTML('beforeend', `<div>${esc(t)}</div>`); };
const mLast = t => { M.log[M.log.length-1] = t; const el = document.querySelector('.mlog'); if(el && el.lastChild) el.lastChild.textContent = t; };

async function migEjecutar(){
  if(!M.backup || normH(M.confirmTxt) !== 'REEMPLAZAR') return;
  M.estado = 'ejecutando'; M.log = []; M.error = null; renderCarga();
  try{ if(API.chan) await API.sb.removeChannel(API.chan); }catch(e){}
  const t0 = Date.now();
  try{
    mLog('Borrando la base actual…');
    const modo = await API.borrarTodo((n,max) => mLast(`Borrando la base actual (modo lento)… ${fmtN(n)} de ${fmtN(max)}`));
    mLast('✓ Base actual borrada' + (modo === 'lento' ? ' (modo lento: conviene crear la función vaciar_base, ver README)' : ''));
    mLog(`Cargando ítems… 0 de ${fmtN(M.items.length)}`);
    const ins = await API.insertItems(M.items, n => mLast(`Cargando ítems… ${fmtN(n)} de ${fmtN(M.items.length)}`), 500, 'id,obra,item,op_instalacion');
    // Emparejar los id nuevos con las filas del Excel (en orden; si algo no cuadra, por obra+ítem+OP)
    let ids = ins.map(r => r.id);
    const cuadra = ins.length === M.items.length && ins.every((r,i) => r.op_instalacion === M.items[i].op_instalacion && r.item === M.items[i].item && r.obra === M.items[i].obra);
    if(!cuadra){
      const pool = new Map();
      ins.forEach(r => { const k = r.obra+'|'+r.item+'|'+r.op_instalacion; if(!pool.has(k)) pool.set(k, []); pool.get(k).push(r.id); });
      ids = M.items.map(it => { const a = pool.get(it.obra+'|'+it.item+'|'+it.op_instalacion); return a && a.length ? a.shift() : null; });
    }
    mLast(`✓ ${fmtN(ins.length)} ítems cargados`);
    mLog('Cargando precios y cobros…');
    const com = M.com.map((c,i) => ({item_id: ids[i], ...c})).filter(c => c.item_id);
    for(let i=0; i<com.length; i+=1000){
      const {error} = await API.sb.from('items_comercial').insert(com.slice(i,i+1000)); if(error) throw error;
      mLast(`Cargando precios y cobros… ${fmtN(Math.min(i+1000, com.length))} de ${fmtN(com.length)}`);
    }
    mLast(`✓ ${fmtN(com.length)} registros de precios y cobros`);
    mLog('Actualizando la lista de ensambladores…');
    const ens = [...new Set(M.items.map(i => i.ensamblador && i.ensamblador.trim()).filter(Boolean))].map(nombre => ({nombre}));
    if(ens.length){ const {error} = await API.sb.from('ensambladores').upsert(ens, {onConflict:'nombre', ignoreDuplicates:true}); if(error) throw error; }
    try{ S.ensambladores = await API.ensambladores(); }catch(e){}
    mLast('✓ Ensambladores actualizados');
    mLog(`Listo en ${Math.round((Date.now()-t0)/1000)} segundos.`);
  }catch(e){
    M.error = errMsg(e);
  }
  S.obrasAll = null; S.anual = null; S.anualIdx = null; S.anualPos = null;
  try{ await loadActivos(); }catch(e){}
  API.realtime(onRemoteChange, st => { S.live = st === 'SUBSCRIBED'; });
  M.estado = 'listo'; M.confirmTxt = ''; M.backup = false;
  renderCarga();
}

function sheetCobro(tipo){
  if(!registraCobros()) return;
  const k = tipo === 'd' ? 'despacho' : 'instalacion';
  const T = tipo === 'd' ? 'despacho' : 'instalación';
  const items = selItems();
  const aptos = items.filter(i => tipo === 'd' ? i.despachado : i.instalado);
  const noAptos = items.length - aptos.length;
  const ya = aptos.filter(i => com(i)['cobrado_'+k]).length;
  const valor = aptos.reduce((a,i) => a + (Number(com(i).precio)||0), 0);
  const sinPrecio = aptos.filter(i => com(i).precio == null).length;
  const body = `
    <div class="seg wide" id="cobModo"><button class="on" data-v="reg">Registrar cobro</button><button data-v="quitar">Quitar cobro</button></div>
    <div id="cobCampos" class="fgrid"><div class="field"><span class="lbl">Fecha corte</span><input type="date" id="gFecha" value="${today()}"></div>
      <div class="field"><span class="lbl"># Corte</span><input id="gCorte" placeholder="Ej. 5"></div></div>
    ${warn(noAptos, tipo==='d' ? 'no están despachados y se omitirán.' : 'no están instalados y se omitirán.')}
    ${warn(ya, 'ya tenían cobro de '+T+'; se reemplazará la fecha y el corte.')}
    <div class="summary">${fmtN(aptos.length)} ítems${vePrecio() ? ` · valor total <b>$${fmtN(valor)}</b>${sinPrecio ? ` · ${fmtN(sinPrecio)} sin precio` : ''}` : ''}</div>`;
  openSheet('Cobro de '+T, subSel(items.length), body, `Aplicar a ${fmtN(aptos.length)}`, async () => {
    if(!aptos.length){ toast('Ningún ítem seleccionado está '+(tipo==='d'?'despachado':'instalado'), true); return false; }
    const quitar = document.querySelector('#cobModo .on').dataset.v === 'quitar';
    let patch;
    if(quitar) patch = {['cobrado_'+k]:false, ['fecha_corte_'+k]:null, ['num_corte_'+k]:null};
    else {
      const f = $('#gFecha').value, n = $('#gCorte').value.trim();
      if(!f){ toast('Falta la fecha de corte', true); return false; }
      if(!n){ toast('Falta el número de corte', true); return false; }
      patch = {['cobrado_'+k]:true, ['fecha_corte_'+k]:f, ['num_corte_'+k]:n};
    }
    let rows;
    if(isGerente()) rows = await API.upsertComercial(aptos.map(i => ({item_id:i.id, ...patch})));
    else {
      await API.marcarCobros(aptos.map(i => i.id), k, !quitar, patch['fecha_corte_'+k], patch['num_corte_'+k]);
      rows = await API.cobros(aptos.map(i => i.id));
    }
    rows.forEach(r => S.com.set(r.item_id, r));
    S.sel.clear(); refreshAfterChange();
    toast(`✓ ${quitar ? 'Cobro quitado' : 'Cobro registrado'} en ${fmtN(rows.length)} ítems`);
  });
  document.querySelectorAll('#cobModo button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#cobModo button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('#cobCampos').style.display = b.dataset.v === 'quitar' ? 'none' : '';
    $('#shOk').textContent = (b.dataset.v === 'quitar' ? 'Quitar en ' : 'Aplicar a ') + fmtN(aptos.length);
  });
}

// ════════════════════════════════════════════════════════════════
//  SINCRONIZACIÓN
// ════════════════════════════════════════════════════════════════
function mergeRows(rows){
  S.plCache = null; S.cobPend = null; S.cobCortes = null; S.cobH = null;
  for(const r of rows){
    const i = S.items.findIndex(x => x.id === r.id);
    if(i >= 0) S.items[i] = {...S.items[i], ...r};
    const a = S.activos.findIndex(x => x.id === r.id);
    const full = i >= 0 ? S.items[i] : r;
    const activo = !(full.despachado && full.instalado);
    if(a >= 0){ if(activo) S.activos[a] = {...S.activos[a], ...pick(full)}; else S.activos.splice(a,1); }
    else if(activo && full.obra) S.activos.push(pick(full));
    if(S.anual){
      if(!S.anualPos){ S.anualPos = new Map(); S.anual.forEach((x,k) => S.anualPos.set(x.id,k)); }
      const k = S.anualPos.get(full.id);
      const v = {id:full.id, obra:full.obra, fecha_op:full.fecha_op, dia_inicio:full.dia_inicio, fecha_despacho:full.fecha_despacho, status:full.status, despachado:full.despachado, instalado:full.instalado};
      if(k != null) S.anual[k] = v; else if(full.obra){ S.anualPos.set(full.id, S.anual.length); S.anual.push(v); }
      S.anualIdx = null;
    }
  }
}
const pick = r => ({id:r.id, obra:r.obra, status:r.status, despachado:r.despachado, instalado:r.instalado, m2:r.m2, fecha_op:r.fecha_op, dia_inicio:r.dia_inicio, hora_inicio:r.hora_inicio, dia_final:r.dia_final, ensamblador:r.ensamblador, op:r.op, fecha_despacho:r.fecha_despacho});

function refreshAfterChange(){
  S.cobPend = null; S.cobCortes = null; S.cobH = null;
  if(S.view === 'obra'){
    const y = window.scrollY;
    renderChips(); renderList(); renderSelbar();
    if(S.detailId){ if(!S.draft || !S.draft._dirty) S.draft = draftOf(byId(S.detailId)); renderDetail(); }
    window.scrollTo(0, y);
  } else if(S.view === 'home') refreshHomeBox();
}

let rtTimer = null;
function onRemoteChange(p){
  const r = p.new && p.new.id ? p.new : null;
  if(p.eventType === 'DELETE'){ const id = p.old && p.old.id; S.items = S.items.filter(i=>i.id!==id); S.activos = S.activos.filter(i=>i.id!==id); }
  else if(r){
    if(p.eventType === 'INSERT' && r.obra === S.obra && !S.items.some(i=>i.id===r.id)) S.items.push(r);
    mergeRows([r]);
  }
  clearTimeout(rtTimer);
  rtTimer = setTimeout(() => {
    if(S.view === 'obra'){
      const y = window.scrollY; renderChips(); renderList(); window.scrollTo(0,y);
      if(S.detailId && S.draft && !S.draft._dirty){ S.draft = draftOf(byId(S.detailId)); renderDetail(); }
    } else if(S.view === 'home') refreshHomeBox();
  }, 400);
}

// ════════════════════════════════════════════════════════════════
//  EXPORTAR (solo gerente)
// ════════════════════════════════════════════════════════════════
function loadScript(src){ return new Promise((ok,ko) => { const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
async function exportar(prefijo){
  if(!vePrecio()) return false;
  if(typeof prefijo !== 'string') prefijo = 'BASE';
  toast('Preparando el Excel… puede tardar unos segundos');
  try{
    if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const rows = await API.exportar();
    if(!rows.length) return toast('La consulta no devolvió filas', true);
    const cols = Object.keys(rows[0]);
    const dateCols = cols.filter(c => /^(FECHA|DIA )/.test(c));
    const serial = s => { const [y,m,d] = s.split('-').map(Number); return (Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 864e5; };
    for(const r of rows) for(const c of dateCols) if(r[c]) r[c] = serial(r[c]);
    const ws = XLSX.utils.json_to_sheet(rows, {header:cols});
    const rng = XLSX.utils.decode_range(ws['!ref']);
    dateCols.forEach(c => { const ci = cols.indexOf(c); for(let R=1; R<=rng.e.r; R++){ const cell = ws[XLSX.utils.encode_cell({r:R,c:ci})]; if(cell && cell.t==='n') cell.z = 'dd/mm/yyyy'; } });
    ws['!cols'] = cols.map(c => ({wch: Math.max(10, Math.min(28, c.length+2))}));
    ws['!autofilter'] = {ref: ws['!ref']};
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Hoja1');
    XLSX.writeFile(wb, `${prefijo}_${today()}.xlsx`);
    toast(`✓ Exportados ${fmtN(rows.length)} registros`);
    if(isGerente()){
      try{ localStorage.setItem('ult_respaldo', new Date().toISOString()); }catch(e){}
      API.registrarRespaldo('app', rows.length).catch(()=>{}).finally(() => loadRespaldo());
    }
    return true;
  }catch(e){ toast('Error al exportar: '+errMsg(e), true); return false; }
}

// ── Copia de seguridad: aviso solo para el gerente ──
async function loadRespaldo(){
  if(!isGerente()) return;
  let r = null;
  try{ r = await API.ultimoRespaldo(); }
  catch(e){ try{ const t = localStorage.getItem('ult_respaldo'); r = t ? {cuando:t, origen:'app'} : null; }catch(_){ } }
  S.resp = r || {cuando:null};
  if(S.view === 'home') renderHome();
}
function respaldoHTML(){
  if(!isGerente() || !S.resp) return '';
  const c = S.resp.cuando ? new Date(S.resp.cuando) : null;
  const horas = c ? (Date.now() - c) / 36e5 : Infinity;
  const cuando = c ? c.toLocaleString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric', hour:'numeric', minute:'2-digit'}) : '';
  const origen = S.resp.origen === 'mac' ? 'automática en el Mac' : 'manual desde la app';
  if(horas < 26) return `<div class="resp ok">✓ Copia de seguridad ${cuando} · ${origen}</div>`;
  return `<div class="resp warn"><div><b>Copia de seguridad pendiente.</b> ${c ? `La última fue el ${cuando} (${origen}).` : 'Aún no hay ninguna copia registrada.'}</div>
    <button class="btn sm primary" onclick="exportar('COPIA_SEGURIDAD')">${ICON.down} Hacer copia ahora</button></div>`;
}

// ════════════════════════════════════════════════════════════════
//  MENSAJES
// ════════════════════════════════════════════════════════════════
function errMsg(e){
  const m = (e && (e.message||e.error_description)) || String(e);
  if(/Sin permiso/.test(m)) return 'Sin permiso para modificar los datos de la OP.';
  if(/JWT|token/i.test(m)) return 'Tu sesión expiró. Vuelve a ingresar.';
  if(/fetch|network/i.test(m)) return 'Sin conexión. Revisa el internet e intenta de nuevo.';
  return m;
}
let toastT = null;
function toast(msg, err){
  let el = $('#toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.className = 'toast'+(err?' err':''); el.textContent = msg; el.style.display='';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display='none', err ? 4500 : 2600);
}
let wideMode = window.innerWidth >= 1100;
window.addEventListener('resize', () => { const w = window.innerWidth >= 1100; if(w !== wideMode){ wideMode = w; if(S.view==='obra' && S.detailId) renderDetail(); } });

if('serviceWorker' in navigator && !window.__DEMO__ && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('DOMContentLoaded', boot);
</script>
