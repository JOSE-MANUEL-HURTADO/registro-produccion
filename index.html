<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Registro">

<title>Registro de Producción</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/ios-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/ios-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/ios-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/ios-152.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/ios-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png?v=2">

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181818;--surface:#222222;--surface2:#272727;--surface3:#2f2f2f;--border:#3a3a3a;--border2:#4a4a4a;
  --text:#f0f0f0;--text2:#c0c0c0;--muted:#8a8a8a;--dim:#5e5e5e;
  --cola:#c8a84b;--prod:#555555;--ens:#888888;--desp:#e8e8e8;--inst:#9db39a;--danger:#d0705f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --mono:'DM Mono',ui-monospace,monospace;--sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);min-height:100%;overscroll-behavior-y:none;}
body{font-family:var(--mono);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(135deg,rgba(255,255,255,.015) 0%,transparent 60%),
  repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
input,select{font-family:var(--mono);font-size:16px;color:var(--text);background:var(--surface3);border:1px solid var(--border);border-radius:0;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none;min-height:44px;}
input:focus,select:focus{border-color:var(--text2);}
input[type=date],input[type=time]{min-width:0;}
input[readonly]{background:transparent;font-weight:600;letter-spacing:.04em;}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
.hidden{display:none!important;}
.lbl{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.mono{font-family:var(--mono);}


/* ════ ÁRTICA ════ negro #272727, blanco, grises #3F3C39 y #324549 · DIN Condensed (títulos) · Futura Condensed Light (cuerpo) · esquinas rectas */
body.artica{--bg:#272727;--surface:#2f2e2c;--surface2:#3F3C39;--surface3:#34322f;--border:#4a4743;--border2:#5c5853;--text:#ffffff;--text2:#d6d4d1;--muted:#9a9894;--dim:#6b6864;
  --art-acento:#324549;--art-t:'DIN Condensed','DINCondensed-Bold','Barlow Condensed',sans-serif;--art-b:'Futura Condensed Light','Futura-CondensedLight','Futura Condensed','Barlow Condensed',sans-serif;
  font-family:var(--art-b);font-weight:300;font-size:16px;background-image:none;}
body.artica *{border-radius:0!important;}
html:has(body.artica){background:#272727;}
body.artica .badge-new{background:#324549;color:#fff;}
body.artica .h1,body.artica .brand-name,body.artica .tab,body.artica .btn,body.artica .lbl,body.artica .section-t,body.artica .cs-t,body.artica .sh-title{font-family:var(--art-t);font-weight:700;letter-spacing:.06em;}
body.artica .h1{font-size:30px;text-transform:uppercase;}
body.artica .tabs .tab{font-size:15px;}
body.artica .btn{font-size:14px;}
body.artica .btn.primary{background:#fff;color:#272727;}
body.artica input,body.artica select,body.artica .mono{font-family:var(--art-b);font-size:17px;}
body.artica .tab.on{border-color:#fff;color:#fff;}
body.artica .sheet{background:#2f2e2c;}
.art-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.art-est{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:16px;}
.art-est>div{background:var(--surface2);padding:10px;}.art-est b{display:block;font-family:var(--art-t,var(--sans));font-size:26px;font-weight:700;}.art-est span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
@media(max-width:640px){.art-est{grid-template-columns:repeat(3,minmax(0,1fr));}}
.art-seg{display:flex;border:1px solid var(--border2);margin-bottom:12px;width:max-content;max-width:100%;}.art-seg button{padding:10px 18px;font-family:var(--art-t,var(--sans));font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--border2);}.art-seg button:last-child{border-right:0;}.art-seg button.on{background:#fff;color:#272727;}.art-seg b{margin-left:6px;}
.art-oc-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px;}.art-oc-nums div{display:flex;flex-direction:column;gap:2px;}.art-oc-nums b{font-size:18px;font-weight:600;font-family:var(--art-t,var(--mono));}.art-oc-nums span{font-size:9.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
.art-op{border:1px solid var(--border);margin-bottom:6px;background:var(--surface);}
.art-op-h{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:10px 12px;text-align:left;align-items:center;}
.art-op-n{font-family:var(--art-t,var(--mono));font-size:20px;font-weight:700;}.art-op-i{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.art-op-c{text-align:right;}
.art-bar{grid-column:1/-1;height:4px;background:var(--surface3);}.art-bar i{display:block;height:100%;background:#fff;}
.art-pz{border-top:1px solid var(--border);}
.art-pzr{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:6px 14px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center;}
@media(max-width:760px){.art-pzr{grid-template-columns:1fr;}}
.art-pzm b{font-family:var(--art-t,var(--mono));font-size:20px;}.art-pzm span{color:var(--muted);font-size:13px;display:block;}
.art-ruta{display:flex;gap:3px;}.art-ruta span{width:40px;text-align:center;border:1px solid var(--border2);padding:3px 0;font-family:var(--art-t,var(--mono));font-weight:700;font-size:16px;line-height:1.1;color:var(--muted);}
.art-ruta span small{display:block;font-size:10px;font-weight:400;}.art-ruta span.mid{color:var(--text);background:var(--art-acento,#324549);}.art-ruta span.ok{background:#fff;color:#272727;border-color:#fff;}.art-ruta span.now{outline:2px solid #fff;}
.art-pzs{font-size:13px;color:var(--text2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.art-lote-obra{font-family:var(--art-t);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px;font-size:15px;}
.art-lote{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);margin-bottom:6px;background:var(--surface);}
.art-lote > div:first-child{display:flex;flex-direction:column;gap:2px;}.art-lote span{color:var(--muted);font-size:13px;}
.art-env{margin-top:14px;}.art-env summary{cursor:pointer;font-family:var(--art-t);font-weight:700;letter-spacing:.04em;padding:8px 0;color:var(--text2);}
.art-opsel{max-height:40vh;overflow:auto;border:1px solid var(--border);}.art-opsel label{cursor:pointer;}.art-opsel label.on{background:rgba(255,255,255,.08);}
/* Casillas legibles en el tema oscuro (en Safari el chulo salía blanco sobre blanco) */
input[type=checkbox]{-webkit-appearance:none!important;appearance:none!important;flex:none;width:22px!important;height:22px!important;min-height:0!important;padding:0!important;margin:0;border:2px solid var(--text);background:transparent;display:inline-grid;place-content:center;cursor:pointer;border-radius:0;vertical-align:middle;}
input[type=checkbox]:checked{background:var(--text);}
input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid var(--bg);border-width:0 3px 3px 0;transform:translate(0,-1px) rotate(45deg);}
input[type=checkbox]:disabled{opacity:.4;cursor:default;}.art-opsel label{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);}.art-opsel span{color:var(--muted);font-size:13px;}
.art-oprow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--border);}.art-oprow>b{min-width:160px;}.art-oprow div{display:flex;gap:12px;flex-wrap:wrap;}.art-oprow label{display:flex;gap:6px;align-items:center;}.art-oprow select{width:auto;}
/* Pantalla del operario: el único lugar con verde y rojo */
.artop{min-height:100vh;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 14px);gap:12px;}
.artop-top{display:flex;justify-content:space-between;align-items:center;}.artop-brand{display:flex;align-items:center;gap:12px;}
.art-sym{height:44px;width:auto;flex:none;display:block;}
.artop .art-sym{height:36px;}.artop .art-name{font-size:19px;letter-spacing:.28em;}
.art-name{font-family:var(--sans);font-weight:300;font-size:24px;letter-spacing:.32em;line-height:1;text-transform:uppercase;color:#fff;}
.art-name sup{font-size:.35em;letter-spacing:0;vertical-align:top;margin-left:-.2em;}
.art-brand .brand-sub{font-family:var(--art-t);font-weight:700;letter-spacing:.24em;color:#d6d4d1;font-size:11px;margin-top:7px;}
.top .art-name{font-size:21px;}
@media(max-width:640px){.top .art-sym{height:36px;}.top .art-name{font-size:16px;letter-spacing:.26em;}}
.artop-who{display:flex;gap:8px;align-items:center;color:var(--text2);}
.artop-bar{display:flex;align-items:center;gap:14px;border:1px solid var(--border);padding:10px 14px;background:var(--surface2);}
.artop-est{font-family:var(--art-t);font-size:34px;font-weight:700;text-transform:uppercase;line-height:1;}
.artop-cnt{margin-left:auto;text-align:right;}.artop-cnt b{display:block;font-family:var(--art-t);font-size:40px;line-height:1;}.artop-cnt span{color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.1em;}
.artop-panel{flex:1;min-height:42vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;border:1px solid var(--border);background:#323130;transition:background .15s;}
.artop-panel.st-ok{background:#1f7a3a;border-color:#1f7a3a;}.artop-panel.st-fuera,.artop-panel.st-noruta,.artop-panel.st-nohay,.artop-panel.st-err{background:#b3261e;border-color:#b3261e;}
.artop-panel.st-ya,.artop-panel.st-deshecho{background:#000;border-color:#fff;}
.artop-idle{font-family:var(--art-t);font-size:30px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.artop-estado{font-family:var(--art-t);font-size:30px;font-weight:700;letter-spacing:.1em;}
.artop-op{font-family:var(--art-t);font-size:clamp(64px,14vw,140px);font-weight:700;line-height:1;}
.artop-med{font-family:var(--art-t);font-size:clamp(48px,10vw,100px);font-weight:700;line-height:1.05;}
.artop-tipo{font-size:20px;margin-top:6px;}.artop-n{font-family:var(--art-t);font-size:30px;margin-top:10px;}.artop-msg{font-size:22px;margin-top:10px;}
.artop-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;}.artop-in input{font-size:20px;min-height:56px;}
.artop-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}.artop-acts .btn{min-height:56px;}
@media(max-width:640px){.artop-acts .btn{font-size:11px;letter-spacing:.06em;padding:6px 4px;white-space:normal;line-height:1.2;}.artop-panel{min-height:34vh;}.artop-acts{grid-template-columns:1fr 1fr;}.artop-acts #aoCamBtn{grid-column:1/-1;order:-1;min-height:64px;font-size:14px;}}
.artop-vid{width:100%;max-height:30vh;object-fit:cover;background:#000;}
.artop-elige{display:flex;flex-direction:column;gap:12px;margin-top:20px;}.artop-t{font-family:var(--art-t);font-size:30px;font-weight:700;text-transform:uppercase;}
.artop-estbtn{min-height:84px;border:1px solid var(--border2);font-family:var(--art-t);font-size:34px;font-weight:700;text-transform:uppercase;background:var(--surface2);}

/* ── Botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--border2);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
.btn:hover{border-color:var(--text2);}
.btn:active{transform:scale(.98);}
a.btn{color:var(--text);}
.btn.primary{background:var(--text);color:#181818;border-color:var(--text);}
.btn.primary:hover{background:#fff;}
.btn.primary:disabled{background:var(--surface3);color:var(--dim);border-color:var(--border);cursor:default;}
.btn.ghost{border-color:transparent;color:var(--text2);}
.btn.sm{min-height:34px;padding:0 12px;font-size:11px;}
.btn svg{width:15px;height:15px;flex-shrink:0;}

/* ── Login ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 24px) 20px calc(var(--sb) + 24px);}
.login-box{width:100%;max-width:380px;}
.login-box .brand{margin-bottom:44px;}
.login-box form{display:flex;flex-direction:column;gap:14px;}
.login-err{color:var(--danger);font-size:13px;min-height:18px;}

/* ── Marca ── */
.brand{display:flex;align-items:center;gap:14px;}
.brand svg{width:40px;height:31px;flex-shrink:0;}
.brand-name{font-family:var(--sans);font-weight:300;font-size:26px;letter-spacing:.3em;line-height:1;text-transform:uppercase;}
.brand-name sup{font-size:10px;letter-spacing:0;opacity:.6;margin-left:1px;}
.brand-sub{font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:6px;}

/* ── Encabezado ── */
.top{position:sticky;top:0;z-index:20;background:rgba(24,24,24,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(var(--st) + 12px) calc(var(--sr) + 18px) 12px calc(var(--sl) + 18px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;}
.top .brand-name{font-size:20px;}
.top .brand svg{width:32px;height:25px;}
.av-btn{position:relative;font-size:17px;}.av-n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#b3261e;color:#fff;font-size:11px;line-height:20px;text-align:center;font-family:var(--sans);}
.av-lista{display:flex;flex-direction:column;gap:8px;}.av-it{border:1px solid var(--border);padding:10px 12px;font-size:13px;line-height:1.5;}.av-it.nuevo{border-color:var(--cola);box-shadow:inset 3px 0 0 var(--cola);}.av-top{display:flex;justify-content:space-between;gap:10px;}.av-top span{color:var(--text2);font-size:12px;white-space:nowrap;}.av-sub{color:var(--text2);font-size:12px;}
.op-res{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}.op-res button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--border);background:var(--surface);width:100%;font-size:13px;}.op-res button:hover{border-color:var(--text2);}.op-res small{color:var(--text2);letter-spacing:.06em;}.op-res-e{font-size:12px;color:var(--text2);white-space:nowrap;}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
@media(max-width:640px){.top-r{gap:6px;}.top-r .icon-btn{width:40px;height:40px;}}
.who{text-align:right;font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--text2);}
.who .rol{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--text2);}
.icon-btn:hover{border-color:var(--text2);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}

main{padding:18px calc(var(--sr) + 18px) calc(var(--sb) + 110px) calc(var(--sl) + 18px);max-width:1600px;margin:0 auto;}

/* ── Inicio: obras ── */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.h1{font-family:var(--sans);font-weight:300;font-size:24px;letter-spacing:.2em;text-transform:uppercase;}
.h1-sub{color:var(--muted);font-size:12px;margin-top:4px;}
.search{position:relative;flex:1;max-width:420px;min-width:220px;}
.search input{padding-left:40px;}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.legend span{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.legend i{width:10px;height:10px;display:inline-block;}
.grid-obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.obra-card{background:var(--surface);border:1px solid var(--border);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;position:relative;transition:border-color .15s;}
.obra-card:hover{border-color:var(--border2);}
.obra-card:active{transform:scale(.99);}
.obra-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--text);opacity:.5;}
.oc-name{font-family:var(--sans);font-weight:500;font-size:16px;letter-spacing:.12em;text-transform:uppercase;}
.oc-meta{color:var(--muted);font-size:12px;margin-top:3px;}
.bar{display:flex;height:6px;background:var(--surface3);overflow:hidden;}
.bar i{display:block;height:100%;}
.oc-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.oc-nums div{display:flex;flex-direction:column;gap:2px;}
.oc-nums b{font-size:18px;font-weight:500;}
.oc-nums span{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.section-t{font-family:var(--sans);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:10px;}
.section-t::after{content:'';flex:1;height:1px;background:var(--border);}
.other-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;}
.other-list button{background:var(--surface);border:1px solid var(--border);padding:12px 14px;text-align:left;display:flex;justify-content:space-between;gap:8px;font-size:13px;}
.other-list button span{color:var(--muted);}
.st-tiles.cob-tiles{grid-template-columns:repeat(2,1fr);}
.cob-tools{display:flex;gap:6px;justify-content:flex-end;padding:6px 10px;border-bottom:1px solid var(--border);}
.cob-op{cursor:pointer;}
.cob-op .o{display:flex;align-items:center;gap:10px;}
.cob-ck{width:20px;height:20px;border:1px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.cob-ck svg{width:14px;height:14px;}
.cob-op.on{background:rgba(200,168,75,.08);}
.cob-op.on .cob-ck{background:var(--cola);border-color:var(--cola);color:#181818;}
.cob-its{color:var(--text2)!important;font-size:12px!important;line-height:1.45;white-space:normal;word-break:break-word;}
.cob-its b{font-family:var(--mono);font-weight:400;color:var(--text);}
.cob-its i{font-style:normal;color:var(--cola);font-family:var(--mono);}
.cob-cortes{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);}

// Laminado 3+3 = 6 mm; templado / crudo = su calibre. El +1 mm cubre aluminio, herrajes, empaques…
function calibreVidrio(txt){
  let t = String(txt || '').toUpperCase().replace(/,/g, '.').trim();
  if(!t) return null;
  let m = t.match(/\((\d{1,2}(?:\.\d)?)\s*MM\)/); if(m) return {mm: +m[1], aprox: false};
  t = t.replace(/\d*PVB[\s.]*\d*(?:\.\d+)?/g, ' ');                       // el PVB no cuenta
  const suma = s => [...s.matchAll(/(?<![\d.])(\d{1,2}(?:\.\d)?)(?![\d.])/g)].reduce((a, x) => a + +x[1], 0);
  if(/^D\.?\s*A\b/.test(t) || t.includes('/')){                                  // doble vidrio: se quita la cámara

  m = t.match(new RegExp(N + '\\s*(?:MM)?\\s*\\+[A-Z .+]*?' + N + '(?:\\s*(?:MM)?\\s*[A-Z .]*\\+[A-Z .]*?' + N + '(?![\\d.]))?'));
  if(m) return {mm: +m[1] + +m[2] + (m[3] ? +m[3] : 0), aprox: false};

  m = t.match(/^LAM.*?(?<![\d.])(\d{1,2})$/); if(m) return {mm: 2 * +m[1], aprox: true};

const pesoTotal = l => { let kg = 0, sin = 0; for(const it of l){ const p = pesoItem(it); if(p == null) sin++; else kg += p; } return {kg, sin}; };

  async borrarTodo(onProgress){
    // Vía rápida: función de la base (solo gerente) que vacía las tablas de una vez.
    const rpc = await this.sb.rpc('vaciar_base');
    if(!rpc.error) return 'rapido';
    const faltaFn = /vaciar_base|could not find|schema cache|404/i.test((rpc.error.message||'')+(rpc.error.code||''));
    if(!faltaFn) throw rpc.error;
    // Vía lenta (respaldo): bloques pequeños.
    const {data,error} = await this.sb.from('items').select('id').order('id',{ascending:false}).limit(1);
    if(error) throw error;
    const max = data.length ? data[0].id : 0;
    const paso = 500;
    for(let a=0; a<=max; a+=paso){
      const r = await this.sb.from('items').delete().gte('id',a).lt('id',a+paso);
      if(r.error) throw r.error;
      onProgress && onProgress(Math.min(a+paso, max), max);
    }
    return 'lento';
  },

// Foto reducida a 1600 px con sello de fecha, hora, obra y OP
async function novSellar(file, sello){
  const url = URL.createObjectURL(file);
  try{
    const im = new Image(); im.src = url; await im.decode();
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
    const fs = Math.max(16, Math.round(w / 42)), band = Math.round(fs * 2.9);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d');
    cx.drawImage(im, 0, 0, w, h);
    cx.fillStyle = 'rgba(0,0,0,.62)'; cx.fillRect(0, h - band, w, band);
    cx.fillStyle = '#fff'; cx.font = `bold ${fs}px Helvetica, Arial, sans-serif`; cx.textBaseline = 'middle';
    cx.fillText(sello[0], fs * .6, h - band + band * .32, w - fs * 1.2);
    cx.font = `${Math.round(fs * .85)}px Helvetica, Arial, sans-serif`;
    cx.fillText(sello[1], fs * .6, h - band + band * .72, w - fs * 1.2);
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .82));
  } finally { URL.revokeObjectURL(url); }
}

  const logo = await etqLogo();
  const doc = new jspdf.jsPDF({unit:'mm', format:'letter'}), PW = 215.9, PH = 279.4, M = 14;
  let y = 0, pag = 0;
  const enc = () => { pag++;
    if(logo){ const h = 11; doc.addImage(logo.url, 'PNG', M, 11, h * logo.r, h); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(20); doc.text('NOVEDADES DE INSTALACIÓN', PW - M, 16, {align:'right'});

    doc.setDrawColor(180); doc.line(M, 30, PW - M, 30); y = 37; };
  const salto = h => { if(y + h > PH - 16){ doc.addPage(); enc(); } };
  const dataURL = blob => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(blob); });
  enc();

  const intro = doc.splitTextToSize(`Registro de las novedades que impidieron la instalación de ítems en la obra. La fecha y hora de cada novedad fueron asignadas por el servidor en el momento del reporte y los registros no se pueden modificar ni eliminar. Las fotos llevan impresa la fecha, hora, obra y OP del reporte. Total: ${l.length} novedad${l.length === 1 ? '' : 'es'} (${l.filter(novAbierta).length} abiertas).`, PW - 2 * M);
  doc.text(intro, M, y); y += intro.length * 3.8 + 4;
  for(const n of l){
    const its = (n.items || []).map(byId).filter(Boolean);
    const filas = [
      [`N.º ${n.id} · ${fechaHora(n.creada)}`, 'bold', 10],

      [`Ítems (${(n.items || []).length}): ${its.length ? its.map(i => `${i.op_instalacion || i.op} ${i.item || ''}${i.ubicacion ? ' (' + lugarCorto(i.ubicacion) + ')' : ''}`).join(', ') : n.ops || ''}${n.piso ? ' · ' + n.piso : ''}`, 'normal', 8.5],
      n.detalle ? [`Detalle: ${n.detalle}`, 'normal', 8.5] : null,
      [`Reportó: ${n.quien || '—'}${n.instalador ? ' · instalador ' + n.instalador : ''}${its.length ? ' · ' + novInstaladosTxt(n) : ''}`, 'normal', 8],
      [n.resuelta_en ? `Resuelta el ${fechaHora(n.resuelta_en)}${n.resuelta_por ? ' por ' + n.resuelta_por : ''}${n.resuelta_nota ? ': ' + n.resuelta_nota : ''}` : 'Estado: ABIERTA', 'bold', 8]
    ].filter(Boolean).map(([t, f, s]) => { doc.setFont('helvetica', f); doc.setFontSize(s); return [doc.splitTextToSize(t, PW - 2 * M - 6), f, s]; });
    const hTxt = filas.reduce((s, [ls, , sz]) => s + ls.length * sz * .42 + 1.2, 0) + 4;
    salto(hTxt + 4);
    doc.setDrawColor(novAbierta(n) ? 190 : 200, novAbierta(n) ? 60 : 200, novAbierta(n) ? 60 : 200); doc.setLineWidth(.4); doc.rect(M, y - 4, PW - 2 * M, hTxt);
    let yy = y;
    for(const [ls, f, s] of filas){ doc.setFont('helvetica', f); doc.setFontSize(s); doc.setTextColor(20); doc.text(ls, M + 3, yy); yy += ls.length * s * .42 + 1.2; }
    y += hTxt + 2;
    // Fotos: 3 por fila
    const fw = (PW - 2 * M - 8) / 3; let col = 0, hFila = 0;
    for(const ruta of (n.fotos || [])){
      let im; try{ const u = await dataURL(await API.novedadFotoBajar(ruta)); const i = new Image(); i.src = u; await i.decode(); im = {u, r: i.naturalHeight / i.naturalWidth}; }catch(e){ continue; }
      const fh = Math.min(fw * im.r, 90);
      if(col === 0) salto(fh + 3);
      const fx = M + col * (fw + 4), w = im.r * fw > 90 ? 90 / im.r : fw;
      doc.addImage(im.u, 'JPEG', fx, y, w, fh); hFila = Math.max(hFila, fh);
      col++; if(col === 3){ col = 0; y += hFila + 4; hFila = 0; }
    }

    y += 6;
  }
  doc.setFontSize(7); doc.setTextColor(140); doc.text(`Novedades de instalación · ${S.obra} · Elíptica`, M, PH - 8);
  const nombre = `Novedades_${S.obra.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_')}.pdf`;
  const blob = doc.output('blob'), file = new File([blob], nombre, {type:'application/pdf'}), url = URL.createObjectURL(blob);
  const puede = !!(navigator.canShare && navigator.canShare({files:[file]}));
  window._novPdf = {file, url, nombre};
  openSheet('PDF de novedades', esc(S.obra), `<div class="summary"><b>${l.length} novedad${l.length === 1 ? '' : 'es'}</b> con fecha, hora, motivo y fotos.</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      ${puede ? `<button class="btn primary" onclick="navigator.share({files:[_novPdf.file], title:_novPdf.nombre}).catch(()=>{})">Compartir / Imprimir</button>` : ''}
      <a class="btn ${puede ? '' : 'primary'}" href="${url}" target="_blank" rel="noopener" style="text-decoration:none;justify-content:center">Abrir PDF</a>
      <a class="btn" href="${url}" download="${esc(nombre)}" style="text-decoration:none;justify-content:center">${ICON.down} Descargar PDF</a></div>`, 'Listo', async () => {});
}

const artCod = p => 'ART:' + p.id;
const artMed = p => `${p.ancho} × ${p.alto}`;
// Templado: se corta 4 mm más de ancho y 4 mm más de alto para pulirlo sin perder la medida de la OP
const artTempl = p => (p.ruta || []).includes('templado') || /TEMP/i.test(p.tipo || '');
// Canto a canto (cc): se respeta la medida de la OP (no se pule, no se suman 4 mm)
const artCC = p => p.canto === 'cc';
// Solo el templado con canto PULIDO se corta 4 mm más; fileteado ('fil') y canto a canto ('cc') respetan la medida de la OP
// Se corta a la medida exacta de la OP: OPTIMA agrega la amoladura según el calibre
const artCorte = p => ({ancho: Number(p.ancho), alto: Number(p.alto)});
// Descripción del canto: la de la OP de clientes; en Elíptica, laminado = canto a canto, lo demás pulido
const artCanto = p => { const d = String(p.canto_desc || '').trim().toUpperCase(); if(d) return d.replace(/^CANTO\s+(?!A\s+CANTO)/, '');
  if(p.canto === 'cc') return 'CANTO A CANTO'; if(p.canto === 'fil') return 'FILETEADO';
  return /(^|[^A-Z])LAM/i.test(p.tipo || '') || !(p.ruta || []).includes('pulido') ? 'CANTO A CANTO' : 'PULIDO'; };
// Hecho en una estación = base (terminadas antes de la app) + escaneos − rotas (por reprocesar), entre 0 y la cantidad
const artHechos = (p, e) => Math.max(0, Math.min(p.cant, (p.base != null ? p.base : (p.historica ? p.cant : 0)) + Number((p.hechos || {})[e] || 0) - (p.rotas || 0)));
const artUltimo = p => p.ruta[p.ruta.length - 1];
const artListas = p => artHechos(p, artUltimo(p));
// En qué paso va: el primero de la ruta que no tiene todas las piezas
function artPaso(p){ for(const e of p.ruta) if(artHechos(p, e) < p.cant) return e; return null; }

  const h = rows[0].map(x => x.toUpperCase());
  const col = re => h.findIndex(x => re.test(x));
  const tieneHead = h.some(x => /[A-Z]{3,}/.test(x) && !/^ART/.test(x));
  let iRef = col(/REF|OP|PEDIDO|ORDEN|DESCR|ETIQ/), iId = col(/^ID$|ART/), iA = col(/ANCH|^W$|WIDTH|DIM.?X|LARGO|^X$/), iB = col(/ALT|^H$|HEIGHT|DIM.?Y|^Y$/), iC = col(/CANT|QTY|CNT|PZ|PIEZ/);
  const datos = tieneHead ? rows.slice(1) : rows;
  const porId = new Map(A.piezas.map(p => [p.id, p]));
  const etq = [], sin = [], usado = new Map(); let dudosas = 0;
  for(const r of datos){
    const txtR = r.join(' ');
    let p = null;
    const mid = txtR.toUpperCase().match(/ART[:\-]?(\d+)/); if(mid) p = porId.get(+mid[1]);
    const nums = r.map(x => /^\d{2,5}([.,]\d+)?$/.test(x) ? Math.round(pdfNum(x)) : null);
    const a = iA >= 0 ? Math.round(pdfNum(r[iA])) : null, b = iB >= 0 ? Math.round(pdfNum(r[iB])) : null;
    let med = a && b ? [a, b] : nums.filter(x => x && x >= 100).slice(0, 2);
    const cant = iC >= 0 ? (parseInt(r[iC]) || 1) : 1;
    const ref = (iRef >= 0 ? r[iRef] : txtR).toUpperCase().match(/\d{3,6}-\d+/);
    if(!p && med.length === 2){
      const cerca = (x, y) => Math.abs(x - y) <= 2;
      // El plan trae la medida de corte (en templado, +4 mm); se acepta también la medida de la OP
      const okMed = (q, a, b) => { const c = artCorte(q); return (cerca(c.ancho, a) && cerca(c.alto, b)) || (cerca(q.ancho, a) && cerca(q.alto, b)); };
      const cand = A.piezas.filter(q => (!ref || q.op === ref[0]) && (okMed(q, med[0], med[1]) || okMed(q, med[1], med[0])));
      p = cand.find(q => (usado.get(q.id) || 0) < q.cant) || cand[0] || null;
      if(p && !okMed(p, med[0], med[1])) dudosas++;
    }
    if(!p){ sin.push((ref ? ref[0] + ' ' : '') + (med.length === 2 ? med.join('×') : txtR.slice(0, 30))); continue; }
    for(let k = 0; k < cant; k++){ const n = (usado.get(p.id) || 0) + 1; usado.set(p.id, n); etq.push({p, n}); }
  }
  A.plan = {nombre: f.name, etq, sin, dudosas};
  // Guardar el orden de corte (primera aparición de cada pieza)
  const orden = []; const vis = new Set(); etq.forEach((e, i) => { if(!vis.has(e.p.id)){ vis.add(e.p.id); orden.push({id: e.p.id, orden: i + 1}); } });
  try{ if(orden.length) await API.artOrdenCorte(orden, f.name); orden.forEach(o => { const p = porId.get(o.id); if(p){ p.orden_corte = o.orden; p.lote_corte = f.name; } }); }catch(e){ toast(artFaltaSQL(e), true); }
  renderArtica();
}
// 4. Etiquetas 85 × 60 mm: una por pieza
async function artEtqPDF(lista, nombre){
  try{ if(!window.jspdf) await loadScript('lib/jspdf.js'); if(!window.qrcode) await loadScript('lib/qrcode.js'); }catch(e){ return toast(errMsg(e), true); }
  const W = 85, H = 60, doc = new jspdf.jsPDF({unit:'mm', format:[W, H], orientation:'landscape'});
  // Símbolo de Ártica (manual de identidad) en negro para la etiqueta
  let simb = null;
  try{ const r = await fetch('icons/artica_simbolo_negro.png'); const bl = await r.blob(); simb = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(bl); }); }catch(e){ simb = null; }
  const logoEli = lista.some(e => !e.p.tercero) ? await etqLogo() : null;   // vidrio de OP de Elíptica: logo de Elíptica
  const corta = (t, max, size) => { doc.setFontSize(size); t = String(t || ''); while(t && doc.getTextWidth(t) > max) t = t.slice(0, -1); return t; };
  lista.forEach(({p, n}, i) => {
    if(i) doc.addPage([W, H], 'landscape');
    const q = qrcode(0, 'M'); q.addData(artCod(p) + '-' + n); q.make();   // el QR lleva el número de la pieza (ART:123-5)
    const S_ = 30, nm = q.getModuleCount(), cs = S_ / nm, qx = W - S_ - 4, qy = 4;
    doc.setFillColor(0, 0, 0); for(let r = 0; r < nm; r++) for(let c = 0; c < nm; c++) if(q.isDark(r, c)) doc.rect(qx + c * cs, qy + r * cs, cs + .02, cs + .02, 'F');
    doc.setTextColor(0);
    if(!p.tercero && logoEli){ const h = 5.6, w = Math.min(40, h * logoEli.r); doc.addImage(logoEli.url, 'PNG', 4, 2.4, w, w / logoEli.r); }
    else if(!p.tercero){ doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.text('ELÍPTICA', 4, 7); }
    else if(simb){ doc.addImage(simb, 'PNG', 4, 2.2, 8.2, 6); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.text('Á R T I C A', 13.6, 7); }
    else { doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.text('ÁRTICA', 4, 7); }
    doc.setFont('helvetica', 'bold');
    if(p.optima_pos){   // posición de OPTIMA (la del plano de corte) en grande, con el lote
      doc.setFillColor(0, 0, 0); doc.rect(4, 9, 18, 12.6, 'F'); doc.setTextColor(255);
      doc.setFontSize(String(p.optima_pos).length > 2 ? 16 : 21); doc.text(String(p.optima_pos), 13, 18.4, {align: 'center'});
      doc.setTextColor(0); doc.setFontSize(16); doc.text(corta(p.op, qx - 26, 16), 24, 18.2);
    } else { doc.setFontSize(22); doc.text(corta(p.op, qx - 6, 22), 4, 17); }
    doc.setFontSize(17); doc.text(`${p.ancho} × ${p.alto}`, 4, 27);
    // Canto (pulido, fileteado, canto a canto…) en negrilla debajo de la medida
    doc.setFontSize(8.5); doc.text(corta(artCanto(p), qx - 6, 8.5), 4, 32.2);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.text(corta(p.tipo, qx - 6, 7.5), 4, 36.6);
    doc.text(corta([p.item, p.obra || p.cliente].filter(Boolean).join(' · '), W - 8, 7.5), 4, 40.8);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text(`${n}/${p.cant}`, qx + S_ / 2, qy + S_ + 4.5, {align: 'center'});
    // Ruta: casillas para marcar a mano si hace falta
    let x = 4; for(const e of p.ruta){ doc.setLineWidth(.3); doc.rect(x, 44, 9, 9); doc.setFontSize(10); doc.text(ART_AB[e], x + 4.5, 50.2, {align: 'center'}); x += 10.5; }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5);
    doc.text(corta([p.forrado ? 'FORRAR' : '', p.obs || ''].filter(Boolean).join(' · '), W - 28, 6.5), 4, 57.5);
    doc.text(artCod(p) + '-' + n, W - 4, 57.5, {align: 'right'});
  });
  const blob = doc.output('blob'), url = URL.createObjectURL(blob), file = new File([blob], nombre, {type: 'application/pdf'});
  const puede = !!(navigator.canShare && navigator.canShare({files:[file]})); window._artEtq = {file, nombre};
  openSheet('Etiquetas Ártica', `${fmtN(lista.length)} etiqueta${lista.length === 1 ? '' : 's'} · 85 × 60 mm`, `<div class="summary">Imprime a <b>tamaño real (100 %)</b> en la TSC TTP-247 con el rollo de 85 × 60 mm.</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${puede ? `<button class="btn primary" onclick="navigator.share({files:[_artEtq.file], title:_artEtq.nombre}).catch(()=>{})">Compartir / Imprimir</button>` : ''}
      <a class="btn ${puede ? '' : 'primary'}" href="${url}" target="_blank" rel="noopener" style="text-decoration:none;justify-content:center">Abrir PDF para imprimir</a>
      <a class="btn" href="${url}" download="${esc(nombre)}" style="text-decoration:none;justify-content:center">${ICON.down} Descargar PDF</a></div>`, 'Listo', async () => {});
}

async function cargarFaltantes(obra){ try{ S.falt = await API.faltantes(obra); }catch(e){ S.falt = null; } }
const PERF = new Map();   // OP → perfiles HSP leídos de la orden PDF
async function perfilesDeOp(op){
  if(PERF.has(op)) return PERF.get(op);
  const num = String(op).split('-')[0];
  try{
    await qrLibsPDF();
    const b = await API.ordenBajar(num);
    const r = await leerOPsPDF(new Uint8Array(await b.arrayBuffer()), num + '.pdf');
    for(const o of r.ops){
      const m = new Map(); for(const x of (o.perfiles || [])){ const k = x.ref + '|' + (x.medida || ''); if(!m.has(k)) m.set(k, x); }
      PERF.set(o.op, [...m.values()].sort((a, b) => nat(a.ref, b.ref) || (a.medida || 0) - (b.medida || 0)));
    }
  }catch(e){ console.warn('perfiles', e); }
  if(!PERF.has(op)) PERF.set(op, []);
  return PERF.get(op);
}
async function faltanteSheet(rows){

  const resto = porOp.slice(1).flatMap(x => x[1]);
  const sub = l.map(i => i.op_instalacion).filter(Boolean);
  openSheet('Corte parcial · ¿qué material faltó?', `OP ${esc(op)}${sub.length ? ' · ' + esc(sub.length > 6 ? sub.length + ' sub-OP' : sub.join(', ')) : ''}`,
    `<div id="faltBody"><div class="loading"><div class="spin"></div>Leyendo los perfiles de la orden ${esc(op)}…</div></div>`, 'Registrar faltante', async () => {
      // La cantidad es la que realmente faltó (no la de la OP)
      const sel = [], cantDe = id => { const v = parseFloat(String(($('#' + id) || {}).value || '').replace(',', '.')); return isFinite(v) && v > 0 ? v : null; };
      for(const c of document.querySelectorAll('.faltCk:checked')){ const k = +c.value, x = window._perf[k], n = cantDe('faltN' + k);
        if(n == null){ toast(`Escribe cuántas faltaron de ${x.ref}`, true); const i = $('#faltN' + k); if(i) i.focus(); return false; }
        sel.push({...x, cant: n}); }

      if(otro){ const n = cantDe('faltOtroN'); if(n == null){ toast('Escribe cuántas faltaron de ' + otro, true); return false; } sel.push({ref: otro, desc: null, cant: n, medida: null}); }
      if(!sel.length){ toast('Elige el perfil que faltó (o toca "No faltó material")', true); return false; }
      const nota = (($('#faltNota') || {}).value || '').trim() || null;
      // Solo quedan en corte parcial las unidades a las que no les alcanzó el perfil; las demás quedan cortadas (X)
      const {afect, ok} = faltCalc(l, sel);
      try{
        if(ok.length){ const rs = await API.update(ok.map(i => i.id), {cortado: 'X'}); if(typeof mergeRows === 'function') mergeRows(rs); }
        const subA = afect.map(i => i.op_instalacion).filter(Boolean);
        const nuevos = await API.faltanteCrear(sel.map(x => ({obra: l[0].obra, op, item_ids: afect.map(i => i.id), op_inst: subA, proceso: 'corte', ref: x.ref, descripcion: x.desc, cant: x.cant, medida: x.medida, nota, quien: (S.perfil && S.perfil.nombre) || null})));
        if(S.falt && S.obra === l[0].obra) S.falt = nuevos.concat(S.falt);
        toast(`✓ Faltante ${sel.map(x => x.ref).join(', ')} · parcial (+): ${subA.join(', ')}${ok.length ? ' · cortadas (X): ' + ok.length : ''}`);

      }catch(e){ toast(/faltantes|42P01|PGRST205/.test(errMsg(e) + (e.code || '')) ? 'Falta activar los faltantes en la base (SQL 68)' : errMsg(e), true); return false; }

    });

// Unidades afectadas: lo que faltó ÷ lo que lleva cada unidad (perfil de la OP ÷ unidades de la OP); las últimas sub-OP quedan en +
function faltCalc(l, sel){
  const N = Math.max(1, window._faltNU || l.length);
  let k = 0;
  for(const x of sel){ const op = (window._perf || []).find(p => p.ref === x.ref && p.medida === x.medida), porU = op && op.cant ? op.cant / N : 1;
    k = Math.max(k, Math.ceil((x.cant || 0) / porU - 1e-9)); }
  k = Math.min(l.length, Math.max(sel.length ? 1 : 0, k));
  return {afect: l.slice(l.length - k), ok: l.slice(0, l.length - k), N};
}
function faltPintar(){
  const box = $('#faltRes'), l = window._faltL; if(!box || !l) return;
  const v = id => { const n = parseFloat(String(($('#' + id) || {}).value || '').replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; };
  const sel = [...document.querySelectorAll('.faltCk:checked')].map(c => ({...window._perf[+c.value], cant: v('faltN' + c.value)})).filter(x => x.cant);
  const o = ($('#faltOtro') || {}).value; if(o && v('faltOtroN')) sel.push({ref: o.trim().toUpperCase(), cant: v('faltOtroN')});
  if(!sel.length){ box.innerHTML = `Marca el perfil y la cantidad que faltó. Se escanearon <b>${fmtN(l.length)}</b> unidad${l.length === 1 ? '' : 'es'}.`; return; }
  const {afect, ok} = faltCalc(l, sel);
  box.innerHTML = `Quedan en <b>corte parcial (+)</b> por el faltante: <b>${esc(afect.map(i => i.op_instalacion).join(', '))}</b>${ok.length ? `<br>Quedan <b>cortadas (X)</b>: ${esc(ok.map(i => i.op_instalacion).join(', '))}` : ''}`;
}

// ── Avisos al celular (web push, solo gerente) ──
const VAPID_PUB = 'BIs30XQvC_QlybChrV8iLMrTKXXveez0hBV8lBhw-lyIVGw6hj2RNbd6NVyTfQp3mDKULsFxYdJyB_pGlqj1XgA';
function b64uBytes(b){ b = b.replace(/-/g,'+').replace(/_/g,'/'); const r = atob(b + '='.repeat((4 - b.length % 4) % 4)); return Uint8Array.from(r, c => c.charCodeAt(0)); }
async function avisos(){
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
    return alert(ios && !instalada
      ? 'En iPhone/iPad los avisos solo funcionan con la app anclada al inicio.\n\nToca Compartir → "Agregar a inicio", abre la app desde ese ícono y vuelve a tocar 🔔.'
      : 'Este navegador no permite avisos. En iPhone/iPad actualiza a iOS 16.4 o superior y abre la app desde el ícono de inicio.');
  }
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      if(confirm('Los avisos ya están activos en este dispositivo.\n\nAceptar = dejar de recibirlos aquí\nCancelar = seguir recibiéndolos')){
        await API.pushQuitar(sub.endpoint).catch(() => {}); await sub.unsubscribe(); toast('Avisos desactivados en este dispositivo');
      } else { await API.pushGuardar(sub); toast('✓ Avisos activos'); }
      return;
    }
    const per = await Notification.requestPermission();
    if(per !== 'granted') return alert('No diste permiso de notificaciones. Actívalo en Ajustes → Notificaciones → Elíptica (o Registro de producción) y vuelve a tocar 🔔.');
    const nueva = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uBytes(VAPID_PUB)});
    await API.pushGuardar(nueva);
    toast(isGerente() ? '✓ Avisos activados: te llegará cada cambio que hagan los demás usuarios' : '✓ Avisos activados: te llegarán al celular las órdenes de despacho, programaciones y líneas de ensamble del director');
  }catch(e){
    toast(/push_subs|schema cache|PGRST/i.test(errMsg(e)) ? 'Falta correr el SQL 50 en Supabase' : 'No se pudieron activar: ' + errMsg(e), true);
  }
}

async function loadActivos(){
  const [a, e, c] = await Promise.all([API.activos(), API.porEntregar(), API.cerradas().catch(() => [])]);
  S.cerradas = new Map(c.map(x => [x.obra, x]));
  // Las obras entregadas (contrato cerrado) no cuentan como pendientes
  S.activos = a.filter(i => !S.cerradas.has(i.obra)); S.porEnt = e.filter(i => !S.cerradas.has(i.obra));
}
async function marcarEntregada(obra, cerrar){
  if(!isGerente()) return;
  if(!confirm(cerrar ? `¿Marcar ${obra} como ENTREGADA (contrato cerrado)?\n\nDeja de aparecer en Obras activas, Planta y Por entregar. Los ítems no cambian y se puede reabrir.` : `¿Reabrir ${obra}? Vuelve a aparecer con sus pendientes.`)) return;
  try{ cerrar ? await API.cerrarObra(obra) : await API.reabrirObra(obra); }
  catch(e){ return toast(/obras_cerradas|42P01|PGRST205/.test(errMsg(e) + (e.code || '')) ? 'Falta activar esta opción en la base (SQL 33)' : errMsg(e), true); }
  await loadActivos(); toast(cerrar ? '✓ ' + obra + ' marcada como entregada' : '✓ ' + obra + ' reabierta');
  if(S.view === 'obra') renderObra(); else renderHome();
}

function resumenObras(){
  const m = new Map();
  for(const it of S.activos){
    let o = m.get(it.obra);
    if(!o){ o = {obra:it.obra, n:0, 'EN COLA':0, 'PRODUCCIÓN':0, 'ENSAMBLADO':0, 'DESPACHADO':0, porDesp:0, porInst:0}; m.set(it.obra,o); }
    o.n++;
    const st = it.despachado ? 'DESPACHADO' : (it.status||'EN COLA');
    o[st] = (o[st]||0)+1;
    if(!it.despachado) o.porDesp++;
    if(!it.instalado) o.porInst++;
  }
  // Por entregar: solo de las obras activas (las ya cerradas no aparecen aquí)
  for(const it of (S.porEnt || [])){ const o = m.get(it.obra); if(o) o.porEnt = (o.porEnt || 0) + 1; }
  return [...m.values()].sort((a,b) => nat(a.obra,b.obra));
}

// Resumen por año (de la FECHA OP) de TODA la base
function indiceAnual(){
  if(S.anualIdx) return S.anualIdx;
  const byYear = new Map(), obraYears = new Map();
  for(const it of S.anual){
    const y = yearOf(it);
    if(!obraYears.has(it.obra)) obraYears.set(it.obra, new Set());
    obraYears.get(it.obra).add(y);
    if(!byYear.has(y)) byYear.set(y, new Map());
    const m = byYear.get(y);
    let o = m.get(it.obra);
    if(!o){ o = {obra:it.obra, n:0, cola:0, planta:0, desp:0, inst:0}; m.set(it.obra, o); }
    o.n++;
    if(it.instalado) o.inst++;
    else if(it.despachado) o.desp++;
    else if((it.status||'EN COLA') === 'EN COLA') o.cola++;
    else o.planta++;
  }
  const years = [...byYear.keys()].sort((a,b) => a==='S/F' ? 1 : b==='S/F' ? -1 : b.localeCompare(a))
    .map(y => ({y, n:[...byYear.get(y).values()].reduce((a,o)=>a+o.n,0), obras:byYear.get(y).size}));
  return S.anualIdx = {years, byYear, obraYears};
}

  S.view = 'home'; S.obra = null; S.sel.clear(); S.detailId = null; S.draft = null;

  if(!replace) history.pushState({v:'home'}, '');
  renderHome();
}

  if(S.homeTab === 'planta') return renderPlanta();

  const sub = anual

    : `${res.length} obras · ${fmtN(tot.c)} en cola · ${fmtN(tot.p)} en ensamble · ${fmtN(tot.en)} ensamblados por despachar · ${fmtN(tot.ds)} despachados por instalar · ${fmtN(tot.e)} instalados por entregar · ${liveHTML()}`;
  const legend = anual
    ? [['var(--cola)','En cola'],['var(--ens)','En planta'],['var(--desp)','Despachado sin instalar'],['var(--inst)','Instalado']]
    : ['EN COLA','PRODUCCIÓN','ENSAMBLADO','DESPACHADO'].map(k => [STAGES[k].c, k==='DESPACHADO' ? 'Despachado sin instalar' : STAGES[k].t]);
  $('#app').innerHTML = shell(`${respaldoHTML()}
    <div class="tabs">${homeTabs()}
    </div>
    <div class="home-head">
      <div><div class="h1">${anual ? 'Obras por año' : 'Obras activas'}</div><div class="h1-sub">${sub}</div>${puedeRegistrar() && !anual ? `<button class="btn sm ghost" style="margin-top:8px" onclick="odLista()">Órdenes de despacho pendientes</button>` : ''}</div>
      <div class="search">${ICON.search}<input id="qObra" placeholder="Buscar obra u OP (6251-7)…" value="${esc(S.q)}" autocomplete="off" autocapitalize="characters"></div>
    </div>
    <div id="yearChips"></div>
    <div class="legend">${legend.map(([c,t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>
    <div id="obrasBox"></div>`);
  const inp = $('#qObra');
  inp.oninput = () => { S.q = inp.value; anual ? renderAnualBox() : renderObrasBox(resumenObras()); };
  if(anual) loadAnual(); else renderObrasBox(res);
}

      ${registraCobros() ? `<button class="tab ${t==='cobros'?'on':''}" onclick="setHomeTab('cobros')">Cobros</button>` : ''}`;
}
function refreshHomeBox(){
  S.plCache = null;
  if(S.homeTab === 'anio') renderAnualBox();
  else if(S.homeTab === 'planta') renderPlantaBox();
  else if(S.homeTab === 'procesos') renderProcesosBox();
  else if(S.homeTab === 'prog') renderProgBox(true);
  else if(S.homeTab === 'cobros') renderCobrosBox();
  else renderObrasBox(resumenObras());
}
const PL_ST = [
  ['EN COLA',    'En cola',          'Sin ensamblador asignado'],
  ['PRODUCCIÓN', 'En ensamble',      'Con ensamblador, sin terminar'],
  ['ENSAMBLADO', 'Ensamblado',       'Terminado, por despachar'],
  ['DESPACHADO', 'Por instalar',     'Despachado sin instalar'],
  ['ENTREGAR',   'Por entregar',     'Instalado sin acta de entrega'],
  ['INSTALADO',  'Instalado',        'Instalado en el periodo']
];
// Periodos para ver lo ensamblado / instalado por fecha
const PERIODOS = [['hoy','Hoy'],['ayer','Ayer'],['7d','Últimos 7 días'],['mes','Este mes'],['rango','Elegir fechas']];
const addDays = (f, n) => { const d = new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
function rangoPer(){
  const p = S.plPer || (S.plPer = {k:'hoy'}), t = today();
  if(p.k === 'ayer') return [addDays(t,-1), addDays(t,-1)];
  if(p.k === '7d') return [addDays(t,-6), t];
  if(p.k === 'mes') return [t.slice(0,8)+'01', t];
  if(p.k === 'rango'){ const a = p.d1 || t, b = p.d2 || a; return a <= b ? [a,b] : [b,a]; }
  return [t, t];
}
function perLabel(){ const [a,b] = rangoPer(); const k = S.plPer.k;
  return k==='hoy' ? 'hoy' : k==='ayer' ? 'ayer' : a===b ? 'el '+fmtD(a) : `del ${fmtD(a)} al ${fmtD(b)}`; }
const perRefresh = () => S.homeTab === 'procesos' ? renderProcesosBox() : renderPlantaBox();
function setPer(k){ S.plPer = {...(S.plPer||{}), k}; if(k==='rango' && !S.plPer.d1){ S.plPer.d1 = addDays(today(),-6); S.plPer.d2 = today(); } perRefresh(); }
function setPerFecha(i, v){ if(!v) return; S.plPer['d'+i] = v; perRefresh(); }
function setEnsModo(m){ S.plEnsModo = m; renderPlantaBox(); }
// Consulta por fecha (todas las obras, incluidas las terminadas); se guarda hasta el próximo cambio
async function plFecha(campo){
  const [a,b] = rangoPer(), key = campo+'|'+a+'|'+b;
  S.plCache = S.plCache || {};
  if(S.plCache[key]) return S.plCache[key].rows || null;
  S.plCache[key] = {loading:true};
  try{ S.plCache[key].rows = await API.porFecha(campo, a, b); }
  catch(e){ delete S.plCache[key]; toast('Error: '+errMsg(e), true); return null; }
  if(S.view === 'home' && S.homeTab === 'planta') renderPlantaBox();
  return null;
}
const plFechaYa = campo => { const [a,b] = rangoPer(); const c = S.plCache && S.plCache[campo+'|'+a+'|'+b]; return c && c.rows; };
function perBar(){
  const p = S.plPer;
  return `<div class="chips" style="margin:0 0 12px">${PERIODOS.map(([k,t]) => `<button class="chip ${p.k===k?'on':''}" onclick="setPer('${k}')">${t}</button>`).join('')}</div>
    ${p.k==='rango' ? `<div class="per-rango"><label><span class="lbl">Desde</span><input type="date" value="${p.d1||''}" max="${today()}" onchange="setPerFecha(1,this.value)"></label>
      <label><span class="lbl">Hasta</span><input type="date" value="${p.d2||''}" max="${today()}" onchange="setPerFecha(2,this.value)"></label></div>` : ''}`;
}
const plStage = it => it.despachado ? (it.instalado ? null : 'DESPACHADO') : (it.status || 'EN COLA');
const diasDesde = f => { if(!f) return null; const d = Math.floor((Date.parse(today()) - Date.parse(f)) / 864e5); return isNaN(d) ? null : d; };
const diasTxt = d => d == null ? '' : d <= 0 ? 'hoy' : d === 1 ? 'hace 1 día' : `hace ${fmtN(d)} días`;

function renderPlanta(){
  if(!S.plSt) S.plSt = 'PRODUCCIÓN';
  $('#app').innerHTML = shell(`${respaldoHTML()}
    <div class="tabs">${homeTabs()}</div>
    <div class="home-head">
      <div><div class="h1">Planta</div><div class="h1-sub">Todas las obras · toca un estado para ver el detalle · ${liveHTML()}</div>${puedeRegistrar() ? `<button class="btn sm ghost" style="margin-top:8px" onclick="odLista()">Órdenes de despacho pendientes</button>` : ''}</div>
      <div class="search">${ICON.search}<input id="qObra" placeholder="Buscar obra, OP, ensamblador o instalador…" value="${esc(S.q)}" autocomplete="off" autocapitalize="characters"></div>
    </div>
    <div class="st-tiles" id="stTiles"></div>
    <div id="obrasBox"></div>`);
  const inp = $('#qObra');
  inp.oninput = () => { S.q = inp.value; renderPlantaBox(); };
  renderPlantaBox();
}
function setPlSt(k){ S.plSt = k; renderPlantaBox(); }

function renderPlantaBox(){
  if(!S.plPer) S.plPer = {k:'hoy'};
  const by = {}; for(const [k] of PL_ST) by[k] = [];
  for(const it of S.activos){ const k = plStage(it); if(k && by[k]) by[k].push(it); }
  by['ENTREGAR'] = (S.porEnt || []).slice();
  const inst = plFechaYa('fecha_instalacion');
  if(!inst) plFecha('fecha_instalacion');
  const ensP = S.plEnsModo !== 'pend' ? plFechaYa('dia_final') : null;
  if(S.plEnsModo !== 'pend' && !ensP) plFecha('dia_final');
  const tiles = $('#stTiles');
  if(tiles) tiles.innerHTML = PL_ST.map(([k,t,d]) => {
    const l = k === 'INSTALADO' ? inst : k === 'ENSAMBLADO' && S.plEnsModo !== 'pend' ? ensP : by[k];
    const sub = !l ? 'Cargando…' : `${fmtN(new Set(l.map(i=>i.obra)).size)} obra${new Set(l.map(i=>i.obra)).size===1?'':'s'} · ${fmtN(l.reduce((a,i)=>a+(Number(i.m2)||0),0),1)} m²`;
    return `<button class="st-tile ${S.plSt===k?'on':''}" style="--c:${STAGES[k].c}" onclick="setPlSt('${k}')">
      <span class="t">${t}${k==='INSTALADO' || (k==='ENSAMBLADO' && S.plEnsModo !== 'pend') ? ' · '+perLabel() : ''}</span><b>${l ? fmtN(l.length) : '—'}</b><span>${sub}</span></button>`;
  }).join('');
  const box = $('#obrasBox'); if(!box) return;
  const q = S.q.trim().toUpperCase();
  const okQ = it => !q || [it.obra, it.op, it.ensamblador, it.instalador, it.remision].some(v => v && String(v).toUpperCase().includes(q));
  const desc = PL_ST.find(x => x[0]===S.plSt);
  let h = '';
  // Ensamblado e Instalado: por fecha
  const ensFecha = S.plSt === 'ENSAMBLADO' && S.plEnsModo !== 'pend';   // por defecto, por fecha (igual que Instalado)
  if(S.plSt === 'ENSAMBLADO') h += `<div class="seg-modo"><button class="${ensFecha?'on':''}" onclick="setEnsModo('fecha')">Ensamblado por fecha</button><button class="${ensFecha?'':'on'}" onclick="setEnsModo('pend')">Por despachar</button></div>`;
  if(ensFecha || S.plSt === 'INSTALADO'){
    const campo = ensFecha ? 'dia_final' : 'fecha_instalacion';
    h += perBar();
    const rows = plFechaYa(campo);
    if(!rows){ plFecha(campo); box.innerHTML = h + '<div class="loading"><div class="spin"></div>Buscando</div>'; return; }
    const list = rows.filter(okQ);
    const m2 = list.reduce((a,i)=>a+(Number(i.m2)||0),0);
    h += `<div class="section-t">${ensFecha ? 'Ensamblado' : 'Instalado'} ${perLabel()} · ${fmtN(list.length)} ítem${list.length===1?'':'s'} · ${fmtN(m2,1)} m²</div>`;
    if(!list.length){ box.innerHTML = h + `<div class="empty">No hay ítems ${ensFecha?'ensamblados':'instalados'} ${perLabel()}${q ? ' que coincidan con “'+esc(S.q)+'”' : ''}.</div>`; return; }
    box.innerHTML = h + plPorPersona(list, ensFecha ? 'ensamblador' : 'instalador', campo);
    return;
  }
  const list = by[S.plSt].filter(okQ);
  h += `<div class="section-t">${desc[1]} · ${desc[2]}</div>`;
  if(!list.length){ box.innerHTML = h + `<div class="empty">No hay ítems${q ? ' que coincidan con “'+esc(S.q)+'”' : ''} en este estado.</div>`; return; }
  h += S.plSt === 'PRODUCCIÓN' ? plPorEnsamblador(list) : plPorObra(list, S.plSt);
  box.innerHTML = h;
}

// Lo ensamblado / instalado en el periodo, agrupado por persona → obra · OP
function plPorPersona(list, quien, campo){
  const [a,b] = rangoPer(), varios = a !== b;
  const g = [...grp(list, it => (it[quien]||'').trim()).entries()].sort((x,y) => (x[0]==='') - (y[0]==='') || y[1].length - x[1].length || nat(x[0], y[0]));
  const lbl = (quien==='ensamblador' ? 'Ensamblado ' : 'Instalado ') + perLabel();
  return `<div class="pl-grid">${g.map(([per, items]) => {
    const filas = [...grp(items, it => it.obra + '\u0001' + (it.op||'')).values()]
      .map(l => ({obra:l[0].obra, op:l[0].op, n:l.length, m2:l.reduce((s,i)=>s+(Number(i.m2)||0),0), f1:minF(l,campo), f2:maxF(l,campo), rem:[...new Set(l.map(i=>i.remision).filter(Boolean))]}))
      .sort((x,y) => nat(y.f2, x.f2) || nat(x.obra,y.obra) || nat(x.op,y.op));
    const m2 = items.reduce((s,i)=>s+(Number(i.m2)||0),0);
    return `<div class="pl-card">
      <div class="pl-head"><span class="n ${per?'':'sin'}">${per ? esc(per) : 'Sin '+quien}</span>
        <span class="m"><b>${fmtN(items.length)}</b> ítem${items.length===1?'':'s'} · ${fmtN(m2,1)} m²</span></div>
      ${filas.map(f => `<button class="pl-row" onclick="${plGoF(f.obra, f.op, per, campo, a, b, lbl)}">
        <span class="o">${esc(f.obra)} · <em>OP ${esc(f.op||'—')}</em></span><span class="k">${fmtN(f.n)}</span>
        <span class="d">${fmtN(f.m2,1)} m²${varios ? ' · '+(f.f1===f.f2 ? fmtD(f.f1) : fmtD(f.f1)+' – '+fmtD(f.f2)) : ''}${quien==='instalador' && f.rem.length ? ' · Rem. '+esc(f.rem.slice(0,3).join(', '))+(f.rem.length>3?'…':'') : ''}</span></button>`).join('')}
    </div>`; }).join('')}</div>`;
}
const plGoF = (obra, op, q, campo, d1, d2, label) => `openObra(decodeURIComponent('${encQ(obra)}'), false, '', {estado:'TODOS', op:decodeURIComponent('${encQ(op)}'), q:decodeURIComponent('${encQ(q)}'), rng:{campo:'${campo}', d1:'${d1}', d2:'${d2}', label:decodeURIComponent('${encQ(label)}')}})`;

// Agrupa por clave → Map
function grp(list, fk){ const m = new Map(); for(const it of list){ const k = fk(it); if(!m.has(k)) m.set(k, []); m.get(k).push(it); } return m; }
const minF = (l, k) => l.reduce((a,i) => i[k] && (!a || i[k] < a) ? i[k] : a, null);
const maxF = (l, k) => l.reduce((a,i) => i[k] && (!a || i[k] > a) ? i[k] : a, null);
const hora12 = h => { const [H,M] = String(h).split(':').map(Number); return `${H%12||12}:${pad(M||0)} ${H<12?'a. m.':'p. m.'}`; };
const encQ = v => encodeURIComponent(v||'').replace(/'/g,'%27');
const plGo = (obra, estado, op, q) => `openObra(decodeURIComponent('${encQ(obra)}'), false, '', {estado:'${estado}', op:decodeURIComponent('${encQ(op)}'), q:decodeURIComponent('${encQ(q)}')})`;

function plPorEnsamblador(list){
  const g = [...grp(list, it => (it.ensamblador||'').trim()).entries()]
    .sort((a,b) => (a[0]==='') - (b[0]==='') || nat(a[0], b[0]));
  return `<div class="pl-grid">${g.map(([ens, items]) => {
    const filas = [...grp(items, it => it.obra + '\u0001' + (it.op||'')).values()]
      .map(l => { const p = l.filter(i => i.dia_inicio).sort((a,b) => (a.dia_inicio + (a.hora_inicio||'99')).localeCompare(b.dia_inicio + (b.hora_inicio||'99')))[0]; return {obra:l[0].obra, op:l[0].op, n:l.length, desde:p ? p.dia_inicio : null, hora:p && p.hora_inicio ? hora12(p.hora_inicio) : ''}; })
      .sort((a,b) => nat(a.desde||'9999', b.desde||'9999') || nat(a.obra,b.obra) || nat(a.op,b.op));
    const nob = new Set(items.map(i=>i.obra)).size;
    return `<div class="pl-card">
      <div class="pl-head"><span class="n ${ens?'':'sin'}">${ens ? esc(ens) : 'Sin ensamblador'}</span>
        <span class="m"><b>${fmtN(items.length)}</b> ítem${items.length===1?'':'s'} · ${fmtN(nob)} obra${nob===1?'':'s'}</span></div>
      ${filas.map(f => { const d = diasDesde(f.desde); return `<button class="pl-row" onclick="${plGo(f.obra,'PRODUCCIÓN',f.op,ens)}">
        <span class="o">${esc(f.obra)} · <em>OP ${esc(f.op||'—')}</em></span><span class="k">${fmtN(f.n)}</span>
        <span class="d">${f.desde ? `Inició ${fmtD(f.desde)}${f.hora ? ' a las ' + f.hora : ''} · <span class="${d>7?'old':''}">${diasTxt(d)}</span>` : 'Sin fecha de inicio'}</span></button>`; }).join('')}
    </div>`; }).join('')}</div>`;
}

function plPorObra(list, st){
  const campo = st === 'EN COLA' ? ['fecha_op','OP del','min'] : st === 'ENSAMBLADO' ? ['dia_final','Último terminado','max'] : st === 'ENTREGAR' ? ['fecha_instalacion','Última instalación','max'] : ['fecha_despacho','Último despacho','max'];
  const g = [...grp(list, it => it.obra).entries()].sort((a,b) => nat(a[0], b[0]));
  return `<div class="pl-grid">${g.map(([obra, items]) => {
    const filas = [...grp(items, it => it.op||'').values()]
      .map(l => ({op:l[0].op, n:l.length, m2:l.reduce((a,i)=>a+(Number(i.m2)||0),0), f: campo[2]==='min' ? minF(l,campo[0]) : maxF(l,campo[0]), ens:[...new Set(l.map(i=>i.ensamblador).filter(Boolean))]}))
      .sort((a,b) => nat(a.op, b.op));
    const m2 = items.reduce((a,i)=>a+(Number(i.m2)||0),0);
    return `<div class="pl-card">
      <div class="pl-head"><span class="n">${esc(obra)}</span><span class="m"><b>${fmtN(items.length)}</b> ítems · ${fmtN(m2,1)} m²</span></div>
      ${st === 'ENTREGAR' && isGerente() ? `<div style="padding:0 14px 8px"><button class="btn sm ghost" onclick="marcarEntregada(decodeURIComponent('${encQ(obra)}'), true)">Marcar obra entregada</button></div>` : ''}
      ${filas.map(f => { const d = diasDesde(f.f); return `<button class="pl-row" onclick="${plGo(obra,st,f.op,'')}">
        <span class="o"><em>OP ${esc(f.op||'—')}</em>${st==='ENSAMBLADO' && f.ens.length ? ' · '+esc(f.ens.join(', ')) : ''}</span><span class="k">${fmtN(f.n)}</span>
        <span class="d">${fmtN(f.m2,1)} m²${f.f ? ` · ${campo[1]} ${fmtD(f.f)} · <span class="${st==='EN COLA'&&d>30 || st!=='EN COLA'&&d>7 ?'old':''}">${diasTxt(d)}</span>` : ''}</span></button>`; }).join('')}
    </div>`; }).join('')}</div>`;
}

// ════════════════════════════════════════════════════════════════
//  COBROS — pendiente por cobrar de despacho e instalación (todas las obras)
// ════════════════════════════════════════════════════════════════
function renderCobros(){
  if(!S.cobTipo) S.cobTipo = 'D';
  $('#app').innerHTML = shell(`${respaldoHTML()}
    <div class="tabs">${homeTabs()}</div>
    <div class="home-head">
      <div><div class="h1" id="cobH1">Por cobrar</div><div class="h1-sub"><span id="cobSub">Todas las obras · lo despachado o instalado que aún no se ha cobrado</span> · ${liveHTML()}</div></div>
      <div class="search">${ICON.search}<input id="qObra" placeholder="Buscar obra, OP o remisión…" value="${esc(S.q)}" autocomplete="off" autocapitalize="characters"></div>
    </div>
    <div class="seg-modo" id="cobSeg"></div>
    <div class="st-tiles cob-tiles" id="stTiles"></div>
    <div id="obrasBox"></div>`);
  const inp = $('#qObra');
  inp.oninput = () => { S.q = inp.value; renderCobrosBox(); };
  renderCobrosBox();
}
// Marcas (chulos) de OP durante un corte: se guardan en este equipo hasta registrar el cobro
// Al chulear una OP se guarda la lista EXACTA de ítems pendientes en ese momento.
// Lo que se registre después (p. ej. una instalación nueva) no entra en el corte.
const COBK = 'cob_marcas_v2';
function cobMarcas(){ try{ return JSON.parse(localStorage.getItem(COBK) || '{}'); }catch(e){ return S._cobMem || (S._cobMem = {}); } }
function cobGuardar(m){ try{ localStorage.setItem(COBK, JSON.stringify(m)); }catch(e){ S._cobMem = m; } }
const cobKey = (obra, op) => S.cobTipo + '|' + obra + '|' + (op||'');
const cobSnap = (obra, op) => { const v = cobMarcas()[cobKey(obra, op)]; return Array.isArray(v) ? v : null; };
const cobChk = (obra, op) => !!cobSnap(obra, op);
const cobItemsOp = op => { const c = S.cobIt; return c && c.map && c.map !== 'err' && c.key === S.cobTipo + '|' + S.cobObra ? (c.map.get(op || '') || []) : null; };
function cobToggle(obra, op){
  const m = cobMarcas(), k = cobKey(obra, op);
  if(m[k]){ delete m[k]; }
  else {
    const l = cobItemsOp(op);
    if(!l){ toast('Espera un momento: cargando los ítems de la obra', true); return; }
    m[k] = l.map(x => x.id);
  }
  cobGuardar(m); renderCobrosBox();
}
function cobChkTodas(on){
  const m = cobMarcas();
  const rows = (S.cobPend||[]).filter(r => r.tipo === S.cobTipo && r.obra === S.cobObra);
  if(on && rows.some(r => !cobItemsOp(r.op))){ toast('Espera un momento: cargando los ítems de la obra', true); return; }
  rows.forEach(r => { const k = cobKey(r.obra, r.op); if(on){ if(!m[k]) m[k] = cobItemsOp(r.op).map(x => x.id); } else delete m[k]; });
  cobGuardar(m); renderCobrosBox();
}
async function cobRegistrar(){
  const obra = S.cobObra, tipo = S.cobTipo, k = tipo === 'D' ? 'despacho' : 'instalacion';
  const rows = S.cobPend.filter(r => r.tipo === tipo && r.obra === obra && cobChk(obra, r.op)).sort((a,b) => nat(a.op, b.op));
  if(!rows.length) return;
  toast('Revisando los ítems marcados…');
  let items, est;
  try{
    items = await API.obra(obra);
    est = new Map((await (isGerente() ? API.comercial : API.cobros).call(API, items.map(i => i.id))).map(c => [c.item_id, c]));
  }catch(e){ return toast(errMsg(e), true); }
  const byIdO = new Map(items.map(i => [i.id, i]));
  const ok = it => it && (tipo === 'D' ? it.despachado : it.instalado) && !(est.get(it.id) || {})['cobrado_' + k];
  const det = rows.map(r => {
    const snap = new Set(cobSnap(obra, r.op));
    const incl = [...snap].map(id => byIdO.get(id)).filter(ok);
    const nuevos = items.filter(it => (it.op || '') === (r.op || '') && ok(it) && !snap.has(it.id));
    return {op:r.op, incl, nuevos};
  });
  const ids = det.flatMap(d => d.incl.map(it => it.id));
  const nNuevos = det.reduce((a,d) => a + d.nuevos.length, 0);
  if(!ids.length){ toast('Los ítems marcados ya no están pendientes', true); return; }
  const lst = l => { const c = new Map(); l.forEach(it => c.set(it.item || '—', (c.get(it.item || '—') || 0) + 1)); return [...c].sort((a,b) => nat(a[0], b[0])).map(([x,n]) => esc(x) + (n > 1 ? ' ×' + n : '')).join(', '); };
  const body = `<div class="summary"><b>${fmtN(ids.length)} ítems</b> en ${fmtN(det.length)} OP — solo los que estaban pendientes cuando chuleaste cada OP.</div>
    <div class="cob-det">${det.map(d => `<div><b>OP ${esc(d.op||'—')}</b> · ${fmtN(d.incl.length)}: ${lst(d.incl)}${d.nuevos.length ? `<div class="cob-nuevo">+ ${fmtN(d.nuevos.length)} registrado${d.nuevos.length===1?'':'s'} después, NO se incluye${d.nuevos.length===1?'':'n'}: ${lst(d.nuevos)}</div>` : ''}</div>`).join('')}</div>
    ${nNuevos ? `<div class="warn"><b>${fmtN(nNuevos)}</b> ítem${nNuevos===1?'':'s'} de estas OP se registr${nNuevos===1?'ó':'aron'} después de chulear y quedan pendientes para el próximo corte. Si sí van en este corte, cancela, quita la marca de la OP y vuelve a chulearla.</div>` : ''}
    <div class="fgrid"><div class="field"><span class="lbl">Fecha corte</span><input type="date" id="cFecha" value="${today()}"></div>

// Ítems (números de ítem de la obra) pendientes por cobrar en cada OP — se leen al entrar a la obra
async function loadCobItems(obra, tipo){
  const pend = S.cobPend, key = tipo + '|' + obra;
  S.cobIt = {key, pend, map:null};
  try{
    const k = tipo === 'D' ? 'despacho' : 'instalacion';
    const cand = (await API.obra(obra)).filter(i => tipo === 'D' ? i.despachado : i.instalado);
    const est = new Map((await (isGerente() ? API.comercial : API.cobros).call(API, cand.map(i => i.id))).map(c => [c.item_id, c]));
    const map = new Map();
    for(const i of cand){ if((est.get(i.id) || {})['cobrado_' + k]) continue; const op = i.op || ''; if(!map.has(op)) map.set(op, []); map.get(op).push({id:i.id, item:i.item || '—'}); }
    for(const l of map.values()) l.sort((a,b) => nat(a.item, b.item));
    if(S.cobIt && S.cobIt.key === key) S.cobIt.map = map;
  }catch(e){ if(S.cobIt && S.cobIt.key === key) S.cobIt.map = 'err'; }
  if(S.view === 'home' && S.homeTab === 'cobros' && S.cobObra === obra) renderCobrosBox();
}
function cobItemsHTML(obra, op){
  const c = S.cobIt;

  if(!c.map) return '<span class="d cob-its" style="padding-left:30px">Cargando ítems…</span>';
  if(c.map === 'err') return '';
  const l = c.map.get(op || '') || [];
  if(!l.length) return '';
  const cnt = new Map(); for(const x of l) cnt.set(x.item, (cnt.get(x.item) || 0) + 1);
  return `<span class="d cob-its" style="padding-left:30px">Ítem${cnt.size===1?'':'s'}: ${[...cnt].map(([x, n]) => `<b>${esc(x)}</b>${n > 1 ? ` <i>×${n}</i>` : ''}`).join(', ')}</span>`;
}

async function loadCobH(obra, tipo){

    const out = [];
    for(const i of items){ const c = est.get(i.id); if(!c || !c['cobrado_' + k]) continue;
      out.push({id:i.id, op:i.op || '', item:i.item || '—', ubicacion:i.ubicacion, piso:i.piso, m2:i.m2, num:c['num_corte_' + k] || '', fecha:c['fecha_corte_' + k]}); }

function cobQuitar(){
  const tipo = S.cobTipo, k = tipo === 'D' ? 'despacho' : 'instalacion', obra = S.cobObra;
  const l = S.cobH.items.filter(i => S.cobHSel.has(i.id)); if(!l.length) return;

// Botón para ver solo las obras con ítems en cola (se recuerda en este equipo)
if(S.soloCola == null){ try{ S.soloCola = localStorage.getItem('solo_cola') === '1'; }catch(e){ S.soloCola = false; } }
function toggleSoloCola(){ S.soloCola = !S.soloCola; try{ localStorage.setItem('solo_cola', S.soloCola ? '1' : '0'); }catch(e){} renderObrasBox(resumenObras()); }
function renderObrasBox(res){
  const q = S.q.trim().toUpperCase();
  const conCola = res.filter(o => o['EN COLA'] > 0).length;
  const qOP = esQOP(q);
  let list = q ? res.filter(o => o.obra.toUpperCase().includes(q) || (qOP && obraTieneQ(o.obra, q))) : res;
  if(S.soloCola) list = list.filter(o => o['EN COLA'] > 0);
  let h = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <button class="chip ${S.soloCola ? 'on' : ''}" onclick="toggleSoloCola()" title="Ocultar las obras que no tienen ítems en cola">Solo con ítems en cola · ${fmtN(conCola)}</button>
      ${S.soloCola && res.length > conCola ? `<small style="opacity:.7">${fmtN(res.length - conCola)} obra${res.length - conCola === 1 ? '' : 's'} oculta${res.length - conCola === 1 ? '' : 's'}</small>` : ''}</div>`;
  if(qOP) h += opBuscarHTML();
  h += list.length ? `<div class="grid-obras">${list.map(obraCard).join('')}</div>`
                   : qOP ? '' : `<div class="empty">${q ? 'Ninguna obra activa coincide con “'+esc(S.q)+'”.' : S.soloCola ? 'Ninguna obra activa tiene ítems en cola.' : 'No hay obras con ítems pendientes.'}</div>`;
  // Otras obras (terminadas): búsqueda en toda la base
  if(q.length >= 2 && !qOP){
    if(S.obrasAll){
      const act = new Set(res.map(o=>o.obra));
      const cnt = new Map();
      for(const o of S.obrasAll) if(!act.has(o) && o.toUpperCase().includes(q)) cnt.set(o,(cnt.get(o)||0)+1);
      const other = [...cnt.entries()].sort((a,b)=>nat(a[0],b[0]));
      if(other.length) h += `<div class="section-t">Obras terminadas</div><div class="other-list">${other.slice(0,60).map(([o,n])=>`<button onclick="openObra(decodeURIComponent('${encodeURIComponent(o)}'))"><b>${esc(o)}</b><span>${fmtN(n)}</span></button>`).join('')}</div>`;
    } else {
      h += `<div class="section-t">Obras terminadas</div><div><button class="btn sm" onclick="buscarTodas()">Buscar también en obras terminadas</button></div>`;
    }
  }
  $('#obrasBox').innerHTML = h;
}

// Búsqueda de OP desde la pantalla de obras: si lo escrito parece una OP, se busca en toda la base
const esQOP = q => /^0*\d{3,6}(-\d{0,3})?(\.\d{0,3})?$/.test(String(q || '').replace(/\s+/g, ''));
let _opT = null;
function opBuscarHTML(){
  const q = S.q.trim();
  if(!esQOP(q)) return '';
  const r = S.opRes;
  if(!r || r.q !== q){
    clearTimeout(_opT);
    _opT = setTimeout(async () => { let l = []; try{ l = await API.buscarOP(q); }catch(e){ l = null; } S.opRes = {q, l};
      if(S.view === 'home' && S.q.trim() === q){ const b = $('#opBox'); if(b) b.innerHTML = opBuscarHTML(); } }, 250);
    return '<div id="opBox"><div class="section-t">OP</div><div class="loading" style="padding:10px"><div class="spin"></div>Buscando la OP en toda la base</div></div>';
  }
  if(!r.l) return '<div id="opBox"><div class="warn">No se pudo buscar la OP. Revisa la conexión.</div></div>';
  const g = new Map(); for(const it of r.l){ const k = it.obra + '|' + it.op; if(!g.has(k)) g.set(k, {obra: it.obra, op: it.op, item: it.item, n: 0, cola: 0, desp: 0, inst: 0}); const x = g.get(k); x.n++; if(it.status === 'EN COLA' && !it.despachado) x.cola++; if(it.despachado) x.desp++; if(it.instalado) x.inst++; }
  const l = [...g.values()].sort((a, b) => nat(a.op, b.op));
  const est = x => x.inst === x.n ? 'Instalada' : x.desp === x.n ? 'Despachada' : x.cola === x.n ? 'En cola' : `${fmtN(x.n - x.cola)} de ${fmtN(x.n)} fabricadas`;
  return `<div id="opBox"><div class="section-t">OP que coinciden con “${esc(q)}”</div>${l.length ? `<div class="op-res">${l.slice(0, 60).map(x =>
    `<button onclick="openObra(decodeURIComponent('${encodeURIComponent(x.obra)}'), false, '', {op: decodeURIComponent('${encodeURIComponent(x.op)}'), estado: 'TODOS'})"><span><b>OP ${esc(x.op)}</b>${x.item ? ' · ' + esc(x.item) : ''}<br><small>${esc(x.obra)}</small></span><span class="op-res-e">${fmtN(x.n)} u · ${est(x)}</span></button>`).join('')}</div>` : '<div class="empty">No hay ninguna OP con ese número en la base.</div>'}</div>`;
}
// Obras que contienen la OP buscada (de los ítems activos ya cargados)
const obraTieneQ = (obra, q) => { const qq = q.replace(/\s+/g, '').replace(/^0+(?=\d)/, ''); return S.activos.some(it => it.obra === obra && [it.op, it.op_instalacion].some(v => v && String(v).toUpperCase().startsWith(qq))); };

async function buscarTodas(){

async function openObra(name, fromPop, anio, pf){
  S.view = 'obra'; S.obra = name; S.items = []; S.sel.clear(); S.detailId = null; S.draft = null;
  S.f = {estado: pf && pf.estado !== 'PEND' ? pf.estado : 'TODOS', pisos:new Set(), sis:new Set(), ser:new Set(), its:new Set(), ops:new Set(pf && pf.op ? [pf.op] : []), anio: anio || '', q: (pf && pf.q) || '', rng: (pf && pf.rng) || null, pr: (pf && pf.pr) || null}; S.limit = 300;
  if(!fromPop) history.pushState({v:'obra', obra:name, anio:anio||'', pf:pf||null}, '');
  $('#app').innerHTML = shell(`<button class="back" onclick="history.back()">${ICON.back} Obras</button>
    <div class="obra-title"><div class="h1">${esc(name)}</div></div><div class="loading"><div class="spin"></div>Cargando ítems</div>`);
  window.scrollTo(0,0);
  try{ const [it, ac] = await Promise.all([API.obra(name), API.actas(name).catch(() => null)]); S.items = it; S.actas = ac; await loadComercial(); await cargarRemRec(); await cargarNovedades(name); await cargarFaltantes(name); }
  catch(e){ toast('Error al cargar la obra: '+e.message, true); return; }
  if(S.view !== 'obra' || S.obra !== name) return;
  S.items.sort((a,b) => nat(a.op_instalacion,b.op_instalacion) || nat(a.item,b.item) || a.id-b.id);
  if(!pf && !S.f.anio && !S.items.some(isPend)) S.f.estado = 'TODOS';
  renderObra();
}

function onPop(ev){
  const st = ev.state || {v:'home'};
  if(S.view === 'scan' && st.v !== 'scan'){ scStop(); closeSheet(); }
  if(st.v === 'scan' && puedeEscanear()){ goScan(); return; }
  if(st.v === 'artica' && veArtica()){ goArtica(); return; }
  if(soloScan()){ history.replaceState({v:'scan'}, ''); goScan(); return; }
  if(st.v === 'obra' && S.view === 'obra' && st.obra === S.obra){
    if(S.detailId && !st.d){
      if(S.draft && S.draft._dirty && !confirm('Tienes cambios sin guardar. ¿Descartarlos?')){ history.pushState({v:'obra', obra:S.obra, d:S.detailId}, ''); return; }
      closeDetail(true);
    }
    return;
  }
  if(S.view === 'obra' && S.draft && S.draft._dirty && !confirm('Tienes cambios sin guardar. ¿Descartarlos?')){ history.pushState({v:'obra', obra:S.obra}, ''); return; }
  if(st.v === 'carga'){ S.view='carga'; renderCarga(); return; }
  if(st.v === 'obra') openObra(st.obra, true, st.anio, st.pf || undefined);
  else { S.view='home'; S.obra=null; S.sel.clear(); S.detailId=null; S.draft=null; document.body.style.overflow=''; closeSheet(); renderHome(); }
}

async function loadComercial(){
  S.com = new Map();
  if(!veCobros() || !S.items.length) return;
  try{ for(const c of await (vePrecio() ? API.comercial : API.cobros).call(API, S.items.map(i => i.id))) S.com.set(c.item_id, c); }
  catch(e){ toast('No se pudieron leer precios y cobros: '+errMsg(e), true); }
}
const com = it => S.com.get(it.id) || {};
const porCobrarD = it => it.despachado && !com(it).cobrado_despacho;
const porCobrarI = it => it.instalado && !com(it).cobrado_instalacion;

const porEntregar = it => it.instalado && !it.acta_id && String(it.fecha_instalacion || '') >= (S.entDesde || today());
const isPend = it => !(it.despachado && it.instalado);
const FILTROS = [
  ['PEND','Pendientes', it => isPend(it), false, true],   // ya no se muestra como botón
  ['EN COLA','En cola', it => stageOf(it)==='EN COLA'],
  ['PRODUCCIÓN','Producción', it => stageOf(it)==='PRODUCCIÓN'],
  ['ESPERA','⏸ En espera', it => enEspera(it)],
  ['ENSAMBLADO','Ensamblado', it => stageOf(it)==='ENSAMBLADO'],
  ['DESPACHOS','Despachados', it => it.despachado],
  ['DESPACHADO','Por instalar', it => it.despachado && !it.instalado],
  ['INSTALADO','Instalados', it => it.instalado],
  ['ENTREGAR','Por entregar', it => porEntregar(it)],
  ['TODOS','Todos', () => true],
  ['COB_D','Por cobrar despacho', porCobrarD, true],
  ['COB_I','Por cobrar instalación', porCobrarI, true]
];

// Sin programar: no está en ninguna programación ni ha entrado a ensamble, despacho o instalación
const itemDe = it => String(it.item || '').trim().toUpperCase();
const sinProgramar = it => it.programado !== 'X' && !it.programacion_id && !it.ensamblador && !it.dia_inicio && !it.despachado && !it.instalado;
// Filtros de piso, OP, año y texto (sin el de estado)
function baseMatch(it){
  const q = S.f.q.trim().toUpperCase();
  return (!S.f.pisos.size || S.f.pisos.has(it.piso||''))
    && (!S.f.ops.size || S.f.ops.has(it.op||''))
    && (!S.f.sis || !S.f.sis.size || S.f.sis.has(sistemaDe(it)))
    && (!S.f.ser || !S.f.ser.size || S.f.ser.has(serieDe(it)))
    && (!S.f.its || !S.f.its.size || S.f.its.has(itemDe(it)))
    && (!S.f.anio || yearOf(it) === S.f.anio)
    && (!S.f.rng || (it[S.f.rng.campo] && it[S.f.rng.campo] >= S.f.rng.d1 && it[S.f.rng.campo] <= S.f.rng.d2))
    && (!S.f.pr || prMatch(it, S.f.pr))
    && (!S.f.prg || (S.f.prg === 'sin') === sinProgramar(it))
    && (!q || [it.item,it.ubicacion,it.op_instalacion,it.op,it.diseno,it.ensamblador,it.instalador,it.remision].some(v => v && String(v).toUpperCase().includes(q)));
}
function filtered(){
  const fe = FILTROS.find(f => f[0]===S.f.estado)[2];
  return S.items.filter(it => fe(it) && baseMatch(it));
}

/div>
        </div>

        <div class="chips" id="chips"></div>
