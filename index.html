// Tamaño de la impresora de etiquetas (rollo): se guarda en este equipo
function etqRollo(){ try{ return Object.assign({medio:'rollo', w:85, h:60, dis:'full'}, JSON.parse(localStorage.getItem('etq_rollo') || '{}')); }catch(e){ return {medio:'rollo', w:85, h:60, dis:'full'}; } }
function etqGuardar(v){ try{ localStorage.setItem('etq_rollo', JSON.stringify(Object.assign(etqRollo(), v))); }catch(e){} }
function etqDiseno(d){ etqGuardar({dis:d}); document.querySelectorAll('#etqDis button').forEach((b,i) => b.classList.toggle('on', (i===0) === (d==='min'))); }
function etqMedio(m){ etqGuardar({medio:m}); document.querySelectorAll('#etqMedio button').forEach((b,i) => b.classList.toggle('on', (i===0) === (m==='rollo'))); $('#etqTam').style.display = m==='rollo' ? '' : 'none'; }
async function etqLogo(){
  if(window._etqLogo) return window._etqLogo;
  try{
    const b = await (await fetch('icons/logo-etiqueta.png')).blob();
    const url = await new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(b); });
    const im = new Image(); im.src = url; await im.decode();
    return window._etqLogo = {url, r: im.width / im.height};
  }catch(e){ return null; }
}
async function etqPDF(tipo){
  if(!isGerente()) return;
  const items = (typeof filtered === 'function' ? filtered() : S.items).filter(it => it.op);
  let lista;
  if(tipo === 'op') lista = [...grp(items, it => it.op).entries()].sort((a,b) => nat(a[0], b[0])).map(([op, l]) => ({op, l}));
  else lista = items.filter(it => it.op_instalacion).sort((a,b) => nat(a.op_instalacion, b.op_instalacion));
  if(!lista.length) return toast('No hay nada para imprimir', true);
  toast('Preparando las etiquetas…');
  try{
    if(!window.qrcode) await loadScript('lib/qrcode.js');
    if(!window.jspdf) await loadScript('lib/jspdf.js');
  }catch(e){ return toast(errMsg(e), true); }
  const logo = await etqLogo();
  // Hojas tamaño CARTA de etiquetas adhesivas precortadas (estándar Avery, se consiguen también "compatibles"):
  //  · Por ítem → Avery 5163 / 8163: 2" × 4" (50,8 × 101,6 mm), 10 por hoja (2 × 5)
  //  · Por OP   → Avery 5160 / 8160: 1" × 2⅝" (25,4 × 66,7 mm), 30 por hoja (3 × 10)
  const IN = 25.4;
  const R = etqRollo();
  if(R.medio === 'rollo'){
    const w = parseFloat(String(($('#etqW') || {}).value || R.w).replace(',', '.')), h = parseFloat(String(($('#etqH') || {}).value || R.h).replace(',', '.'));
    if(!(w >= 20 && w <= 150 && h >= 15 && h <= 200)) return toast('Revisa el tamaño de la etiqueta (ancho 20–150 mm, alto 15–200 mm)', true);
    etqGuardar({w, h});
    return etqRolloPDF(tipo, lista, w, h, logo, R.dis === 'min');
  }
  const F = tipo === 'op'
    ? {ref:'Avery 5160 / 8160', COLS:3, ROWS:10, W:2.625*IN, H:1*IN, MX:0.1875*IN, MY:0.5*IN, GX:0.125*IN, QR:21}
    : {ref:'Avery 5163 / 8163', COLS:2, ROWS:5, W:4*IN, H:2*IN, MX:0.15625*IN, MY:0.5*IN, GX:0.1875*IN, QR:38};
  const {COLS, ROWS, W, H, QR} = F;
  const doc = new jspdf.jsPDF({unit:'mm', format:'letter'});
  const corta = (t, max) => { t = String(t || ''); while(t && doc.getTextWidth(t) > max) t = t.slice(0, -1); return t; };
  const qr = (txt, x, y, size) => {
    const q = qrcode(0, 'M'); q.addData(txt); q.make();
    const n = q.getModuleCount(), cs = size / n; doc.setFillColor(0, 0, 0);
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) doc.rect(x + c*cs, y + r*cs, cs + 0.02, cs + 0.02, 'F');
  };
  lista.forEach((e, n) => {
    const k = n % (COLS*ROWS); if(n && !k) doc.addPage();
    const x = F.MX + (k % COLS) * (W + F.GX), y = F.MY + Math.floor(k / COLS) * H;
    const pad = tipo === 'op' ? 2 : 4;
    const qx = x + pad, qy = y + (H - QR) / 2, tx = qx + QR + (tipo === 'op' ? 2 : 4), tw = x + W - tx - pad;
    let ty = y + (tipo === 'op' ? 2.5 : 5);
    if(logo){ const lw = Math.min(tw, tipo === 'op' ? 19 : 36), lh = lw / logo.r; doc.addImage(logo.url, 'PNG', tx, ty, lw, lh, 'logoEtq'); ty += lh + (tipo === 'op' ? 2.6 : 4.2); }
    else ty += 3;
    doc.setTextColor(0);
    if(tipo === 'op'){
      const {op, l} = e;
      qr(qrTexto(op), qx, qy, QR);
      const pisos = [...new Set(l.map(i => i.piso).filter(Boolean))].sort(nat);
      const dis = [...new Set(l.map(i => i.diseno).filter(Boolean))];
      doc.setFont('helvetica', 'bold'); doc.setFontSize(6); doc.text(corta(String(l[0].obra).toUpperCase(), tw), tx, ty);
      doc.setFontSize(11); doc.text(corta('OP ' + op, tw), tx, ty + 4.6);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(5.5); doc.setTextColor(60);
      doc.text(corta(l.length + ' ítem' + (l.length===1?'':'s') + (pisos.length ? ' · Piso ' + pisos.join(', ') : ''), tw), tx, ty + 7.8);
      doc.text(corta(dis.join(' / '), tw), tx, ty + 10.4);
    } else {
      const it = e;
      qr(qrTexto(it.op_instalacion), qx, qy, QR);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.text(corta(String(it.obra).toUpperCase(), tw), tx, ty);
      doc.setFontSize(18); doc.text(corta(it.op_instalacion, tw), tx, ty + 7.5);
      doc.setFontSize(10); doc.text(corta([it.item, it.ubicacion].filter(Boolean).join(' · '), tw), tx, ty + 13);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(50);
      const med = it.ancho ? fmtN(it.ancho) + ' × ' + fmtN(it.alto) : '';
      doc.text(corta([it.piso ? 'Piso ' + it.piso : '', med].filter(Boolean).join(' · '), tw), tx, ty + 17.5);
      doc.text(corta(it.diseno || '', tw), tx, ty + 21.5);
      if(it.vidrio) doc.text(corta('Vidrio: ' + it.vidrio, tw), tx, ty + 25.5);
    }
  });
  const obra = (S.obra || 'obra').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_');
  const nombre = `Etiquetas_${tipo === 'op' ? 'OP' : 'items'}_${obra}.pdf`;
  const blob = doc.output('blob');
  const file = new File([blob], nombre, {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const puedeCompartir = !!(navigator.canShare && navigator.canShare({files:[file]}));
  window._etq = {file, url, nombre};
  const hojas = Math.ceil(lista.length / (COLS*ROWS));
  const body = `<div class="summary"><b>${fmtN(lista.length)} etiqueta${lista.length===1?'':'s'} ${tipo === 'op' ? 'por OP' : 'por ítem'}</b> en ${hojas} hoja${hojas===1?'':'s'} de etiquetas adhesivas <b>${F.ref}</b> (carta, ${COLS * ROWS} por hoja).</div>
    <div class="warn">Al imprimir: papel <b>Carta</b>, escala <b>100 % / tamaño real</b> (no "ajustar a la página"), sin márgenes extra.</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      ${puedeCompartir ? `<button class="btn primary" onclick="navigator.share({files:[_etq.file], title:_etq.nombre}).catch(()=>{})">Compartir / Imprimir</button>` : ''}
      <a class="btn ${puedeCompartir ? '' : 'primary'}" href="${url}" target="_blank" rel="noopener" style="text-decoration:none;justify-content:center">Abrir PDF</a>
      <a class="btn" href="${url}" download="${esc(nombre)}" style="text-decoration:none;justify-content:center">${ICON.down} Descargar PDF</a>
    </div>
    <div class="sc-note" style="margin-top:10px">En el iPhone o iPad: <b>Compartir / Imprimir</b> → <b>Imprimir</b>. En el Mac: <b>Abrir PDF</b> → Cmd + P.</div>`;
  openSheet('Etiquetas QR', esc(S.obra || ''), body, 'Listo', async () => {});
}

const opNum = op => { const m = String(op || '').trim().match(/^(\d+)/); return m ? m[1] : null; };
const tieneOrden = op => { const n = opNum(op); return !!(n && S.ordenes && S.ordenes.has(n)); };
async function loadOrdenes(){
  try{ S.ordenes = new Set(await API.ordenesLista()); S.ordenesErr = null; }
  catch(e){ S.ordenes = null; S.ordenesErr = errMsg(e); }
  if(S.view === 'obra') updOrdenBox();
  if(S.view === 'carga' && C.tab === 'ordenes') renderCarga();
}
const ordenBtnHTML = (op, txt) => tieneOrden(op) ? `<button class="btn sm btn-orden" onclick="event.stopPropagation(); verOrden(decodeURIComponent('${encQ(op)}'))">${ICON.pdf} ${txt || 'Orden ' + esc(opNum(op))}</button>` : '';
const ordenLinkHTML = op => tieneOrden(op) ? ` · <a href="#" class="cob-ver" onclick="event.stopPropagation(); event.preventDefault(); verOrden(decodeURIComponent('${encQ(op)}'))">orden PDF ›</a>` : '';
async function verOrden(op){
  const n = opNum(op); if(!n) return;
  // La ventana se abre de inmediato: el iPhone bloquea las que se abren después de esperar a internet
  let w = null; try{ w = window.open('', '_blank'); if(w) w.document.write('<p style="font:16px sans-serif;padding:24px">Abriendo orden ' + n + '…</p>'); }catch(e){}
  try{ const url = await API.ordenUrl(n); if(w) w.location.replace(url); else window.location.href = url; }
  catch(e){ if(w) w.close(); toast('No se pudo abrir la orden ' + n + ': ' + errMsg(e), true); }
}
function updOrdenBox(){ const b = $('#ordenBox'); const op = S.f && S.f.ops && S.f.ops.size === 1 ? [...S.f.ops][0] : ''; if(b) b.innerHTML = op ? ordenBtnHTML(op, 'Orden ' + esc(opNum(op) || '')) : ''; }
// Filtros de varios pisos / varias OP a la vez
const mselTxt = k => { if(!S.f[k]) S.f[k] = new Set(); const sz = S.f[k].size, nom = k === 'pisos' ? ['Todos los pisos', 'piso', 'pisos'] : k === 'sis' ? ['Todos los sistemas', 'sistema', 'sistemas'] : k === 'ser' ? ['Todas las series', 'serie', 'series'] : k === 'its' ? ['Todos los ítems', 'ítem', 'ítems'] : ['Todas las OP', 'OP', 'OP'];

// ¿Es un PDF? Por la extensión, por el tipo o, si el archivo no tiene extensión, por su contenido (empieza con %PDF)
async function esPDF(f){
  if(/\.pdf$/i.test(f.name) || f.type === 'application/pdf') return true;
  if(f.name.startsWith('.') || /\.[a-z0-9]{2,5}$/i.test(f.name)) return false;
  try{ return (await f.slice(0, 5).text()) === '%PDF-'; }catch(e){ return false; }
}
async function ordenesLeer(files){
  const m = new Map(); O.sinNum = []; O.otros = 0; O.dup = [];
  for(const f of files){
    if(!(await esPDF(f))){ if(!f.name.startsWith('.')) O.otros++; continue; }
    const base = f.name.replace(/\.pdf$/i, '').trim(), mm = base.match(/^\D{0,4}?(\d{3,6})/);
    if(!mm){ O.sinNum.push(f.name); continue; }
    const num = mm[1];
    const obra = (f.webkitRelativePath || '').split('/').slice(-2, -1)[0] || '';
    if(m.has(num)){ if(!O.dup.includes(num)) O.dup.push(num); if(f.lastModified <= m.get(num).file.lastModified) continue; }
    m.set(num, {num, file:f, obra});
  }
  O.lista = [...m.values()].sort((a,b) => nat(a.num, b.num));
  if(!O.lista.length && !O.sinNum.length){ toast('No se encontraron PDF en lo que elegiste', true); return; }
  O.reemplazar = false; O.estado = 'revision'; renderCarga();
}
// ── QR impreso dentro de la orden de producción ──
// Lee el número de cada página ("Número: 006291-1") y pone el QR de esa OP abajo a la derecha, EN LUGAR
// del código de barras (que se borra: no se usa). Arriba se cortaba al fotocopiar.
// Si el PDF ya está así (ELP-QR3), no lo toca; si tenía el QR en otra posición (versiones anteriores), lo borra de ahí.
async function qrLibsPDF(){
  if(!window.qrcode) await loadScript('lib/qrcode.js');
  if(!window.PDFLib) await loadScript('lib/pdf-lib.js');
  if(!window.pdfjsLib){ await loadScript('lib/pdfjs.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdfjs.worker.js'; }
}
async function ordenConQR(blob){
  await qrLibsPDF();
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const doc = await PDFLib.PDFDocument.load(bytes, {ignoreEncryption:true});
  const kw = String(doc.getKeywords() || '');
  if(kw.includes('ELP-QR3')) return {blob, n:0, ya:true};
  const v2 = kw.includes('ELP-QR2');                 // QR junto al código de barras
  const viejo = kw.includes('ELP-QR') && !v2;        // QR arriba, en el encabezado
  const pdf = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
  const pages = doc.getPages(); let n = 0, ultimo = null;
  for(let i = 0; i < pages.length; i++){
    const tc = await (await pdf.getPage(i + 1)).getTextContent();
    const txt = tc.items.map(t => t.str).join(' ');
    const m = txt.match(/N[uú]mero\s*:?\s*0*(\d{3,6}-\d+)/i);
    const op = m ? m[1] : ultimo; if(!op) continue; ultimo = op;
    const pg = pages[i], {width:W, height:H} = pg.getSize();
    const q = qrcode(0, 'M'); q.addData(qrTexto(op)); q.make();
    const kx = W / 612, ky = H / 792, blanco = PDFLib.rgb(1,1,1);
    if(viejo) pg.drawRectangle({x: W * 0.626 - 2.5, y: H - 12 - 40 - 2.5, width: 45, height: 45, color: blanco});
    if(v2) pg.drawRectangle({x: 352 * kx, y: 33 * ky, width: 52 * kx, height: 52 * ky, color: blanco});
    // Borrar el código de barras (barras y número: x 410–564, y 40–78 en una hoja carta)
    pg.drawRectangle({x: 406 * kx, y: 37 * ky, width: 162 * kx, height: 44 * ky, color: blanco});
    // QR en su lugar, centrado donde estaba el código de barras
    const size = 56, nm = q.getModuleCount(), cs = size / nm;
    const x = (410 + (154 - size) / 2) * kx, y = 30 * ky;
    pg.drawRectangle({x: x - 2, y: y - 2, width: size + 4, height: size + 4, color: PDFLib.rgb(1,1,1)});
    for(let r = 0; r < nm; r++) for(let c = 0; c < nm; c++) if(q.isDark(r, c))
      pg.drawRectangle({x: x + c*cs, y: y + (nm - 1 - r)*cs, width: cs + 0.05, height: cs + 0.05, color: PDFLib.rgb(0,0,0)});
    n++;
  }
  await pdf.destroy();
  if(!n) return {blob, n:0};
  doc.setKeywords(['ELP-QR', 'ELP-QR3']);
  return {blob: new Blob([await doc.save()], {type:'application/pdf'}), n};
}

// ── Conversión de valores ──
function cTxt(v){ if(v==null) return null; const s = String(v).replace(/\s+/g,' ').trim(); return s === '' ? null : s; }
function cNum(v){
  if(v==null || v==='') return {v:null};
  if(typeof v === 'number') return {v};
  let s = String(v).replace(/\s|\$/g,'');
  if(s === '') return {v:null};
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,'');
  else s = s.replace(',','.');
  const n = Number(s);
  return isNaN(n) ? {v:null, bad:true} : {v:n};
}
function cFecha(v){
  if(v==null || v==='') return {v:null};
  if(typeof v === 'number' && v > 20000 && v < 80000){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*864e5);
    return {v: d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; const d=+m[1], mo=+m[2]; if(mo>=1&&mo<=12&&d>=1&&d<=31) return {v: y+'-'+pad(mo)+'-'+pad(d)}; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return {v: m[1]+'-'+pad(+m[2])+'-'+pad(+m[3])};
  return {v:null, bad:true};
}

async function leerArchivo(file){
  C.estado = 'leyendo'; C.archivo = file.name; C.msg = 'Leyendo el archivo'; renderCarga();
  try{
    if(!window.XLSX) await loadScript(XLSX_URL);
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    // Hoja: la que se llame OPs, o la primera que tenga encabezados OBRA e ITEM
    let aoa = null, hdrRow = -1;
    const names = [...wb.SheetNames].sort((a,b) => (normH(b)==='OPS') - (normH(a)==='OPS'));
    for(const n of names){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null, blankrows:false});
      const i = rows.slice(0,15).findIndex(r => r && r.some(c=>normH(c)==='OBRA') && r.some(c=>normH(c)==='ITEM'));
      if(i >= 0){ aoa = rows; hdrRow = i; break; }
    }
    if(!aoa) throw new Error('No encontré una hoja con los encabezados OBRA e ITEM.');
    const hdr = aoa[hdrRow].map(normH);
    const idx = {};
    hdr.forEach((h,i) => { const k = COLMAP[h]; if(k && idx[k] === undefined) idx[k] = i; });   // si hay dos "VIDRIO", vale la primera
    const faltan = ['obra','item','op_instalacion','ancho','alto'].filter(k => idx[k] === undefined);
    if(faltan.length) throw new Error('Faltan columnas en el archivo: '+faltan.map(k => PLANTILLA.find(h => COLMAP[normH(h)]===k)).join(', '));
    const hoy = today();
    const filas = [];
    for(let r = hdrRow+1; r < aoa.length; r++){
      const row = aoa[r]; if(!row || row.every(c => c==null || String(c).trim()==='')) continue;
      const g = k => idx[k] === undefined ? null : row[idx[k]];
      const f = {n: r+1, errors:[], warns:[], d:{}};
      const d = f.d;
      for(const k of ['item','ubicacion','sistema','serie','piso','diseno','vidrio','op']) d[k] = cTxt(g(k));
      if(!d.piso && d.ubicacion) d.piso = pisoDeUbic(d.ubicacion);   // el piso escrito en la ubicación
      d.obra = cTxt(g('obra')); if(d.obra) d.obra = d.obra.toUpperCase();
      d.op_instalacion = cTxt(g('op_instalacion'));
      for(const k of ['ancho','alto','m2','cant','tiempo_op','puntos','precio']){
        const x = cNum(g(k)); d[k] = x.v;
        if(x.bad) f.errors.push(`${k==='precio'?'PRECIO':k.toUpperCase().replace('_',' ')} no es un número`);
      }
      const fe = cFecha(g('fecha_op'));
      if(fe.bad) f.errors.push('FECHA OP no es una fecha válida');
      d.fecha_op = fe.v || (fe.bad ? null : hoy);
      if(!fe.v && !fe.bad) f.warns.push('Sin FECHA OP: se usará hoy');
      if(!d.obra) f.errors.push('Falta OBRA');
      if(!d.item) f.errors.push('Falta ITEM');
      if(!d.op_instalacion) f.errors.push('Falta OP INSTALACION');
      if(d.ancho==null || d.alto==null) f.warns.push('Medidas incompletas');
      if(d.m2==null && d.ancho!=null && d.alto!=null){ d.m2 = Math.round(d.ancho*d.alto/1e4)/100; f.warns.push('M² calculado'); }
      if(d.precio==null) f.warns.push('Sin precio');
      filas.push(f);
    }
    if(!filas.length) throw new Error('El archivo no tiene filas con datos debajo de los encabezados.');
    C.pdfs = null;
    await revisarFilas(filas);
  }catch(e){
    C.estado = 'inicio';
    toast(errMsg(e), true);
  }
  renderCarga();
}
// Validaciones comunes (Excel o PDF): repetidas, ya existentes, obras nuevas o parecidas
async function revisarFilas(filas){
  {
    // Repetidas dentro del archivo
    const cnt = new Map(); filas.forEach(f => f.d.op_instalacion && cnt.set(f.d.op_instalacion, (cnt.get(f.d.op_instalacion)||0)+1));
    filas.forEach(f => { if(cnt.get(f.d.op_instalacion) > 1) f.errors.push('OP INSTALACION repetida en el archivo'); });
    // Ya existentes en la base
    C.msg = 'Comparando con la base de datos'; renderCarga();
    const ops = [...cnt.keys()];
    const ya = await API.existentes(ops);
    filas.forEach(f => { if(ya.has(f.d.op_instalacion)) f.errors.push('Esa OP INSTALACION ya existe en la base'); });
    // Nombres de obra que ya se dijo que son otra obra (p. ej. la OP dice PROYECTO 125 y la obra es CALLE 125)
    let al = new Map(); try{ al = new Map((await API.obrasAlias()).map(r => [r.alias, r.obra])); }catch(e){}
    for(const f of filas) if(f.d.obra && al.has(f.d.obra)){ f.d.obraOrig = f.d.obra; f.d.obra = al.get(f.d.obra); }
    if(!S.obrasAll) S.obrasAll = S.anual ? S.anual.map(r=>r.obra) : await API.todasObras();
    C.filas = filas; obrasRevisar(filas); C.soloProblemas = filas.some(f => f.errors.length);
    C.estado = 'revision';
  }
}

// Obras nuevas o con nombre parecido
function obrasRevisar(filas){
  const exist = new Set(S.obrasAll || []), porClave = new Map();
  for(const o of exist) porClave.set(obraKey(o), o);
  const obrasInfo = new Map();
  for(const f of filas){
    f.warns = f.warns.filter(w => !w.startsWith('¿Es la obra'));
    const o = f.d.obra; if(!o) continue;
    if(!obrasInfo.has(o)){
      const parecida = !exist.has(o) ? (porClave.get(obraKey(o)) || null) : null;
      obrasInfo.set(o, {nueva: !exist.has(o), parecida});
    }
    const inf = obrasInfo.get(o);
    if(inf.parecida) f.warns.push(`¿Es la obra ${inf.parecida}? El nombre no coincide exactamente`);
  }
  C.obrasInfo = obrasInfo;
}
// Obras existentes ordenadas por parecido con un nombre nuevo (números y palabras en común primero)
function obrasParecidas(nombre){
  const tok = t => new Set(normH(t).split(/[^A-Z0-9]+/).filter(x => x.length > 1));
  const a = tok(nombre), l = [...new Set(S.obrasAll || [])];
  const pts = o => { let p = 0; for(const t of tok(o)) if(a.has(t)) p += /^\d+$/.test(t) ? 3 : 1; return p; };
  return l.map(o => [o, pts(o)]).sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0])).map(x => x[0]);
}
// "Es la misma obra que…": todas las filas de ese nombre pasan a la obra elegida y se recuerda para la próxima vez
async function obraIgual(i, destino){
  const orig = (C.obrasNuevas || [])[i]; if(!orig || !destino) return;
  for(const f of C.filas) if(f.d.obra === orig){ f.d.obraOrig = f.d.obraOrig || orig; f.d.obra = destino; }

}

// Corregir una obra elegida por error (o que vino de un alias guardado): pasarla a otra obra o dejarla como obra nueva
async function obraCambiar(actual, destino){
  if(!destino) return;
  const fs = C.filas.filter(f => f.d.obra === actual && f.d.obraOrig), origs = [...new Set(fs.map(f => f.d.obraOrig))];
  if(!fs.length) return;
  for(const f of fs){ if(destino === '__nueva__'){ f.d.obra = f.d.obraOrig; delete f.d.obraOrig; } else f.d.obra = destino; }
  obrasRevisar(C.filas); renderCarga();
  try{
    for(const o of origs){ if(destino === '__nueva__') await API.obraAliasBorrar(o); else await API.obraAliasGuardar(o, destino); }
    toast(destino === '__nueva__' ? `✓ Queda como obra nueva: ${origs.join(', ')}` : `✓ Se cargará en ${destino}. La próxima vez que una OP diga "${origs.join(', ')}" se hará solo`);
  }catch(e){ toast('Cambiado aquí, pero no se pudo guardar para la próxima: ' + errMsg(e), true); }
}

const MESES = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};
const pdfNum = t => { const v = parseFloat(String(t || '').replace(/\./g, '').replace(',', '.')); return isFinite(v) ? v : null; };
async function leerOrdenesPDF(files){
  C.estado = 'leyendo'; C.archivo = files.length === 1 ? files[0].name : files.length + ' órdenes PDF'; C.msg = 'Leyendo las órdenes'; renderCarga();

      if(/\.xlsx?$/i.test(file.name)){ artFuera.push(file.name); continue; }   // las OP de Ártica en Excel se cargan en Ártica

    if(!ops.length) throw new Error(artFuera.length ? 'Las OP de clientes de Ártica se cargan desde Ártica → OPTIMA y etiquetas → Cargar OP de clientes.' : 'No encontré órdenes de producción en ese PDF (busco el "Número: 006291-1" del encabezado).');
    // Ártica: las líneas de vidrio de cada OP (las OP de terceros solo traen vidrio: no crean ítems en Elíptica)
    C.vidrios = artFilasDeOps(ops);

          fecha_op: o.fecha || today(), tiempo_op: o.tiempo, puntos: o.puntos, precio: o.valor || null, sistema: null, serie: null}};
        if(!f.d.obra) f.errors.push('No encontré la obra');

// Lee un PDF de órdenes: encabezado de cada OP y sus líneas de vidrio (todas las páginas de la OP)
async function leerOPsPDF(data, nombre){
  const pdf = await pdfjsLib.getDocument({data}).promise;
  const ops = []; let actual = null, num = null;
  for(let pn = 1; pn <= pdf.numPages; pn++){
    const tc = await (await pdf.getPage(pn)).getTextContent();
    const it = tc.items.filter(t => t.str.trim()).map(t => ({s: t.str.trim(), x: t.transform[4], x2: t.transform[4] + t.width, y: t.transform[5]}));
    const one = re => it.find(t => re.test(t.s));
    const nm = one(/^N[uú]mero\s*:/i), m = nm && nm.s.match(/(\d{3,6})-(\d+)/);
    if(m){
      const op = m[1].replace(/^0+(?=\d)/, '') + '-' + m[2];
      if(!actual || actual.op !== op){ actual = ordenPagina(it, op); actual.archivo = nombre; actual.vidrios = []; actual.perfiles = []; ops.push(actual); num = m[1].replace(/^0+(?=\d)/, ''); }
    }
    else if(!m){
      // OP de clientes de Ártica: "ORDEN DE PRODUCCION 6585-1", cliente y medidas en metros
      const h = artOPHeader(it);
      if(h){ if(!actual || actual.op !== h.op || !actual.artica){ actual = {...h, archivo: nombre, artica: true, tercero: true, vidrios: [], perfiles: []}; ops.push(actual); } }
      if(actual && actual.artica){ artOPLineas(it, actual); continue; }
    }
    if(!actual || actual.artica) continue;
    // Nombre completo del vidrio (en el encabezado sale cortado): se busca en la lista de materiales
    if(actual.vidrioCorto && !actual.vidrio){ const v = it.find(t => t.s.length > actual.vidrioCorto.length && t.s.startsWith(actual.vidrioCorto)); if(v) actual.vidrio = v.s; }
    vidriosPagina(it, actual);
  }
  await pdf.destroy();
  for(const o of ops) o.tercero = !!o.artica;   // solo el formato de Ártica es de clientes; el de Elíptica es de Elíptica aunque solo traiga vidrio
  return {ops, num};
}
// ── OP de clientes de Ártica (formato propio de Ártica) ──
// Ojo: el número puede coincidir con una OP de Elíptica; se guardan aparte (tercero = true, SQL 74)
const filasPDF = it => { const filas = []; for(const t of [...it].sort((a, b) => b.y - a.y || a.x - b.x)){ let f = filas.find(r => Math.abs(r.y - t.y) < 2.5); if(!f){ f = {y: t.y, t: []}; filas.push(f); } f.t.push(t); }
  return filas.map(f => ({y: f.y, s: f.t.sort((a, b) => a.x - b.x).map(t => t.s).join(' ').replace(/\s+/g, ' ').trim()})); };
// N.º de OP de Ártica: "6585-1" o consecutivo propio ("00001", se deja como está)
const artNumOP = v => { const t = String(v ?? '').trim(), m = t.match(/(\d{1,6})-(\d+)/); if(m) return m[1].replace(/^0+(?=\d)/, '') + '-' + m[2]; const n = t.match(/^\d{1,8}$/); return n ? t : null; };
// Fechas: Date, 27/10/2026, 2026-10-27, "OCTUBRE 28 DE 2026", "28 de octubre de 2026"
function fechaISO(v){
  if(v instanceof Date && !isNaN(v)) return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate());

async function confirmarCarga(){
  const ok = C.filas.filter(f => !f.errors.length);
  if(!ok.length && C.vidrios && C.vidrios.length) return artCargarVidrios(C.vidrios, true);
  if(!ok.length) return;
  const obras = [...new Set(ok.map(f=>f.d.obra))];
  if(!confirm(`¿Cargar ${ok.length} ítems en ${obras.length === 1 ? 'la obra '+obras[0] : obras.length+' obras'}?\n\nEntrarán en estado EN COLA y tu asistente los verá de inmediato.`)) return;
  C.estado = 'cargando'; C.progreso = 0; renderCarga();
  const rows = ok.map(f => { const {precio, obraOrig, ...d} = f.d; return d; });   // obraOrig: solo para mostrar el alias, no va a la base
  let ins = [];
  try{
    ins = await API.insertItems(rows, n => { C.progreso = n; const el = document.querySelector('.loading'); if(el) el.lastChild.textContent = `Cargando ítems… ${fmtN(n)} de ${fmtN(rows.length)}`; });
    const idPorOp = new Map(ins.map(r => [r.op_instalacion, r.id]));
    const com = ok.map(f => ({item_id: idPorOp.get(f.d.op_instalacion), precio: f.d.precio})).filter(r => r.item_id);
    try{ await API.insertComercial(com); C.errComercial = null; }
    catch(e){ C.errComercial = errMsg(e); }
    C.cargados = {ids: ins.map(r=>r.id), obras, n: ins.length, total: rows.length};
    if(C.vidrios && C.vidrios.length && isGerente()){ try{ C.cargados.vid = await API.artCargar(C.vidrios); }catch(e){ C.cargados.vidErr = errMsg(e); } }
    if(C.pdfs && C.pdfs.length){
      const el = document.querySelector('.loading'); if(el) el.lastChild.textContent = 'Subiendo las órdenes con su QR…';
      let sub = 0; const err = [];
      for(const x of C.pdfs){ try{ let fl = x.file; try{ const r = await ordenConQR(fl); if(r.n) fl = r.blob; }catch(e){} await API.ordenSubir(x.num, fl); sub++; }catch(e){ err.push(x.num + ': ' + errMsg(e)); } }
      C.cargados.pdfSub = sub; C.cargados.pdfErr = err; loadOrdenes();
    }
  }catch(e){
    const parcial = (e && e.parcial) || [];
    C.cargados = {ids: parcial.map(r=>r.id), obras, n: parcial.length, total: rows.length, error: errMsg(e)};
  }
  C.estado = 'listo';
  S.obrasAll = null; S.anual = null; S.anualIdx = null; S.anualPos = null;
  try{ await loadActivos(); }catch(e){}
  renderCarga();
}

function bTxt(v){ if(v==null) return null; const s = String(v).trim(); return (s===''||s==='#N/A'||s==='None') ? null : s; }
function bNum(v){ if(v==null||v==='') return null; if(typeof v==='number') return v; const n = Number(String(v).trim().replace(',','.')); return isNaN(n) ? null : n; }
function bFecha(v, campo, notas){
  if(v==null||v==='') return null;
  if(typeof v === 'number'){ if(v > 30000 && v < 60000){ const d = new Date(Date.UTC(1899,11,30) + Math.floor(v)*864e5); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); } }
  const s = String(v).trim(); if(!s || s==='#N/A') return null;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; if(y>=2010 && y<=2035 && +m[2]>=1 && +m[2]<=12 && +m[1]>=1 && +m[1]<=31) return y+'-'+pad(+m[2])+'-'+pad(+m[1]); }
  notas && notas.push(campo+': '+s); return null;
}
function bHora(v, campo, notas){
  if(v==null||v==='') return null;
  if(typeof v === 'number'){
    if(v >= 1 && Number.isInteger(v)){ notas && notas.push(campo+': '+v); return null; }   // un número entero no es una hora
    const fr = v - Math.floor(v); const m = Math.round(fr*1440); return pad(Math.floor(m/60)%24)+':'+pad(m%60);
  }
  const s = String(v).trim().toUpperCase().replace(/[\s.]/g,'');
  const m = s.match(/^(\d{1,2}):(\d{2})(AM|PM)?$/);
  if(m){ let hh=+m[1], mm=+m[2]; if(m[3]==='PM'&&hh<12) hh+=12; if(m[3]==='AM'&&hh===12) hh=0; if(hh<24&&mm<60) return pad(hh)+':'+pad(mm); }
  notas && notas.push(campo+': '+v); return null;
}
function bProc(v){ const s = (bTxt(v)||'').toUpperCase(); return s.startsWith('X') ? 'X' : (s==='+' ? '+' : null); }
function bSiNo(v){ const s = normH(bTxt(v)||''); return (s==='SI'||s==='X') ? true : (s==='NO' ? false : null); }   // acepta SI, Sí, si, X
function bCorte(v){ if(typeof v === 'number' && v > 30000 && v < 60000 && !Number.isInteger(v)) return String(Math.floor(v)); return v==null ? null : (bTxt(v)); }

async function leerBase(file){
  M.estado = 'leyendo'; M.archivo = file.name; M.msg = 'Leyendo el archivo (puede tardar unos segundos)'; M.backup = false; M.confirmTxt = ''; M.error = null; renderCarga();
  try{
    if(!window.XLSX) await loadScript(XLSX_URL);
    const buf = await file.arrayBuffer();
    await new Promise(r => setTimeout(r, 30));
    const wb = XLSX.read(buf, {type:'array'});
    let aoa = null;
    const names = [...wb.SheetNames].sort((a,b) => (normH(b)==='HOJA1') - (normH(a)==='HOJA1'));
    for(const n of names){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null, blankrows:false});
      if(rows.length && rows[0] && rows[0].some(c=>normH(c)==='OBRA') && rows[0].some(c=>normH(c)==='STATUS PLANTA')){ aoa = rows; break; }
    }
    if(!aoa) throw new Error('No encontré la hoja de la BASE_ (encabezados OBRA y STATUS PLANTA en la primera fila).');
    const h = aoa[0].map(normH);
    const I = {}; h.forEach((x,i) => { if(I[x] === undefined) I[x] = i; });
    const vids = h.map((x,i) => x==='VIDRIO' ? i : -1).filter(i => i >= 0);
    const need = ['OBRA','ITEM','OP INSTALACION','STATUS PLANTA','DESPACHO','INSTALACION','PRECIO'];
    const faltan = need.filter(k => I[k] === undefined);
    if(faltan.length) throw new Error('Faltan columnas: '+faltan.join(', '));
    const items = [], com = [], st = {}, obras = new Set();
    let notasN = 0, inst = 0, descartadas = 0;
    for(let r = 1; r < aoa.length; r++){
      const row = aoa[r]; if(!row) continue;
      const g = k => I[k] === undefined ? null : row[I[k]];
      const obra = bTxt(g('OBRA'));
      if(!obra){ if(row.some(c => c!=null && String(c).trim()!=='')) descartadas++; continue; }
      const notas = [];
      let status = (bTxt(g('STATUS PLANTA'))||'EN COLA').toUpperCase();
      if(status === 'PRODUCCION') status = 'PRODUCCIÓN';
      const desp = (bTxt(g('DESPACHO'))||'').toUpperCase()==='SI' || status==='DESPACHADO';
      const ins = (bTxt(g('INSTALACION'))||'').toUpperCase()==='SI';
      const it = {
        obra, item:bTxt(g('ITEM')), ubicacion:bTxt(g('UBICACION')), sistema:bTxt(g('SISTEMA')), serie:bTxt(g('SERIE')),
        piso:bTxt(g('PISO')), diseno:bTxt(g('DISENO')), vidrio:bTxt(vids.length ? row[vids[0]] : null),
        ancho:bNum(g('ANCHO')), alto:bNum(g('ALTO')), m2:bNum(g('M2')), cant:bNum(g('CANT')),
        op:bTxt(g('OP')), op_instalacion:bTxt(g('OP INSTALACION')), fecha_op:bFecha(g('FECHA OP'),'fecha_op',notas),
        tiempo_op:bNum(g('TIEMPO OP')), puntos:bNum(g('PUNTOS')),
        cortado:bProc(g('CORTADO')), troquelado:bProc(g('TROQUELADO')), mecanizado:bProc(g('MECANIZADO')), programado:bProc(g('PROGRAMADO')),
        vidrio_proc:bProc(vids.length > 1 ? row[vids[1]] : null), prealistado:bProc(g('PREALISTADO')),
        ensamblador:bTxt(g('ENSAMBLADOR')),
        dia_inicio:bFecha(g('DIA INICIO'),'dia_inicio',notas), hora_inicio:bHora(g('HORA DE INICIO'),'hora_inicio',notas),
        dia_final:bFecha(g('DIA FINAL'),'dia_final',notas), hora_final:bHora(g('HORA FINAL'),'hora_final',notas),
        status, despachado:desp, fecha_despacho:bFecha(g('FECHA DESPACHO'),'fecha_despacho',notas), remision:bTxt(g('REMISION')),
        instalado:ins, fecha_instalacion:bFecha(g('FECHA INSTALACION'),'fecha_instalacion',notas), instalador:bTxt(g('INSTALADOR')),
        notas_importacion:null
      };
      if(!STATUS_OK.has(it.status)){ notas.push('status: '+it.status); it.status = deriveStatus(it); }
      if(notas.length){ it.notas_importacion = notas.join(' | '); notasN++; }
      items.push(it);
      com.push({precio:bNum(g('PRECIO')), cobrado_despacho:bSiNo(g('COBRADO PUESTO EN OBRA')), fecha_corte_despacho:bFecha(g('FECHA CORTE PUESTO EN OBRA')),
        num_corte_despacho:bCorte(g('# CORTE PUESTO EN OBRA')), cobrado_instalacion:bSiNo(g('COBRADO INSTALADO')),
        fecha_corte_instalacion:bFecha(g('FECHA CORTE INSTALADO')), num_corte_instalacion:bCorte(g('# CORTE INSTALADO'))});
      st[it.status] = (st[it.status]||0)+1; obras.add(obra); if(ins) inst++;
    }
    if(!items.length) throw new Error('El archivo no tiene filas con OBRA.');
    M.items = items; M.com = com;
    M.resumen = {n:items.length, st, inst, obras:obras.size, notas:notasN, descartadas};
    M.msg = 'Comparando con la base actual'; renderCarga();
    try{
      const act = S.anual || await API.anual();
      const ast = {}; let ainst = 0; const aob = new Set();
      for(const x of act){ ast[x.status] = (ast[x.status]||0)+1; if(x.instalado) ainst++; aob.add(x.obra); }
      M.actual = {n:act.length, st:ast, inst:ainst, obras:aob.size};
    }catch(e){ M.actual = null; }
    M.estado = 'revision';
  }catch(e){ M.estado = 'inicio'; toast(errMsg(e), true); }
  renderCarga();
}

async function migBackup(){
  if(M.actual && M.actual.n === 0){ M.backup = true; return renderCarga(); }
  const ok = await exportar('COPIA_SEGURIDAD');
  if(ok){ M.backup = true; renderCarga(); }
}

const mLog = t => { M.log.push(t); const el = document.querySelector('.mlog'); if(el) el.insertAdjacentHTML('beforeend', `<div>${esc(t)}</div>`); };
const mLast = t => { M.log[M.log.length-1] = t; const el = document.querySelector('.mlog'); if(el && el.lastChild) el.lastChild.textContent = t; };

async function migEjecutar(){
  if(!M.backup || normH(M.confirmTxt) !== 'REEMPLAZAR') return;
  M.estado = 'ejecutando'; M.log = []; M.error = null; renderCarga();
  try{ if(API.chan) await API.sb.removeChannel(API.chan); }catch(e){}
  const t0 = Date.now();
  try{
    mLog('Borrando la base actual…');
    const modo = await API.borrarTodo((n,max) => mLast(`Borrando la base actual (modo lento)… ${fmtN(n)} de ${fmtN(max)}`));
    mLast('✓ Base actual borrada' + (modo === 'lento' ? ' (modo lento: conviene crear la función vaciar_base, ver README)' : ''));
    mLog(`Cargando ítems… 0 de ${fmtN(M.items.length)}`);
    const ins = await API.insertItems(M.items, n => mLast(`Cargando ítems… ${fmtN(n)} de ${fmtN(M.items.length)}`), 500, 'id,obra,item,op_instalacion');
    // Emparejar los id nuevos con las filas del Excel (en orden; si algo no cuadra, por obra+ítem+OP)
    let ids = ins.map(r => r.id);
    const cuadra = ins.length === M.items.length && ins.every((r,i) => r.op_instalacion === M.items[i].op_instalacion && r.item === M.items[i].item && r.obra === M.items[i].obra);
    if(!cuadra){
      const pool = new Map();
      ins.forEach(r => { const k = r.obra+'|'+r.item+'|'+r.op_instalacion; if(!pool.has(k)) pool.set(k, []); pool.get(k).push(r.id); });
      ids = M.items.map(it => { const a = pool.get(it.obra+'|'+it.item+'|'+it.op_instalacion); return a && a.length ? a.shift() : null; });
    }
    mLast(`✓ ${fmtN(ins.length)} ítems cargados`);
    mLog('Cargando precios y cobros…');
    const com = M.com.map((c,i) => ({item_id: ids[i], ...c})).filter(c => c.item_id);
    for(let i=0; i<com.length; i+=1000){
      const {error} = await API.sb.from('items_comercial').insert(com.slice(i,i+1000)); if(error) throw error;
      mLast(`Cargando precios y cobros… ${fmtN(Math.min(i+1000, com.length))} de ${fmtN(com.length)}`);
    }
    mLast(`✓ ${fmtN(com.length)} registros de precios y cobros`);
    mLog('Actualizando la lista de ensambladores…');
    const ens = [...new Set(M.items.map(i => i.ensamblador && i.ensamblador.trim()).filter(Boolean))].map(nombre => ({nombre}));
    if(ens.length){ const {error} = await API.sb.from('ensambladores').upsert(ens, {onConflict:'nombre', ignoreDuplicates:true}); if(error) throw error; }
    try{ S.ensambladores = await API.ensambladores(); }catch(e){}
    mLast('✓ Ensambladores actualizados');
    mLog(`Listo en ${Math.round((Date.now()-t0)/1000)} segundos.`);
  }catch(e){
    M.error = errMsg(e);
  }
  S.obrasAll = null; S.anual = null; S.anualIdx = null; S.anualPos = null;
  try{ await loadActivos(); }catch(e){}
  API.realtime(onRemoteChange, st => { S.live = st === 'SUBSCRIBED'; });
  M.estado = 'listo'; M.confirmTxt = ''; M.backup = false;
  renderCarga();
}

// ════════════════════════════════════════════════════════════════
//  COBROS EN GRUPO (solo gerente)
// ════════════════════════════════════════════════════════════════
function sheetCobro(tipo){
  if(!registraCobros()) return;
  const k = tipo === 'd' ? 'despacho' : 'instalacion';
  const T = tipo === 'd' ? 'despacho' : 'instalación';
  const items = selItems();
  const aptos = items.filter(i => tipo === 'd' ? i.despachado : i.instalado);
  const noAptos = items.length - aptos.length;
  const ya = aptos.filter(i => com(i)['cobrado_'+k]).length;
  const valor = aptos.reduce((a,i) => a + (Number(com(i).precio)||0), 0);
  const sinPrecio = aptos.filter(i => com(i).precio == null).length;
  const body = `
    <div class="seg wide" id="cobModo"><button class="on" data-v="reg">Registrar cobro</button><button data-v="quitar">Quitar cobro</button></div>
    <div id="cobCampos" class="fgrid"><div class="field"><span class="lbl">Fecha corte</span><input type="date" id="gFecha" value="${today()}"></div>
      <div class="field"><span class="lbl"># Corte</span><input id="gCorte" placeholder="Ej. 5"></div></div>
    ${warn(noAptos, tipo==='d' ? 'no están despachados y se omitirán.' : 'no están instalados y se omitirán.')}
    ${warn(ya, 'ya tenían cobro de '+T+'; se reemplazará la fecha y el corte.')}
    <div class="summary">${fmtN(aptos.length)} ítems${vePrecio() ? ` · valor total <b>$${fmtN(valor)}</b>${sinPrecio ? ` · ${fmtN(sinPrecio)} sin precio` : ''}` : ''}</div>`;
  openSheet('Cobro de '+T, subSel(items.length), body, `Aplicar a ${fmtN(aptos.length)}`, async () => {
    if(!aptos.length){ toast('Ningún ítem seleccionado está '+(tipo==='d'?'despachado':'instalado'), true); return false; }
    const quitar = document.querySelector('#cobModo .on').dataset.v === 'quitar';
    let patch;
    if(quitar) patch = {['cobrado_'+k]:false, ['fecha_corte_'+k]:null, ['num_corte_'+k]:null};
    else {
      const f = $('#gFecha').value, n = $('#gCorte').value.trim();
      if(!f){ toast('Falta la fecha de corte', true); return false; }
      if(!n){ toast('Falta el número de corte', true); return false; }
      patch = {['cobrado_'+k]:true, ['fecha_corte_'+k]:f, ['num_corte_'+k]:n};
    }
    let rows;
    if(isGerente()) rows = await API.upsertComercial(aptos.map(i => ({item_id:i.id, ...patch})));
    else {
      await API.marcarCobros(aptos.map(i => i.id), k, !quitar, patch['fecha_corte_'+k], patch['num_corte_'+k]);
      rows = await API.cobros(aptos.map(i => i.id));
    }
    rows.forEach(r => S.com.set(r.item_id, r));
    S.sel.clear(); refreshAfterChange();
    toast(`✓ ${quitar ? 'Cobro quitado' : 'Cobro registrado'} en ${fmtN(rows.length)} ítems`);
  });
  document.querySelectorAll('#cobModo button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#cobModo button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('#cobCampos').style.display = b.dataset.v === 'quitar' ? 'none' : '';
    $('#shOk').textContent = (b.dataset.v === 'quitar' ? 'Quitar en ' : 'Aplicar a ') + fmtN(aptos.length);
  });
}

// ════════════════════════════════════════════════════════════════
//  SINCRONIZACIÓN
// ════════════════════════════════════════════════════════════════
function mergeRows(rows){
  S.plCache = null; S.cobPend = null; S.cobCortes = null; S.cobH = null;
  for(const r of rows){
    const i = S.items.findIndex(x => x.id === r.id);
    if(i >= 0) S.items[i] = {...S.items[i], ...r};
    const a = S.activos.findIndex(x => x.id === r.id);
    const full = i >= 0 ? S.items[i] : r;
    const activo = !(full.despachado && full.instalado);
    if(a >= 0){ if(activo) S.activos[a] = {...S.activos[a], ...pick(full)}; else S.activos.splice(a,1); }
    else if(activo && full.obra) S.activos.push(pick(full));
    if(S.anual){
      if(!S.anualPos){ S.anualPos = new Map(); S.anual.forEach((x,k) => S.anualPos.set(x.id,k)); }
      const k = S.anualPos.get(full.id);
      const v = {id:full.id, obra:full.obra, fecha_op:full.fecha_op, dia_inicio:full.dia_inicio, fecha_despacho:full.fecha_despacho, status:full.status, despachado:full.despachado, instalado:full.instalado};
      if(k != null) S.anual[k] = v; else if(full.obra){ S.anualPos.set(full.id, S.anual.length); S.anual.push(v); }
      S.anualIdx = null;
    }
  }
}
const pick = r => ({id:r.id, obra:r.obra, status:r.status, despachado:r.despachado, instalado:r.instalado, m2:r.m2, fecha_op:r.fecha_op, dia_inicio:r.dia_inicio, hora_inicio:r.hora_inicio, dia_final:r.dia_final, ensamblador:r.ensamblador, op:r.op, fecha_despacho:r.fecha_despacho});

function refreshAfterChange(){
  S.cobPend = null; S.cobCortes = null; S.cobH = null;
  if(S.view === 'obra'){
    const y = window.scrollY;
    renderChips(); renderList(); renderSelbar();
    if(S.detailId){ if(!S.draft || !S.draft._dirty) S.draft = draftOf(byId(S.detailId)); renderDetail(); }
    window.scrollTo(0, y);
  } else if(S.view === 'home') refreshHomeBox();
}

let rtTimer = null;
function onRemoteChange(p){
  const r = p.new && p.new.id ? p.new : null;
  if(p.eventType === 'DELETE'){ const id = p.old && p.old.id; S.items = S.items.filter(i=>i.id!==id); S.activos = S.activos.filter(i=>i.id!==id); }
  else if(r){
    if(p.eventType === 'INSERT' && r.obra === S.obra && !S.items.some(i=>i.id===r.id)) S.items.push(r);
    mergeRows([r]);
  }
  clearTimeout(rtTimer);
  rtTimer = setTimeout(() => {
    if(S.view === 'obra'){
      const y = window.scrollY; renderChips(); renderList(); window.scrollTo(0,y);
      if(S.detailId && S.draft && !S.draft._dirty){ S.draft = draftOf(byId(S.detailId)); renderDetail(); }
    } else if(S.view === 'home') refreshHomeBox();
  }, 400);
}

// ════════════════════════════════════════════════════════════════
//  EXPORTAR (solo gerente)
// ════════════════════════════════════════════════════════════════
function loadScript(src){ return new Promise((ok,ko) => { const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
async function exportar(prefijo){
  if(!vePrecio()) return false;
  if(typeof prefijo !== 'string') prefijo = 'BASE';
  toast('Preparando el Excel… puede tardar unos segundos');
  try{
    if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const rows = await API.exportar();
    if(!rows.length) return toast('La consulta no devolvió filas', true);
    const cols = Object.keys(rows[0]);
    const dateCols = cols.filter(c => /^(FECHA|DIA )/.test(c));
    const serial = s => { const [y,m,d] = s.split('-').map(Number); return (Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 864e5; };
    for(const r of rows) for(const c of dateCols) if(r[c]) r[c] = serial(r[c]);
    const ws = XLSX.utils.json_to_sheet(rows, {header:cols});
    const rng = XLSX.utils.decode_range(ws['!ref']);
    dateCols.forEach(c => { const ci = cols.indexOf(c); for(let R=1; R<=rng.e.r; R++){ const cell = ws[XLSX.utils.encode_cell({r:R,c:ci})]; if(cell && cell.t==='n') cell.z = 'dd/mm/yyyy'; } });
    ws['!cols'] = cols.map(c => ({wch: Math.max(10, Math.min(28, c.length+2))}));
    ws['!autofilter'] = {ref: ws['!ref']};
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Hoja1');
    XLSX.writeFile(wb, `${prefijo}_${today()}.xlsx`);
    toast(`✓ Exportados ${fmtN(rows.length)} registros`);
    if(isGerente()){
      try{ localStorage.setItem('ult_respaldo', new Date().toISOString()); }catch(e){}
      API.registrarRespaldo('app', rows.length).catch(()=>{}).finally(() => loadRespaldo());
    }
    return true;
  }catch(e){ toast('Error al exportar: '+errMsg(e), true); return false; }
}

// ── Copia de seguridad: aviso solo para el gerente ──
async function loadRespaldo(){
  if(!isGerente()) return;
  let r = null;
  try{ r = await API.ultimoRespaldo(); }
  catch(e){ try{ const t = localStorage.getItem('ult_respaldo'); r = t ? {cuando:t, origen:'app'} : null; }catch(_){ } }
  S.resp = r || {cuando:null};
  if(S.view === 'home') renderHome();
}
function respaldoHTML(){
  if(!isGerente() || !S.resp) return '';
  const c = S.resp.cuando ? new Date(S.resp.cuando) : null;
  const horas = c ? (Date.now() - c) / 36e5 : Infinity;
  const cuando = c ? c.toLocaleString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric', hour:'numeric', minute:'2-digit'}) : '';
  const origen = S.resp.origen === 'mac' ? 'automática en el Mac' : 'manual desde la app';
  if(horas < 26) return `<div class="resp ok">✓ Copia de seguridad ${cuando} · ${origen}</div>`;
  return `<div class="resp warn"><div><b>Copia de seguridad pendiente.</b> ${c ? `La última fue el ${cuando} (${origen}).` : 'Aún no hay ninguna copia registrada.'}</div>
    <button class="btn sm primary" onclick="exportar('COPIA_SEGURIDAD')">${ICON.down} Hacer copia ahora</button></div>`;
}

// ════════════════════════════════════════════════════════════════
//  MENSAJES
// ════════════════════════════════════════════════════════════════
function errMsg(e){
  const m = (e && (e.message||e.error_description)) || String(e);
  if(/Sin permiso/.test(m)) return 'Sin permiso para modificar los datos de la OP.';
  if(/JWT|token/i.test(m)) return 'Tu sesión expiró. Vuelve a ingresar.';
  if(/fetch|network/i.test(m)) return 'Sin conexión. Revisa el internet e intenta de nuevo.';
  return m;
}
let toastT = null;
function toast(msg, err){
  let el = $('#toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.className = 'toast'+(err?' err':''); el.textContent = msg; el.style.display='';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display='none', err ? 4500 : 2600);
}
let wideMode = window.innerWidth >= 1100;
window.addEventListener('resize', () => { const w = window.innerWidth >= 1100; if(w !== wideMode){ wideMode = w; if(S.view==='obra' && S.detailId) renderDetail(); } });

if('serviceWorker' in navigator && !window.__DEMO__ && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
// Avisar cuando hay versión nueva publicada (la ventana del Mac puede quedar abierta días sin recargarse)
async function buscarVersion(){
  if(window.__DEMO__ || document.getElementById('nuevaVer')) return;
  try{
    const t = await (await fetch('index.html?v=' + Date.now(), {cache: 'no-store'})).text();
    const m = t.match(/APP_VERSION = '([^']+)'/); if(!m || m[1] === APP_VERSION) return;
    const d = document.createElement('div'); d.id = 'nuevaVer';
    d.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--cola);color:#000;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.5)';
    d.innerHTML = `<span>Hay una versión nueva de la app (<b>v${esc(m[1])}</b>)</span><button class="btn sm" style="background:#000;color:var(--cola)" onclick="actualizarApp()">Actualizar</button>`;
    document.body.appendChild(d);
  }catch(e){}
}
async function actualizarApp(){
  if(S.draft && S.draft._dirty && !confirm('Tienes cambios sin guardar en el ítem abierto. ¿Descartarlos?')) return;
  try{ const rs = await navigator.serviceWorker?.getRegistrations?.() || []; await Promise.all(rs.map(r => r.update().catch(() => {}))); }catch(e){}
  try{ const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }catch(e){}
  location.reload();
}
setTimeout(buscarVersion, 8000); setInterval(buscarVersion, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') buscarVersion(); });
window.addEventListener('focus', buscarVersion);
document.addEventListener('DOMContentLoaded', boot);
</script>
