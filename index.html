<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registro">
<meta name="theme-color" content="#181818">
<title>Registro de Producción</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/ios-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/ios-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/ios-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/ios-152.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icons/ios-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/logo-32.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181818;--surface:#222222;--surface2:#272727;--surface3:#2f2f2f;--border:#3a3a3a;--border2:#4a4a4a;
  --text:#f0f0f0;--text2:#c0c0c0;--muted:#8a8a8a;--dim:#5e5e5e;
  --cola:#c8a84b;--prod:#555555;--ens:#888888;--desp:#e8e8e8;--inst:#9db39a;--danger:#d0705f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --mono:'DM Mono',ui-monospace,monospace;--sans:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);min-height:100%;overscroll-behavior-y:none;}
body{font-family:var(--mono);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(135deg,rgba(255,255,255,.015) 0%,transparent 60%),
  repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.015) 60px,rgba(255,255,255,.015) 61px);}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
input,select{font-family:var(--mono);font-size:16px;color:var(--text);background:var(--surface3);border:1px solid var(--border);border-radius:0;padding:10px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none;min-height:44px;}
input:focus,select:focus{border-color:var(--text2);}
input[type=date],input[type=time]{min-width:0;}
input[readonly]{background:transparent;font-weight:600;letter-spacing:.04em;}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
.hidden{display:none!important;}
.lbl{font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.mono{font-family:var(--mono);}

/* ── Botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--border2);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;}
.btn:hover{border-color:var(--text2);}
.btn:active{transform:scale(.98);}
a.btn{color:var(--text);}
.btn.primary{background:var(--text);color:#181818;border-color:var(--text);}
.btn.primary:hover{background:#fff;}
.btn.primary:disabled{background:var(--surface3);color:var(--dim);border-color:var(--border);cursor:default;}
.btn.ghost{border-color:transparent;color:var(--text2);}
.btn.sm{min-height:34px;padding:0 12px;font-size:11px;}
.btn svg{width:15px;height:15px;flex-shrink:0;}

/* ── Login ── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 24px) 20px calc(var(--sb) + 24px);}
.login-box{width:100%;max-width:380px;}
.login-box .brand{margin-bottom:44px;}
.login-box form{display:flex;flex-direction:column;gap:14px;}
.login-err{color:var(--danger);font-size:13px;min-height:18px;}

/* ── Marca ── */
.brand{display:flex;align-items:center;gap:14px;}
.brand svg{width:40px;height:31px;flex-shrink:0;}
.brand-name{font-family:var(--sans);font-weight:300;font-size:26px;letter-spacing:.3em;line-height:1;text-transform:uppercase;}
.brand-name sup{font-size:10px;letter-spacing:0;opacity:.6;margin-left:1px;}
.brand-sub{font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:6px;}

/* ── Encabezado ── */
.top{position:sticky;top:0;z-index:20;background:rgba(24,24,24,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(var(--st) + 12px) calc(var(--sr) + 18px) 12px calc(var(--sl) + 18px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;}
.top .brand-name{font-size:20px;}
.top .brand svg{width:32px;height:25px;}
.top-r{display:flex;align-items:center;gap:8px;}
.who{text-align:right;font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--text2);}
.who .rol{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);color:var(--text2);}
.icon-btn:hover{border-color:var(--text2);color:var(--text);}
.icon-btn svg{width:18px;height:18px;}

main{padding:18px calc(var(--sr) + 18px) calc(var(--sb) + 110px) calc(var(--sl) + 18px);max-width:1600px;margin:0 auto;}

/* ── Inicio: obras ── */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.h1{font-family:var(--sans);font-weight:300;font-size:24px;letter-spacing:.2em;text-transform:uppercase;}
.h1-sub{color:var(--muted);font-size:12px;margin-top:4px;}
.search{position:relative;flex:1;max-width:420px;min-width:220px;}
.search input{padding-left:40px;}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.legend span{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.legend i{width:10px;height:10px;display:inline-block;}
.grid-obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.obra-card{background:var(--surface);border:1px solid var(--border);padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;position:relative;transition:border-color .15s;}
.obra-card:hover{border-color:var(--border2);}
.obra-card:active{transform:scale(.99);}
.obra-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--text);opacity:.5;}
.oc-name{font-family:var(--sans);font-weight:500;font-size:16px;letter-spacing:.12em;text-transform:uppercase;}
.oc-meta{color:var(--muted);font-size:12px;margin-top:3px;}
.bar{display:flex;height:6px;background:var(--surface3);overflow:hidden;}
.bar i{display:block;height:100%;}
.oc-nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.oc-nums div{display:flex;flex-direction:column;gap:2px;}
.oc-nums b{font-size:18px;font-weight:500;}
.oc-nums span{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.section-t{font-family:var(--sans);font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:10px;}
.section-t::after{content:'';flex:1;height:1px;background:var(--border);}
.other-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;}
.other-list button{background:var(--surface);border:1px solid var(--border);padding:12px 14px;text-align:left;display:flex;justify-content:space-between;gap:8px;font-size:13px;}
.other-list button span{color:var(--muted);}
.st-tiles.cob-tiles{grid-template-columns:repeat(2,1fr);}
.cob-tools{display:flex;gap:6px;justify-content:flex-end;padding:6px 10px;border-bottom:1px solid var(--border);}
.cob-op{cursor:pointer;}
.cob-op .o{display:flex;align-items:center;gap:10px;}
.cob-ck{width:20px;height:20px;border:1px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.cob-ck svg{width:14px;height:14px;}
.cob-op.on{background:rgba(200,168,75,.08);}
.cob-op.on .cob-ck{background:var(--cola);border-color:var(--cola);color:#181818;}
.cob-its{color:var(--text2)!important;font-size:12px!important;line-height:1.45;white-space:normal;word-break:break-word;}
.cob-its b{font-family:var(--mono);font-weight:400;color:var(--text);}
.cob-its i{font-style:normal;color:var(--cola);font-family:var(--mono);}
.cob-cortes{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);}
.cob-cortes .lbl{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.cob-cortes select{flex:1;min-width:0;min-height:44px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);padding:0 10px;font:inherit;font-size:14px;}
.cob-hq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);}
.cob-hq .search{flex:1 1 220px;min-width:0;}
.cob-opH{background:var(--surface2);}
.cob-it{padding-left:28px;}
.cob-it .ci{font-family:var(--mono);font-weight:400;color:var(--text);}
.cob-it .o{white-space:normal;}
.pl-row .k.sm{font-size:12px;color:var(--text2);}
.cob-res{font-size:12.5px;line-height:1.6;color:var(--text2);max-height:220px;overflow:auto;border:1px solid var(--border);padding:8px 10px;margin-top:10px;}
.btn-orden{display:inline-flex;align-items:center;gap:6px;}
#ordenBox:empty{display:none;}
#ordenBox{display:flex;align-items:center;grid-column:1/-1;}
.cob-nuevo{color:var(--cola);}
.cob-det{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--text2);margin:10px 0;max-height:38vh;overflow:auto;}
.cob-det .cob-nuevo{margin-top:2px;}
.cob-ver{color:var(--text2);text-decoration:underline;text-underline-offset:2px;}
.cob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:8px;}
.cob-ob{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);padding:14px;text-align:left;}
.cob-ob:hover{border-color:var(--border2);}
.cob-ob .cn{font-family:var(--sans);font-weight:500;font-size:14px;letter-spacing:.1em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cob-ob .cv{display:flex;flex-direction:column;align-items:flex-end;min-width:44px;}
.cob-ob .cv b{font-size:18px;font-weight:500;line-height:1.1;}
.cob-ob .cv small{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
.st-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:18px;}
@media(max-width:900px){.st-tiles{grid-template-columns:1fr 1fr;}.st-tiles .st-tile:last-child{grid-column:1/-1;}}
@media(max-width:900px){.st-tiles.cob-tiles .st-tile:last-child{grid-column:auto;}}
.seg-modo{display:inline-flex;border:1px solid var(--border);margin:0 0 12px;}
.seg-modo button{min-height:40px;padding:0 16px;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.seg-modo button.on{background:var(--text);color:#181818;}
.per-rango{display:flex;gap:10px;margin:-2px 0 12px;max-width:440px;}
.per-rango label{flex:1;display:flex;flex-direction:column;gap:4px;}
.st-tile{background:var(--surface);border:1px solid var(--border);padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-height:96px;transition:border-color .15s,background .15s;}
.st-tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c);}
.st-tile .t{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.st-tile b{font-size:28px;font-weight:500;line-height:1;}
.st-tile span{font-size:12px;color:var(--muted);}
.st-tile.on{background:var(--surface3);border-color:var(--text2);}
.st-tile.on .t{color:var(--text);}
.pr-tiles{grid-template-columns:repeat(6,1fr);}
@media(max-width:900px){.pr-tiles{grid-template-columns:1fr 1fr 1fr;}.pr-tiles .st-tile:last-child{grid-column:auto;}}
@media(max-width:520px){.pr-tiles{grid-template-columns:1fr 1fr;}}
.pr-chart{overflow-x:auto;background:var(--surface);border:1px solid var(--border);padding:10px 10px 4px;}
.pr-bar{fill:var(--inst);}.pr-base{stroke:var(--border);stroke-width:1;}.pr-dom{fill:var(--muted);opacity:.4;}
.pr-ax{font-size:10px;fill:var(--muted);font-family:var(--mono);}.pr-val{font-size:10px;fill:var(--text2);font-family:var(--mono);}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px;align-items:start;}
@media(max-width:520px){.pl-grid{grid-template-columns:1fr;}}
.pl-card{background:var(--surface);border:1px solid var(--border);}
.pl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);}
.pl-head .n{font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:.12em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-head .n.sin{color:var(--cola);}
.pl-head .m{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;max-width:55%;}
.pl-card{min-width:0;}
.pl-head .m b{color:var(--text);font-weight:500;font-size:15px;}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);}
.pl-row:last-child{border-bottom:0;}
.pl-row:hover{background:var(--surface2);}
.pl-row .o{font-size:13px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-row .o em{font-style:normal;color:var(--text2);font-family:var(--mono);}
.pl-row .k{font-family:var(--mono);font-size:14px;text-align:right;}
.pl-row .d{grid-column:1/-1;font-size:11.5px;color:var(--muted);}
.pl-row .d .old{color:var(--cola);}
.empty{color:var(--muted);padding:40px 10px;text-align:center;font-size:13px;}

/* ── Vista de obra ── */
.obra-layout{display:block;}
@media(min-width:1100px){.obra-layout.with-detail{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start;}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;min-height:36px;}
.back:hover{color:var(--text);}
.obra-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 14px;}
.obra-title .h1{font-size:26px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border:1px solid var(--border);font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.chip b{font-family:var(--mono);font-weight:500;color:var(--text2);letter-spacing:0;}
.chip i{width:8px;height:8px;display:inline-block;}
.chip.on{background:var(--text);border-color:var(--text);color:#181818;}
.chip.on b{color:#181818;}
.filters{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px 160px;gap:8px;margin:10px 0 12px;}
@media(max-width:899px){.filters{grid-template-columns:1fr 1fr 1fr;}.filters .search{grid-column:1/-1;max-width:none;}}
@media(max-width:520px){.filters{grid-template-columns:1fr 1fr;}.filters #fAnio{grid-column:1/-1;}}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin:-4px 0 18px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs .tab{flex-shrink:0;}
.tabs .tab{font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:12px 0;min-height:44px;border-bottom:1px solid transparent;margin-bottom:-1px;}
.tabs .tab.on{color:var(--text);border-bottom-color:var(--text);}
.filters .search{max-width:none;}
.msel{font-family:var(--mono);font-size:14px;color:var(--text);background:var(--surface3);border:1px solid var(--border);padding:10px 12px;min-height:44px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.list-head .lbl b{color:var(--text2);font-family:var(--mono);letter-spacing:0;}

.list{display:flex;flex-direction:column;}
.row{display:grid;align-items:center;column-gap:12px;row-gap:4px;padding:10px 6px 10px 0;border-bottom:1px solid var(--border);cursor:pointer;position:relative;
  grid-template-columns:44px minmax(110px,150px) 104px 54px minmax(140px,1fr) 186px minmax(110px,150px) 118px;
  grid-template-areas:"ck item op piso dis proc ens st";}
.row:hover{background:rgba(255,255,255,.025);}
.row.sel{background:rgba(200,168,75,.07);}
.row.open{background:rgba(255,255,255,.05);}
.row.open::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--text);}
.pf input{text-transform:uppercase;}
.resp{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-4px 0 16px;font-size:12.5px;color:var(--muted);}
.resp.ok{color:var(--inst);}
.resp.warn{border:1px solid var(--cola);background:rgba(200,168,75,.08);padding:12px 14px;color:var(--text2);}
.resp.warn b{color:var(--cola);font-weight:500;}
.u-list{display:flex;flex-direction:column;gap:8px;max-width:980px;}
.u-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--border);padding:10px 12px;}
.u-mail{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
.u-mail span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.u-mail span.nuevo{color:var(--cola);}
@media(max-width:760px){.u-row{grid-template-columns:1fr 1fr;}.u-mail{grid-column:1/-1;}}
.h-list{max-width:980px;}
.h-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.h-t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;}
.h-w{font-size:13px;}.h-w span{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:4px;}
.h-w .h-cob{color:var(--cola);}
.h-i{font-size:12.5px;color:var(--text2);margin:2px 0 4px;}
.h-c{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text2);}
.h-c s{color:var(--dim);}.h-c b{color:var(--text);font-weight:500;}
.anular{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--border);padding:10px 12px;margin-top:12px;font-size:12.5px;color:var(--text2);}
.sc-est{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.sc-params{max-width:720px;margin-bottom:14px;}
.sc-params:empty{display:none;}
.sc-note{font-size:12px;color:var(--muted);margin-top:6px;}

// ── Peso: m² × (calibre del vidrio + 1 mm por los demás componentes) × 2,5 kg por mm·m² ──
// Laminado 3+3 = 6 mm; templado / crudo = su calibre. El +1 mm cubre aluminio, herrajes, empaques…
function calibreVidrio(txt){
  let t = String(txt || '').toUpperCase().replace(/,/g, '.').trim();
  if(!t) return null;
  let m = t.match(/\((\d{1,2}(?:\.\d)?)\s*MM\)/); if(m) return {mm: +m[1], aprox: false};
  t = t.replace(/\d*PVB[\s.]*\d*(?:\.\d+)?/g, ' ');                       // el PVB no cuenta
  const suma = s => [...s.matchAll(/(?<![\d.])(\d{1,2}(?:\.\d)?)(?![\d.])/g)].reduce((a, x) => a + +x[1], 0);
  if(/^D\.?\s*A\b/.test(t) || t.includes('/')){                                  // doble vidrio: se quita la cámara
    const v = suma(t.replace(/ESP\s*[\d.]+/g, ' ').replace(/\/\s*[\d.]+\s*\//g, '/'));
    if(v) return {mm: v, aprox: false};
  }
  const N = '(\\d{1,2}(?:\\.\\d)?)';
  m = t.match(new RegExp(N + '\\s*(?:MM)?\\s*\\+[A-Z .+]*?' + N + '(?:\\s*(?:MM)?\\s*[A-Z .]*\\+[A-Z .]*?' + N + '(?![\\d.]))?'));
  if(m) return {mm: +m[1] + +m[2] + (m[3] ? +m[3] : 0), aprox: false};
  m = t.match(new RegExp(N + '\\s*MM'));
  if(m){ const v = +m[1]; return /^LAM/.test(t) ? {mm: 2 * v, aprox: true} : {mm: v, aprox: false}; }
  m = t.match(/^LAM.*?(?<![\d.])(\d{1,2})$/); if(m) return {mm: 2 * +m[1], aprox: true};
  return null;
}

  if(!c || !(m2 > 0)) return null; return m2 * (c.mm + 1) * 2.5 * (Number(it.cant) || 1); };

  async all(mk){
    const first = await mk({count:'exact'}).range(0,999);
    if(first.error) throw first.error;
    let out = first.data || [];
    if(first.count == null){   // sin conteo: seguir pidiendo hasta que llegue una página incompleta
      for(let f=1000, last=out.length; last===1000; f+=1000){
        const r = await mk().range(f, f+999); if(r.error) throw r.error;
        out = out.concat(r.data); last = r.data.length;
      }
      return out;
    }
    const total = first.count;
    const ranges = [];
    for(let f=1000; f<total; f+=1000) ranges.push(f);
    for(let i=0; i<ranges.length; i+=6){
      const rs = await Promise.all(ranges.slice(i,i+6).map(f => mk().range(f, f+999)));
      for(const r of rs){ if(r.error) throw r.error; out = out.concat(r.data); }
    }
    return out;

    }
    return out;
  },
  exportar(){ return this.all(o => this.sb.from('base_exportable').select('*',o)); },
  // ── Precios y cobros (solo gerente) ──
  async comercial(ids){
    let out = [];
    for(let i=0; i<ids.length; i+=200){
      const {data,error} = await this.sb.from('items_comercial').select('*').in('item_id', ids.slice(i,i+200));
      if(error) throw error; out = out.concat(data);
    }
    return out;
  },
  async cobros(ids){
    let out = [];
    for(let i=0; i<ids.length; i+=200){
      const {data,error} = await this.sb.from('items_cobros').select('*').in('item_id', ids.slice(i,i+200));
      if(error) throw error; out = out.concat(data);
    }
    return out;
  },
  async marcarCobros(ids, tipo, cobrado, fecha, num){
    const {data,error} = await this.sb.rpc('marcar_cobros', {p_ids:ids, p_tipo:tipo, p_cobrado:cobrado, p_fecha:fecha||null, p_num:num||null});
    if(error) throw error; return data;
  },
  async upsertComercial(rows){
    let out = [];
    for(let i=0; i<rows.length; i+=500){
      const {data,error} = await this.sb.from('items_comercial').upsert(rows.slice(i,i+500), {onConflict:'item_id'}).select('*');
      if(error) throw error; out = out.concat(data||[]);
    }
    return out;
  },
  // ── Carga de OPs (solo gerente) ──
  async existentes(ops){
    const out = new Set();
    for(let i=0; i<ops.length; i+=100){
      const {data,error} = await this.sb.from('items').select('op_instalacion').in('op_instalacion', ops.slice(i,i+100));
      if(error) throw error; data.forEach(r => out.add(r.op_instalacion));
    }
    return out;
  },
  async insertItems(rows, onProgress, size=500, cols='id,op_instalacion'){
    let out = [];
    for(let i=0; i<rows.length; i+=size){
      const {data,error} = await this.sb.from('items').insert(rows.slice(i,i+size)).select(cols);
      if(error){ error.parcial = out; throw error; }
      out = out.concat(data); onProgress && onProgress(out.length);
    }
    return out;
  },
  async insertComercial(rows){
    for(let i=0; i<rows.length; i+=500){ const {error} = await this.sb.from('items_comercial').insert(rows.slice(i,i+500)); if(error) throw error; }
  },
  async borrarTodo(onProgress){
    // Vía rápida: función de la base (solo gerente) que vacía las tablas de una vez.
    const rpc = await this.sb.rpc('vaciar_base');
    if(!rpc.error) return 'rapido';
    const faltaFn = /vaciar_base|could not find|schema cache|404/i.test((rpc.error.message||'')+(rpc.error.code||''));
    if(!faltaFn) throw rpc.error;
    // Vía lenta (respaldo): bloques pequeños.
    const {data,error} = await this.sb.from('items').select('id').order('id',{ascending:false}).limit(1);
    if(error) throw error;
    const max = data.length ? data[0].id : 0;
    const paso = 500;
    for(let a=0; a<=max; a+=paso){
      const r = await this.sb.from('items').delete().gte('id',a).lt('id',a+paso);
      if(r.error) throw r.error;
      onProgress && onProgress(Math.min(a+paso, max), max);
    }
    return 'lento';
  },
  async deleteItems(ids){
    for(let i=0; i<ids.length; i+=150){ const {error} = await this.sb.from('items').delete().in('id', ids.slice(i,i+150)); if(error) throw error; }
  },
  realtime(cb, status){
    this.chan = this.sb.channel('items-cambios')
      .on('postgres_changes', {event:'*', schema:'public', table:'items'}, p => cb(p))
      .subscribe(s => status && status(s));
  }
};

async function marcarEntregada(obra, cerrar){
  if(!isGerente()) return;
  if(!confirm(cerrar ? `¿Marcar ${obra} como ENTREGADA (contrato cerrado)?\n\nDeja de aparecer en Obras activas, Planta y Por entregar. Los ítems no cambian y se puede reabrir.` : `¿Reabrir ${obra}? Vuelve a aparecer con sus pendientes.`)) return;

  catch(e){ return toast(/obras_cerradas|42P01|PGRST205/.test(errMsg(e) + (e.code || '')) ? 'Falta activar esta opción en la base (SQL 33)' : errMsg(e), true); }
  await loadActivos(); toast(cerrar ? '✓ ' + obra + ' marcada como entregada' : '✓ ' + obra + ' reabierta');
  if(S.view === 'obra') renderObra(); else renderHome();
}

function resumenObras(){
  const m = new Map();
  for(const it of S.activos){
    let o = m.get(it.obra);
    if(!o){ o = {obra:it.obra, n:0, 'EN COLA':0, 'PRODUCCIÓN':0, 'ENSAMBLADO':0, 'DESPACHADO':0, porDesp:0, porInst:0}; m.set(it.obra,o); }
    o.n++;
    const st = it.despachado ? 'DESPACHADO' : (it.status||'EN COLA');
    o[st] = (o[st]||0)+1;
    if(!it.despachado) o.porDesp++;
    if(!it.instalado) o.porInst++;
  }
  // Por entregar: solo de las obras activas (las ya cerradas no aparecen aquí)
  for(const it of (S.porEnt || [])){ const o = m.get(it.obra); if(o) o.porEnt = (o.porEnt || 0) + 1; }
  return [...m.values()].sort((a,b) => nat(a.obra,b.obra));
}

// Resumen por año (de la FECHA OP) de TODA la base
function indiceAnual(){
  if(S.anualIdx) return S.anualIdx;
  const byYear = new Map(), obraYears = new Map();
  for(const it of S.anual){
    const y = yearOf(it);
    if(!obraYears.has(it.obra)) obraYears.set(it.obra, new Set());
    obraYears.get(it.obra).add(y);
    if(!byYear.has(y)) byYear.set(y, new Map());
    const m = byYear.get(y);
    let o = m.get(it.obra);
    if(!o){ o = {obra:it.obra, n:0, cola:0, planta:0, desp:0, inst:0}; m.set(it.obra, o); }
    o.n++;
    if(it.instalado) o.inst++;
    else if(it.despachado) o.desp++;
    else if((it.status||'EN COLA') === 'EN COLA') o.cola++;
    else o.planta++;
  }
  const years = [...byYear.keys()].sort((a,b) => a==='S/F' ? 1 : b==='S/F' ? -1 : b.localeCompare(a))
    .map(y => ({y, n:[...byYear.get(y).values()].reduce((a,o)=>a+o.n,0), obras:byYear.get(y).size}));
  return S.anualIdx = {years, byYear, obraYears};
}

const PL_ST = [
  ['EN COLA',    'En cola',          'Sin ensamblador asignado'],
  ['PRODUCCIÓN', 'En ensamble',      'Con ensamblador, sin terminar'],
  ['ENSAMBLADO', 'Ensamblado',       'Terminado, por despachar'],
  ['DESPACHADO', 'Por instalar',     'Despachado sin instalar'],
  ['ENTREGAR',   'Por entregar',     'Instalado sin acta de entrega'],
  ['INSTALADO',  'Instalado',        'Instalado en el periodo']
];
// Periodos para ver lo ensamblado / instalado por fecha
const PERIODOS = [['hoy','Hoy'],['ayer','Ayer'],['7d','Últimos 7 días'],['mes','Este mes'],['rango','Elegir fechas']];
const addDays = (f, n) => { const d = new Date(f+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
function rangoPer(){
  const p = S.plPer || (S.plPer = {k:'hoy'}), t = today();
  if(p.k === 'ayer') return [addDays(t,-1), addDays(t,-1)];
  if(p.k === '7d') return [addDays(t,-6), t];
  if(p.k === 'mes') return [t.slice(0,8)+'01', t];
  if(p.k === 'rango'){ const a = p.d1 || t, b = p.d2 || a; return a <= b ? [a,b] : [b,a]; }
  return [t, t];
}
function perLabel(){ const [a,b] = rangoPer(); const k = S.plPer.k;
  return k==='hoy' ? 'hoy' : k==='ayer' ? 'ayer' : a===b ? 'el '+fmtD(a) : `del ${fmtD(a)} al ${fmtD(b)}`; }
const perRefresh = () => S.homeTab === 'procesos' ? renderProcesosBox() : renderPlantaBox();
function setPer(k){ S.plPer = {...(S.plPer||{}), k}; if(k==='rango' && !S.plPer.d1){ S.plPer.d1 = addDays(today(),-6); S.plPer.d2 = today(); } perRefresh(); }
function setPerFecha(i, v){ if(!v) return; S.plPer['d'+i] = v; perRefresh(); }
function setEnsModo(m){ S.plEnsModo = m; renderPlantaBox(); }
// Consulta por fecha (todas las obras, incluidas las terminadas); se guarda hasta el próximo cambio
async function plFecha(campo){
  const [a,b] = rangoPer(), key = campo+'|'+a+'|'+b;
  S.plCache = S.plCache || {};
  if(S.plCache[key]) return S.plCache[key].rows || null;
  S.plCache[key] = {loading:true};
  try{ S.plCache[key].rows = await API.porFecha(campo, a, b); }
  catch(e){ delete S.plCache[key]; toast('Error: '+errMsg(e), true); return null; }
  if(S.view === 'home' && S.homeTab === 'planta') renderPlantaBox();
  return null;
}
const plFechaYa = campo => { const [a,b] = rangoPer(); const c = S.plCache && S.plCache[campo+'|'+a+'|'+b]; return c && c.rows; };
function perBar(){
  const p = S.plPer;
  return `<div class="chips" style="margin:0 0 12px">${PERIODOS.map(([k,t]) => `<button class="chip ${p.k===k?'on':''}" onclick="setPer('${k}')">${t}</button>`).join('')}</div>
    ${p.k==='rango' ? `<div class="per-rango"><label><span class="lbl">Desde</span><input type="date" value="${p.d1||''}" max="${today()}" onchange="setPerFecha(1,this.value)"></label>
      <label><span class="lbl">Hasta</span><input type="date" value="${p.d2||''}" max="${today()}" onchange="setPerFecha(2,this.value)"></label></div>` : ''}`;
}
const plStage = it => it.despachado ? (it.instalado ? null : 'DESPACHADO') : (it.status || 'EN COLA');
const diasDesde = f => { if(!f) return null; const d = Math.floor((Date.parse(today()) - Date.parse(f)) / 864e5); return isNaN(d) ? null : d; };
const diasTxt = d => d == null ? '' : d <= 0 ? 'hoy' : d === 1 ? 'hace 1 día' : `hace ${fmtN(d)} días`;

function renderPlanta(){
  if(!S.plSt) S.plSt = 'PRODUCCIÓN';
  $('#app').innerHTML = shell(`${respaldoHTML()}
    <div class="tabs">${homeTabs()}</div>
    <div class="home-head">
      <div><div class="h1">Planta</div><div class="h1-sub">Todas las obras · toca un estado para ver el detalle · ${liveHTML()}</div>${puedeRegistrar() ? `<button class="btn sm ghost" style="margin-top:8px" onclick="odLista()">Órdenes de despacho pendientes</button>` : ''}</div>
      <div class="search">${ICON.search}<input id="qObra" placeholder="Buscar obra, OP, ensamblador o instalador…" value="${esc(S.q)}" autocomplete="off" autocapitalize="characters"></div>
    </div>
    <div class="st-tiles" id="stTiles"></div>
    <div id="obrasBox"></div>`);
  const inp = $('#qObra');
  inp.oninput = () => { S.q = inp.value; renderPlantaBox(); };
  renderPlantaBox();
}
function setPlSt(k){ S.plSt = k; renderPlantaBox(); }

function renderPlantaBox(){
  if(!S.plPer) S.plPer = {k:'hoy'};
  const by = {}; for(const [k] of PL_ST) by[k] = [];
  for(const it of S.activos){ const k = plStage(it); if(k && by[k]) by[k].push(it); }
  by['ENTREGAR'] = (S.porEnt || []).slice();
  const inst = plFechaYa('fecha_instalacion');
  if(!inst) plFecha('fecha_instalacion');
  const tiles = $('#stTiles');
  if(tiles) tiles.innerHTML = PL_ST.map(([k,t,d]) => {
    const l = k === 'INSTALADO' ? inst : by[k];
    const sub = !l ? 'Cargando…' : `${fmtN(new Set(l.map(i=>i.obra)).size)} obra${new Set(l.map(i=>i.obra)).size===1?'':'s'} · ${fmtN(l.reduce((a,i)=>a+(Number(i.m2)||0),0),1)} m²`;
    return `<button class="st-tile ${S.plSt===k?'on':''}" style="--c:${STAGES[k].c}" onclick="setPlSt('${k}')">
      <span class="t">${t}${k==='INSTALADO' ? ' · '+perLabel() : ''}</span><b>${l ? fmtN(l.length) : '—'}</b><span>${sub}</span></button>`;
  }).join('');
  const box = $('#obrasBox'); if(!box) return;
  const q = S.q.trim().toUpperCase();
  const okQ = it => !q || [it.obra, it.op, it.ensamblador, it.instalador, it.remision].some(v => v && String(v).toUpperCase().includes(q));
  const desc = PL_ST.find(x => x[0]===S.plSt);
  let h = '';
  // Ensamblado e Instalado: por fecha
  const ensFecha = S.plSt === 'ENSAMBLADO' && S.plEnsModo === 'fecha';
  if(S.plSt === 'ENSAMBLADO') h += `<div class="seg-modo"><button class="${ensFecha?'':'on'}" onclick="setEnsModo('pend')">Por despachar</button><button class="${ensFecha?'on':''}" onclick="setEnsModo('fecha')">Ensamblado por fecha</button></div>`;
  if(ensFecha || S.plSt === 'INSTALADO'){
    const campo = ensFecha ? 'dia_final' : 'fecha_instalacion';
    h += perBar();
    const rows = plFechaYa(campo);
    if(!rows){ plFecha(campo); box.innerHTML = h + '<div class="loading"><div class="spin"></div>Buscando</div>'; return; }
    const list = rows.filter(okQ);
    const m2 = list.reduce((a,i)=>a+(Number(i.m2)||0),0);
    h += `<div class="section-t">${ensFecha ? 'Ensamblado' : 'Instalado'} ${perLabel()} · ${fmtN(list.length)} ítem${list.length===1?'':'s'} · ${fmtN(m2,1)} m²</div>`;
    if(!list.length){ box.innerHTML = h + `<div class="empty">No hay ítems ${ensFecha?'ensamblados':'instalados'} ${perLabel()}${q ? ' que coincidan con “'+esc(S.q)+'”' : ''}.</div>`; return; }
    box.innerHTML = h + plPorPersona(list, ensFecha ? 'ensamblador' : 'instalador', campo);
    return;
  }
  const list = by[S.plSt].filter(okQ);
  h += `<div class="section-t">${desc[1]} · ${desc[2]}</div>`;
  if(!list.length){ box.innerHTML = h + `<div class="empty">No hay ítems${q ? ' que coincidan con “'+esc(S.q)+'”' : ''} en este estado.</div>`; return; }
  h += S.plSt === 'PRODUCCIÓN' ? plPorEnsamblador(list) : plPorObra(list, S.plSt);
  box.innerHTML = h;
}

// Lo ensamblado / instalado en el periodo, agrupado por persona → obra · OP
function plPorPersona(list, quien, campo){
  const [a,b] = rangoPer(), varios = a !== b;
  const g = [...grp(list, it => (it[quien]||'').trim()).entries()].sort((x,y) => (x[0]==='') - (y[0]==='') || y[1].length - x[1].length || nat(x[0], y[0]));
  const lbl = (quien==='ensamblador' ? 'Ensamblado ' : 'Instalado ') + perLabel();
  return `<div class="pl-grid">${g.map(([per, items]) => {
    const filas = [...grp(items, it => it.obra + '\u0001' + (it.op||'')).values()]
      .map(l => ({obra:l[0].obra, op:l[0].op, n:l.length, m2:l.reduce((s,i)=>s+(Number(i.m2)||0),0), f1:minF(l,campo), f2:maxF(l,campo), rem:[...new Set(l.map(i=>i.remision).filter(Boolean))]}))
      .sort((x,y) => nat(y.f2, x.f2) || nat(x.obra,y.obra) || nat(x.op,y.op));
    const m2 = items.reduce((s,i)=>s+(Number(i.m2)||0),0);
    return `<div class="pl-card">
      <div class="pl-head"><span class="n ${per?'':'sin'}">${per ? esc(per) : 'Sin '+quien}</span>
        <span class="m"><b>${fmtN(items.length)}</b> ítem${items.length===1?'':'s'} · ${fmtN(m2,1)} m²</span></div>
      ${filas.map(f => `<button class="pl-row" onclick="${plGoF(f.obra, f.op, per, campo, a, b, lbl)}">
        <span class="o">${esc(f.obra)} · <em>OP ${esc(f.op||'—')}</em></span><span class="k">${fmtN(f.n)}</span>
        <span class="d">${fmtN(f.m2,1)} m²${varios ? ' · '+(f.f1===f.f2 ? fmtD(f.f1) : fmtD(f.f1)+' – '+fmtD(f.f2)) : ''}${quien==='instalador' && f.rem.length ? ' · Rem. '+esc(f.rem.slice(0,3).join(', '))+(f.rem.length>3?'…':'') : ''}</span></button>`).join('')}
    </div>`; }).join('')}</div>`;
}
const plGoF = (obra, op, q, campo, d1, d2, label) => `openObra(decodeURIComponent('${encQ(obra)}'), false, '', {estado:'TODOS', op:decodeURIComponent('${encQ(op)}'), q:decodeURIComponent('${encQ(q)}'), rng:{campo:'${campo}', d1:'${d1}', d2:'${d2}', label:decodeURIComponent('${encQ(label)}')}})`;

// Agrupa por clave → Map
function grp(list, fk){ const m = new Map(); for(const it of list){ const k = fk(it); if(!m.has(k)) m.set(k, []); m.get(k).push(it); } return m; }
const minF = (l, k) => l.reduce((a,i) => i[k] && (!a || i[k] < a) ? i[k] : a, null);
const maxF = (l, k) => l.reduce((a,i) => i[k] && (!a || i[k] > a) ? i[k] : a, null);
const hora12 = h => { const [H,M] = String(h).split(':').map(Number); return `${H%12||12}:${pad(M||0)} ${H<12?'a. m.':'p. m.'}`; };
const encQ = v => encodeURIComponent(v||'').replace(/'/g,'%27');
const plGo = (obra, estado, op, q) => `openObra(decodeURIComponent('${encQ(obra)}'), false, '', {estado:'${estado}', op:decodeURIComponent('${encQ(op)}'), q:decodeURIComponent('${encQ(q)}')})`;

function plPorEnsamblador(list){
  const g = [...grp(list, it => (it.ensamblador||'').trim()).entries()]
    .sort((a,b) => (a[0]==='') - (b[0]==='') || nat(a[0], b[0]));
  return `<div class="pl-grid">${g.map(([ens, items]) => {
    const filas = [...grp(items, it => it.obra + '\u0001' + (it.op||'')).values()]
      .map(l => { const p = l.filter(i => i.dia_inicio).sort((a,b) => (a.dia_inicio + (a.hora_inicio||'99')).localeCompare(b.dia_inicio + (b.hora_inicio||'99')))[0]; return {obra:l[0].obra, op:l[0].op, n:l.length, desde:p ? p.dia_inicio : null, hora:p && p.hora_inicio ? hora12(p.hora_inicio) : ''}; })
      .sort((a,b) => nat(a.desde||'9999', b.desde||'9999') || nat(a.obra,b.obra) || nat(a.op,b.op));
    const nob = new Set(items.map(i=>i.obra)).size;
    return `<div class="pl-card">
      <div class="pl-head"><span class="n ${ens?'':'sin'}">${ens ? esc(ens) : 'Sin ensamblador'}</span>
        <span class="m"><b>${fmtN(items.length)}</b> ítem${items.length===1?'':'s'} · ${fmtN(nob)} obra${nob===1?'':'s'}</span></div>
      ${filas.map(f => { const d = diasDesde(f.desde); return `<button class="pl-row" onclick="${plGo(f.obra,'PRODUCCIÓN',f.op,ens)}">
        <span class="o">${esc(f.obra)} · <em>OP ${esc(f.op||'—')}</em></span><span class="k">${fmtN(f.n)}</span>
        <span class="d">${f.desde ? `Inició ${fmtD(f.desde)}${f.hora ? ' a las ' + f.hora : ''} · <span class="${d>7?'old':''}">${diasTxt(d)}</span>` : 'Sin fecha de inicio'}</span></button>`; }).join('')}
    </div>`; }).join('')}</div>`;
}

function plPorObra(list, st){
  const campo = st === 'EN COLA' ? ['fecha_op','OP del','min'] : st === 'ENSAMBLADO' ? ['dia_final','Último terminado','max'] : st === 'ENTREGAR' ? ['fecha_instalacion','Última instalación','max'] : ['fecha_despacho','Último despacho','max'];
  const g = [...grp(list, it => it.obra).entries()].sort((a,b) => nat(a[0], b[0]));
  return `<div class="pl-grid">${g.map(([obra, items]) => {
    const filas = [...grp(items, it => it.op||'').values()]
      .map(l => ({op:l[0].op, n:l.length, m2:l.reduce((a,i)=>a+(Number(i.m2)||0),0), f: campo[2]==='min' ? minF(l,campo[0]) : maxF(l,campo[0]), ens:[...new Set(l.map(i=>i.ensamblador).filter(Boolean))]}))
      .sort((a,b) => nat(a.op, b.op));
    const m2 = items.reduce((a,i)=>a+(Number(i.m2)||0),0);
    return `<div class="pl-card">
      <div class="pl-head"><span class="n">${esc(obra)}</span><span class="m"><b>${fmtN(items.length)}</b> ítems · ${fmtN(m2,1)} m²</span></div>
      ${st === 'ENTREGAR' && isGerente() ? `<div style="padding:0 14px 8px"><button class="btn sm ghost" onclick="marcarEntregada(decodeURIComponent('${encQ(obra)}'), true)">Marcar obra entregada</button></div>` : ''}
      ${filas.map(f => { const d = diasDesde(f.f); return `<button class="pl-row" onclick="${plGo(obra,st,f.op,'')}">
        <span class="o"><em>OP ${esc(f.op||'—')}</em>${st==='ENSAMBLADO' && f.ens.length ? ' · '+esc(f.ens.join(', ')) : ''}</span><span class="k">${fmtN(f.n)}</span>
        <span class="d">${fmtN(f.m2,1)} m²${f.f ? ` · ${campo[1]} ${fmtD(f.f)} · <span class="${st==='EN COLA'&&d>30 || st!=='EN COLA'&&d>7 ?'old':''}">${diasTxt(d)}</span>` : ''}</span></button>`; }).join('')}
    </div>`; }).join('')}</div>`;
}

// ════════════════════════════════════════════════════════════════
//  COBROS — pendiente por cobrar de despacho e instalación (todas las obras)
// ════════════════════════════════════════════════════════════════
function renderCobros(){
  if(!S.cobTipo) S.cobTipo = 'D';
  $('#app').innerHTML = shell(`${respaldoHTML()}
    <div class="tabs">${homeTabs()}</div>
    <div class="home-head">
      <div><div class="h1" id="cobH1">Por cobrar</div><div class="h1-sub"><span id="cobSub">Todas las obras · lo despachado o instalado que aún no se ha cobrado</span> · ${liveHTML()}</div></div>
      <div class="search">${ICON.search}<input id="qObra" placeholder="Buscar obra, OP o remisión…" value="${esc(S.q)}" autocomplete="off" autocapitalize="characters"></div>
    </div>
    <div class="seg-modo" id="cobSeg"></div>
    <div class="st-tiles cob-tiles" id="stTiles"></div>
    <div id="obrasBox"></div>`);
  const inp = $('#qObra');
  inp.oninput = () => { S.q = inp.value; renderCobrosBox(); };
  renderCobrosBox();
}
// Marcas (chulos) de OP durante un corte: se guardan en este equipo hasta registrar el cobro
// Al chulear una OP se guarda la lista EXACTA de ítems pendientes en ese momento.
// Lo que se registre después (p. ej. una instalación nueva) no entra en el corte.
const COBK = 'cob_marcas_v2';
function cobMarcas(){ try{ return JSON.parse(localStorage.getItem(COBK) || '{}'); }catch(e){ return S._cobMem || (S._cobMem = {}); } }
function cobGuardar(m){ try{ localStorage.setItem(COBK, JSON.stringify(m)); }catch(e){ S._cobMem = m; } }
const cobKey = (obra, op) => S.cobTipo + '|' + obra + '|' + (op||'');
const cobSnap = (obra, op) => { const v = cobMarcas()[cobKey(obra, op)]; return Array.isArray(v) ? v : null; };
const cobChk = (obra, op) => !!cobSnap(obra, op);
const cobItemsOp = op => { const c = S.cobIt; return c && c.map && c.map !== 'err' && c.key === S.cobTipo + '|' + S.cobObra ? (c.map.get(op || '') || []) : null; };
function cobToggle(obra, op){
  const m = cobMarcas(), k = cobKey(obra, op);
  if(m[k]){ delete m[k]; }
  else {
    const l = cobItemsOp(op);
    if(!l){ toast('Espera un momento: cargando los ítems de la obra', true); return; }
    m[k] = l.map(x => x.id);
  }
  cobGuardar(m); renderCobrosBox();
}
function cobChkTodas(on){
  const m = cobMarcas();
  const rows = (S.cobPend||[]).filter(r => r.tipo === S.cobTipo && r.obra === S.cobObra);
  if(on && rows.some(r => !cobItemsOp(r.op))){ toast('Espera un momento: cargando los ítems de la obra', true); return; }
  rows.forEach(r => { const k = cobKey(r.obra, r.op); if(on){ if(!m[k]) m[k] = cobItemsOp(r.op).map(x => x.id); } else delete m[k]; });
  cobGuardar(m); renderCobrosBox();
}
async function cobRegistrar(){
  const obra = S.cobObra, tipo = S.cobTipo, k = tipo === 'D' ? 'despacho' : 'instalacion';
  const rows = S.cobPend.filter(r => r.tipo === tipo && r.obra === obra && cobChk(obra, r.op)).sort((a,b) => nat(a.op, b.op));
  if(!rows.length) return;
  toast('Revisando los ítems marcados…');
  let items, est;
  try{
    items = await API.obra(obra);
    est = new Map((await (isGerente() ? API.comercial : API.cobros).call(API, items.map(i => i.id))).map(c => [c.item_id, c]));
  }catch(e){ return toast(errMsg(e), true); }
  const byIdO = new Map(items.map(i => [i.id, i]));
  const ok = it => it && (tipo === 'D' ? it.despachado : it.instalado) && !(est.get(it.id) || {})['cobrado_' + k];
  const det = rows.map(r => {
    const snap = new Set(cobSnap(obra, r.op));
    const incl = [...snap].map(id => byIdO.get(id)).filter(ok);
    const nuevos = items.filter(it => (it.op || '') === (r.op || '') && ok(it) && !snap.has(it.id));
    return {op:r.op, incl, nuevos};
  });
  const ids = det.flatMap(d => d.incl.map(it => it.id));
  const nNuevos = det.reduce((a,d) => a + d.nuevos.length, 0);
  if(!ids.length){ toast('Los ítems marcados ya no están pendientes', true); return; }
  const lst = l => { const c = new Map(); l.forEach(it => c.set(it.item || '—', (c.get(it.item || '—') || 0) + 1)); return [...c].sort((a,b) => nat(a[0], b[0])).map(([x,n]) => esc(x) + (n > 1 ? ' ×' + n : '')).join(', '); };
  const body = `<div class="summary"><b>${fmtN(ids.length)} ítems</b> en ${fmtN(det.length)} OP — solo los que estaban pendientes cuando chuleaste cada OP.</div>
    <div class="cob-det">${det.map(d => `<div><b>OP ${esc(d.op||'—')}</b> · ${fmtN(d.incl.length)}: ${lst(d.incl)}${d.nuevos.length ? `<div class="cob-nuevo">+ ${fmtN(d.nuevos.length)} registrado${d.nuevos.length===1?'':'s'} después, NO se incluye${d.nuevos.length===1?'':'n'}: ${lst(d.nuevos)}</div>` : ''}</div>`).join('')}</div>
    ${nNuevos ? `<div class="warn"><b>${fmtN(nNuevos)}</b> ítem${nNuevos===1?'':'s'} de estas OP se registr${nNuevos===1?'ó':'aron'} después de chulear y quedan pendientes para el próximo corte. Si sí van en este corte, cancela, quita la marca de la OP y vuelve a chulearla.</div>` : ''}
    <div class="fgrid"><div class="field"><span class="lbl">Fecha corte</span><input type="date" id="cFecha" value="${today()}"></div>
      <div class="field"><span class="lbl"># Corte</span><input id="cNum" placeholder="Ej. 5"></div></div>`;
  openSheet('Marcar cobrado ' + (tipo === 'D' ? 'despacho' : 'instalación'), esc(obra), body, `Marcar ${fmtN(ids.length)} ítems`, async () => {
    const f = $('#cFecha').value, num = $('#cNum').value.trim();
    if(!f){ toast('Falta la fecha de corte', true); return false; }
    if(!num){ toast('Falta el número de corte', true); return false; }
    if(isGerente()) await API.upsertComercial(ids.map(id => ({item_id:id, ['cobrado_'+k]:true, ['fecha_corte_'+k]:f, ['num_corte_'+k]:num})));
    else await API.marcarCobros(ids, k, true, f, num);
    const m = cobMarcas(); rows.forEach(r => delete m[cobKey(obra, r.op)]); cobGuardar(m);
    toast(`✓ ${fmtN(ids.length)} ítems marcados como cobrados · corte ${num}`);
    S.cobPend = null; S.cobCortes = null; S.cobH = null; renderCobrosBox();
  });
}
function setCobTipo(t){ S.cobTipo = t; S.cobObra = null; S.cobCorte = null; S.cobHSel = new Set(); renderCobrosBox(); }
function setCobObra(o){ S.cobObra = o; S.cobCorte = null; S.cobHq = ''; S.cobHSel = new Set(); renderCobrosBox(); window.scrollTo(0, o ? ($('#obrasBox').offsetTop - 70) : 0); }
async function loadCobPend(){
  if(S.cobLoading) return; S.cobLoading = true;
  try{ S.cobPend = await API.pendientesCobro(); S.cobErr = null; }
  catch(e){ S.cobPend = []; S.cobErr = /pendientes_cobro|schema cache|PGRST/i.test(errMsg(e)) ? 'Falta crear la consulta de cobros en Supabase (SQL "pendientes_cobro").' : errMsg(e); }
  S.cobLoading = false;
  if(S.view === 'home' && S.homeTab === 'cobros') renderCobrosBox();
}
// Ítems (números de ítem de la obra) pendientes por cobrar en cada OP — se leen al entrar a la obra
async function loadCobItems(obra, tipo){
  const pend = S.cobPend, key = tipo + '|' + obra;
  S.cobIt = {key, pend, map:null};
  try{
    const k = tipo === 'D' ? 'despacho' : 'instalacion';
    const cand = (await API.obra(obra)).filter(i => tipo === 'D' ? i.despachado : i.instalado);
    const est = new Map((await (isGerente() ? API.comercial : API.cobros).call(API, cand.map(i => i.id))).map(c => [c.item_id, c]));
    const map = new Map();
    for(const i of cand){ if((est.get(i.id) || {})['cobrado_' + k]) continue; const op = i.op || ''; if(!map.has(op)) map.set(op, []); map.get(op).push({id:i.id, item:i.item || '—'}); }
    for(const l of map.values()) l.sort((a,b) => nat(a.item, b.item));

  }catch(e){ if(S.cobIt && S.cobIt.key === key) S.cobIt.map = 'err'; }
  if(S.view === 'home' && S.homeTab === 'cobros' && S.cobObra === obra) renderCobrosBox();
}
function cobItemsHTML(obra, op){

function setCobModo(m, obra){ S.cobModo = m; S.cobObra = obra || null; S.cobCorte = null; S.cobHq = ''; S.cobHSel = new Set(); renderCobrosBox(); window.scrollTo(0, 0); }
async function loadCobCortes(){
  if(S.cobCLoading) return; S.cobCLoading = true;
  try{ S.cobCortes = await API.cortesCobro(); S.cobCErr = null; }
  catch(e){ S.cobCortes = []; S.cobCErr = /cortes_cobro|schema cache|PGRST/i.test(errMsg(e)) ? 'Falta crear la consulta de cortes en Supabase (SQL "11_secuencia_y_cortes").' : errMsg(e); }
  S.cobCLoading = false;
  if(S.view === 'home' && S.homeTab === 'cobros') renderCobrosBox();
}
async function loadCobH(obra, tipo){
  const key = tipo + '|' + obra, k = tipo === 'D' ? 'despacho' : 'instalacion';
  S.cobH = {key, items:null};
  try{
    const items = await API.obra(obra);
    const est = new Map((await (isGerente() ? API.comercial : API.cobros).call(API, items.map(i => i.id))).map(c => [c.item_id, c]));
    const out = [];
    for(const i of items){ const c = est.get(i.id); if(!c || !c['cobrado_' + k]) continue;
      out.push({id:i.id, op:i.op || '', item:i.item || '—', ubicacion:i.ubicacion, piso:i.piso, m2:i.m2, num:c['num_corte_' + k] || '', fecha:c['fecha_corte_' + k]}); }
    if(S.cobH && S.cobH.key === key) S.cobH.items = out;
  }catch(e){ if(S.cobH && S.cobH.key === key){ S.cobH.items = []; S.cobH.err = errMsg(e); } }
  if(S.view === 'home' && S.homeTab === 'cobros' && S.cobModo === 'hecho' && S.cobObra === obra) renderCobrosBox();
}
const corteLbl = n => n ? 'Corte ' + n : 'Sin # de corte';
function renderCobradosBox(){

  const T = [['D','Cobrado despacho','var(--desp)'],['I','Cobrado instalación','var(--inst)']];
  if(tiles) tiles.innerHTML = T.map(([k,t,c]) => {

      <span class="t">$ ${t}</span><b>${fmtN(l.length)}</b>
      <span>corte${l.length===1?'':'s'} · ${fmtN(ob)} obra${ob===1?'':'s'} · ${fmtN(sum(l,'n'))} ítems</span></button>`;
  }).join('');

  if(!S.cobObra || !all.some(r => r.obra === S.cobObra)){
    S.cobObra = null;
    const list = all.filter(r => !q || [r.obra, r.num].some(v => v && String(v).toUpperCase().includes(q)));

    const g = [...grp(list, r => r.obra).entries()].sort((a,b) => nat(a[0], b[0]));
    h += `<div class="cob-grid">${g.map(([obra, rows]) => `<button class="cob-ob" onclick="setCobObra(decodeURIComponent('${encQ(obra)}'))">

      </button>`).join('')}</div>`;
    box.innerHTML = h; return;

  const hq = (S.cobHq || '').trim().toUpperCase();

      </select></div>

      <button class="btn sm ghost" onclick="cobHTodos(true)">Seleccionar visibles</button></div>
    <div id="cobHList">${cobHListHTML(vis)}</div>
  </div>`;
  box.innerHTML = h;
  const inp = $('#cobHq');
  inp.oninput = () => { S.cobHq = inp.value; const v2 = S.cobH.items.filter(i => (S.cobCorte == null || i.num === S.cobCorte) && (!inp.value.trim() || [i.item, i.op, i.ubicacion, i.piso].some(v => v != null && String(v).toUpperCase().includes(inp.value.trim().toUpperCase())))); $('#cobHList').innerHTML = cobHListHTML(v2); };
  cobHSelbar();
}
function cobHListHTML(vis){
  if(!vis.length) return '<div class="empty" style="border:0">No hay ítems con ese filtro.</div>';

  return g.map(([op, l]) => { l.sort((a,b) => nat(a.item, b.item) || a.id - b.id);

      <span class="o"><span class="cob-ck">${todos ? ICON.check : ''}</span><em>OP ${esc(op||'—')}</em></span><span class="k">${fmtN(l.length)}</span></div>

}
function cobHVis(){ const hq = (S.cobHq||'').trim().toUpperCase(); return S.cobH.items.filter(i => (S.cobCorte == null || i.num === S.cobCorte) && (!hq || [i.item, i.op, i.ubicacion, i.piso].some(v => v != null && String(v).toUpperCase().includes(hq)))); }
function cobHRefresh(){ $('#cobHList').innerHTML = cobHListHTML(cobHVis()); cobHSelbar(); }
function setCobCorte(n){ S.cobCorte = n; S.cobHSel = new Set(); renderCobrosBox(); }
function cobHTog(id){ const s = S.cobHSel; if(s.has(id)) s.delete(id); else s.add(id); cobHRefresh(); }
function cobHOp(op){ const l = cobHVis().filter(i => i.op === op), s = S.cobHSel, todos = l.every(i => s.has(i.id)); l.forEach(i => todos ? s.delete(i.id) : s.add(i.id)); cobHRefresh(); }
function cobHTodos(on){ cobHVis().forEach(i => on ? S.cobHSel.add(i.id) : S.cobHSel.delete(i.id)); cobHRefresh(); }
function cobHSelbar(){
  let bar = $('#cobHBar'); const n = S.cobHSel ? S.cobHSel.size : 0;

    <button class="icon-btn" title="Quitar selección" onclick="S.cobHSel.clear(); cobHRefresh()">${ICON.close}</button>`;
}
function cobQuitar(){
  const tipo = S.cobTipo, k = tipo === 'D' ? 'despacho' : 'instalacion', obra = S.cobObra;
  const l = S.cobH.items.filter(i => S.cobHSel.has(i.id)); if(!l.length) return;
  const cs = [...new Set(l.map(i => corteLbl(i.num)))];
  const res = [...grp(l, i => i.op).entries()].sort((a,b) => nat(a[0], b[0])).map(([op, x]) => {
    const c = new Map(); x.forEach(i => c.set(i.item, (c.get(i.item)||0) + 1));
    return `<div><b>OP ${esc(op||'—')}</b> · ${[...c].map(([it, n]) => esc(it) + (n > 1 ? ' ×'+n : '')).join(', ')}</div>`; }).join('');

    S.cobH = null; S.cobCortes = null; S.cobPend = null; S.cobCortes = null; S.cobH = null; S.cobHSel = new Set();
    renderCobrosBox();
  });
}

  const all = [...m.values()];
  const soloCola = all.filter(o => o.cola === o.n).length;
  const resumen = S.anio === 'S/F'
    ? `<div class="h1-sub" style="margin:-4px 0 14px">${fmtN(all.length)} obras con ítems sin fecha de producción registrada</div>`
    : `<div class="h1-sub" style="margin:-4px 0 14px"><b style="color:var(--text)">${fmtN(all.length - soloCola)}</b> obras con producción en ${S.anio}${soloCola ? ` · <b style="color:var(--cola)">${fmtN(soloCola)}</b> solo con ítems en cola (OP de ${S.anio})` : ''}</div>`;
  $('#obrasBox').innerHTML = resumen + (list.length
    ? `<div class="grid-obras">${list.map(o => anualCard(o, idx.obraYears.get(o.obra))).join('')}</div>`
    : `<div class="empty">No hay obras${q ? ' que coincidan con “'+esc(S.q)+'”' : ''} en ${esc(S.anio)}.</div>`);
}

function anualCard(o, ys){
  const seg = [['cola','var(--cola)'],['planta','var(--ens)'],['desp','var(--desp)'],['inst','var(--inst)']];
  const bar = seg.map(([k,c]) => o[k] ? `<i style="width:${o[k]/o.n*100}%;background:${c}"></i>` : '').join('');
  const span = yearsTxt(ys);
  const multi = ys && [...ys].filter(y=>y!=='S/F').length > 1;
  return `<button class="obra-card" onclick="openObra(decodeURIComponent('${encodeURIComponent(o.obra)}'), false, '${S.anio}')">
    <div><div class="oc-name">${esc(o.obra)}</div>
      <div class="oc-meta">${S.anio==='S/F' ? fmtN(o.n)+' ítems sin fecha de producción' : (o.cola===o.n ? `<span style="color:var(--cola)">Solo en cola · ${fmtN(o.n)} ítems con OP de ${S.anio}</span>` : `${fmtN(o.n-o.cola)} fabricados en ${S.anio}${o.cola ? ` · ${fmtN(o.cola)} en cola` : ''}`)}${multi ? ` · <span style="color:var(--text2)">obra ${span}</span>` : ''}</div></div>
    <div class="bar">${bar}</div>
    <div class="oc-nums">
      <div><b style="color:var(--cola)">${fmtN(o.cola)}</b><span>En cola</span></div>
      <div><b>${fmtN(o.planta)}</b><span>Planta</span></div>
      <div><b>${fmtN(o.desp)}</b><span>Por inst.</span></div>
      <div><b style="color:var(--inst)">${fmtN(o.inst)}</b><span>Instal.</span></div>
    </div></button>`;
}

function renderObrasBox(res){
  const q = S.q.trim().toUpperCase();
  const list = q ? res.filter(o => o.obra.toUpperCase().includes(q)) : res;
  let h = list.length ? `<div class="grid-obras">${list.map(obraCard).join('')}</div>`
                      : `<div class="empty">${q ? 'Ninguna obra activa coincide con “'+esc(S.q)+'”.' : 'No hay obras con ítems pendientes.'}</div>`;
  // Otras obras (terminadas): búsqueda en toda la base
  if(q.length >= 2){
    if(S.obrasAll){
      const act = new Set(res.map(o=>o.obra));
      const cnt = new Map();
      for(const o of S.obrasAll) if(!act.has(o) && o.toUpperCase().includes(q)) cnt.set(o,(cnt.get(o)||0)+1);
      const other = [...cnt.entries()].sort((a,b)=>nat(a[0],b[0]));
      if(other.length) h += `<div class="section-t">Obras terminadas</div><div class="other-list">${other.slice(0,60).map(([o,n])=>`<button onclick="openObra(decodeURIComponent('${encodeURIComponent(o)}'))"><b>${esc(o)}</b><span>${fmtN(n)}</span></button>`).join('')}</div>`;
    } else {
      h += `<div class="section-t">Obras terminadas</div><div><button class="btn sm" onclick="buscarTodas()">Buscar también en obras terminadas</button></div>`;
    }
  }
  $('#obrasBox').innerHTML = h;
}

async function buscarTodas(){
  $('#obrasBox').insertAdjacentHTML('beforeend','<div class="loading"><div class="spin"></div>Buscando en toda la base</div>');
  try{ S.obrasAll = S.anual ? S.anual.map(r=>r.obra) : await API.todasObras(); }catch(e){ toast('Error: '+e.message, true); }
  renderObrasBox(resumenObras());
}

function obraCard(o){
  const seg = ['EN COLA','PRODUCCIÓN','ENSAMBLADO','DESPACHADO'];
  const bar = seg.map(k => o[k] ? `<i style="width:${o[k]/o.n*100}%;background:${STAGES[k].c}"></i>` : '').join('');
  return `<button class="obra-card" onclick="openObra(decodeURIComponent('${encodeURIComponent(o.obra)}'))">
    <div><div class="oc-name">${esc(o.obra)}</div><div class="oc-meta">${fmtN(o.n)} ítems pendientes</div></div>
    <div class="bar">${bar}</div>
    <div class="oc-nums">
      <div><b style="color:var(--cola)">${fmtN(o['EN COLA'])}</b><span>En cola</span></div>
      <div><b>${fmtN(o['PRODUCCIÓN']+o['ENSAMBLADO'])}</b><span>Planta</span></div>
      <div><b>${fmtN(o.porDesp)}</b><span>Por desp.</span></div>
      <div><b>${fmtN(o.porInst)}</b><span>Por inst.</span></div>
      <div title="Instalados que aún no están en un acta de entrega"><b style="${o.porEnt ? 'color:var(--inst)' : ''}">${fmtN(o.porEnt || 0)}</b><span>Por entregar</span></div>
    </div></button>`;
}

// ════════════════════════════════════════════════════════════════
//  VISTA DE OBRA
